# Operator declaration of one fixed-model pool and its direct members.
# Replace every endpoint, model and engine set with the actual deployment.
version: 1
pool:
  id: local-pilot
  model: fixture-model
  scope:
    kind: static_members
  members:
    - id: replica-a
      inference_endpoint: http://127.0.0.1:8000/v1
      metrics_endpoint: http://127.0.0.1:8000/metrics
      engines: ["0"]
      # Optional environment variable name, never the bearer value:
      # metrics_bearer_env: PILOT_METRICS_TOKEN
      # inference_bearer_env: PILOT_INFERENCE_TOKEN
observation:
  timeout_ms: 2000
  max_body_bytes: 1048576
  max_sample_age_ms: 15000
# Optional pilot execution. Omit this whole block to retain observation only.
# Enabling it requires operator calibration and an exclusive persistent volume.
# These numbers illustrate structure; they do not establish safe production limits.
execution:
  enabled: false
  exclusive_pool_owner: true
  allow_collection_only_metrics: false
  state_dir: /var/lib/bitrouter/connector-local-pilot
  auth_bearer_env: PILOT_LOCAL_TOKEN
  max_dispatch_rps: 0.1
  burst: 1
  max_extra_inflight: 1
  max_records: 10000
  max_input_tokens: 1024
  max_output_tokens: 128
  max_deadline_ms: 30000
  max_request_bytes: 65536
  max_response_bytes: 1048576
  stream_idle_timeout_ms: 10000
  lease_ms: 5000
  update_interval_ms: 1000
  health_window_ms: 10000
  max_running_requests: 2
  max_waiting_requests: 0
  max_kv_cache_usage_fraction: 0.5
