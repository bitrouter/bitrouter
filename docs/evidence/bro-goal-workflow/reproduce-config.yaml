# Relocatable R16 connection shape; external services and a fresh private profile are prerequisites.
---
inherit_defaults: false
server:
  listen: 127.0.0.1:54322
  skip_auth: true
registry:
  enabled: false
database:
  url: sqlite://${BRO_GOAL_REPRO_HOME}/daemon.db?mode=rwc
acp_recording:
  enabled: true
providers:
  live-openrouter:
    api_base: https://openrouter.ai/api/v1
    api_key: "${OPENROUTER_API_KEY}"
    api_protocol:
    - "*": responses
    models:
    - id: openai/gpt-6.1-sol
      capabilities:
      - tools
      - reasoning
      token_limits:
        max_input_tokens: 1050000
        max_output_tokens: 128000
        context_window: 1050000
      pricing:
        input_micro_usd_per_token: 2
        output_micro_usd_per_token: 10
        cache_read_micro_usd_per_token: 0.1
        cache_write_micro_usd_per_token: 2.5
        context_tiers:
        - above_input_tokens: 272000
          input_micro_usd_per_token: 4
          output_micro_usd_per_token: 15
          cache_read_micro_usd_per_token: 0.2
          cache_write_micro_usd_per_token: 5
  live-openrouter-chat:
    api_base: https://openrouter.ai/api/v1
    api_key: "${OPENROUTER_API_KEY}"
    api_protocol:
    - "*": chat_completions
    models:
    - id: openai/gpt-6.1-sol
      capabilities:
      - tools
      - reasoning
      token_limits:
        max_input_tokens: 1050000
        max_output_tokens: 128000
        context_window: 1050000
      pricing:
        input_micro_usd_per_token: 2
        output_micro_usd_per_token: 10
        cache_read_micro_usd_per_token: 0.1
        cache_write_micro_usd_per_token: 2.5
        context_tiers:
        - above_input_tokens: 272000
          input_micro_usd_per_token: 4
          output_micro_usd_per_token: 15
          cache_read_micro_usd_per_token: 0.2
          cache_write_micro_usd_per_token: 5
  live-openrouter-messages:
    api_base: https://openrouter.ai/api/v1
    api_key: "${OPENROUTER_API_KEY}"
    api_protocol:
    - "*": messages
    models:
    - id: anthropic/claude-opus-5.5
      capabilities:
      - tools
      - reasoning
      token_limits:
        context_window: 1000000
        max_output_tokens: 128000
models:
  gpt-6.1-sol:
    endpoints:
    - provider: live-openrouter
      service_id: openai/gpt-6.1-sol
  gpt-6.1-chat:
    endpoints:
    - provider: live-openrouter-chat
      service_id: openai/gpt-6.1-sol
  claude-worker:
    endpoints:
    - provider: live-openrouter-messages
      service_id: anthropic/claude-opus-5.5
chat:
  model: gpt-6.1-sol
decision_model:
  model: typesafe/jev-1.13
  base_url: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  pricing:
    input_usd_per_million: 0.042
    output_usd_per_million: 0
    max_input_tokens: 32000
agents:
  claude-live:
    name: claude-live
    transport:
      type: stdio
      command: npx
      args:
      - "-y"
      - "@agentclientprotocol/claude-agent-acp@0.75.1"
      env:
        CLAUDE_CONFIG_DIR: "${BRO_GOAL_REPRO_HOME}/claude-profile"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        MAX_THINKING_TOKENS: '0'
