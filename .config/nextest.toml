# A test that hangs takes the whole job with it. That is worse than it sounds:
# GitHub only uploads a job's logs when the job ends cleanly, so a hung run
# produces a ~49 minute failure with no logs, no failing test name, and nothing
# to read — which is exactly the shape `test (ubuntu-latest)` has been failing
# in on this repo while macOS and Windows pass the identical tree.
#
# Report anything over a minute as SLOW, and kill it after five. The whole
# suite finishes in ~2 minutes when it is healthy and the slowest deliberate
# wait in it is a 5 second polling budget, so five minutes is far outside any
# legitimate test while still ending the job cleanly enough to get logs.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Explicitly ignored acceptance launches hundreds of sequential native sessions
# through external ACP workers. Its publication and rollback workload exceeds
# the ordinary suite deadline; each prompt and evaluation is separately bounded.
[[profile.default.overrides]]
filter = 'test(acp_cli::evolution_acceptance::publication::)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The opt-in terminal campaign retains the product's 10% initial allocation and
# real worker tool execution. Its per-operation and total workload are bounded.
[[profile.default.overrides]]
filter = 'test(tui_coding_publication_and_rollback)'
slow-timeout = { period = "60s", terminate-after = 41 }
