# A test that hangs takes the whole job with it. That is worse than it sounds:
# GitHub only uploads a job's logs when the job ends cleanly, so a hung run
# produces a ~49 minute failure with no logs, no failing test name, and nothing
# to read — which is exactly the shape `test (ubuntu-latest)` has been failing
# in on this repo while macOS and Windows pass the identical tree.
#
# Report anything over a minute as SLOW, and kill it after five unless an
# explicit campaign override below provides a larger bounded allowance.
# Capacity parents are compiled into the shared archive but explicitly ignored
# by ordinary runs; CI selects their exact names in serial capacity lanes.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# CI archives the already-built examples as well as the Cargo test executables.
# https://nexte.st/docs/ci-features/archiving/#adding-extra-files-to-an-archive
[profile.ci.junit]
path = "junit.xml"

[profile.ci-service]
archive.include = [
    { path = "debug/bitrouter", relative-to = "target", on-missing = "error" },
    { path = "debug/examples", relative-to = "target", depth = 1, on-missing = "error" },
]

[profile.ci-service-process]
archive.include = [
    { path = "debug/bitrouter", relative-to = "target", on-missing = "error" },
]

[profile.ci-bro]
archive.include = [
    { path = "debug/bro", relative-to = "target", on-missing = "error" },
    { path = "debug/examples/bro_acp_fixture", relative-to = "target", on-missing = "error" },
]

# Serialize managed tree and checkpoint workloads while preserving the
# concurrency and product limits exercised within each test.
# https://nexte.st/docs/configuration/test-groups/
[test-groups]
core-tree-pressure = { max-threads = 1 }
shared-gateway-process = { max-threads = 1 }

# Complete history checks each retain the ordinary five-minute deadline. Reserve
# the runner while hashing/revalidating their real histories and archive cycles.
[[profile.default.overrides]]
filter = 'test(=tenancy::tests::capacity_history::archive_cycles_preserve_unknowns_and_current_read_authority)'
threads-required = "num-test-threads"

# Each shared process campaign owns a PostgreSQL workload and multiple servers.
# Keep separate campaigns from competing for host resources, including the
# delayed-database C16 cases. Concurrency inside each campaign is unchanged.
[[profile.default.overrides]]
filter = 'test(gateway::shared::runtime::process_tests::)'
test-group = 'shared-gateway-process'

[[profile.default.overrides]]
filter = 'binary(=managed_native) & (test(=full_tree_runs_four_models_and_delivers_each_conclusion_once) | test(=the_tree_shares_one_model_attempt_budget_across_all_workers))'
test-group = 'core-tree-pressure'

[[profile.default.overrides]]
filter = 'binary(=managed_native) & test(=large_cold_checkpoint_keeps_multiturn_context_and_sixteen_step_tool_loop)'
test-group = 'core-tree-pressure'
slow-timeout = { period = "60s", terminate-after = 10 }

# This opt-in campaign creates every one of the frozen 100,000 operation rows
# through the HTTP SDK. Only the aggregate test allowance is larger; individual
# management, SQL, offline and cleanup deadlines keep their product bounds.
[[profile.default.overrides]]
filter = 'test(offline::recovery::tests::saturation::)'
slow-timeout = { period = "60s", terminate-after = 35 }

# Dedicated history qualifications use the existing optimized ci-capacity build.
# These are test execution envelopes, not product history or operation deadlines.
[[profile.default.overrides]]
filter = 'test(=tenancy::tests::capacity_history::large_history_qualification)'
slow-timeout = { period = "60s", terminate-after = 120 }

# Separate opt-in offline proofs retain actual large inputs. Ordinary adapter
# tests keep their existing deadline; these allowances apply only to these names.
[[profile.default.overrides]]
filter = 'test(=tenancy::audit::recovery::v2::tests::credentials::million_row_source_checks_every_fresh_hash_and_late_historical_match)'
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = 'test(=tenancy::audit::recovery::v2::tests::cli_scale::real_cli_dense_and_sparse_snapshot_verify_audit_restore)'
slow-timeout = { period = "60s", terminate-after = 20 }
