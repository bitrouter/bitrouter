# A test that hangs takes the whole job with it. That is worse than it sounds:
# GitHub only uploads a job's logs when the job ends cleanly, so a hung run
# produces a ~49 minute failure with no logs, no failing test name, and nothing
# to read — which is exactly the shape `test (ubuntu-latest)` has been failing
# in on this repo while macOS and Windows pass the identical tree.
#
# Report anything over a minute as SLOW, and kill it after five. The whole
# suite finishes in ~2 minutes when it is healthy and the slowest deliberate
# wait in it is a 5 second polling budget, so five minutes is far outside any
# legitimate test while still ending the job cleanly enough to get logs.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# CI archives the already-built examples as well as the Cargo test executables.
# https://nexte.st/docs/ci-features/archiving/#adding-extra-files-to-an-archive
[profile.ci]
archive.include = [
    { path = "debug/examples", relative-to = "target", depth = 1, on-missing = "error" },
]

[profile.ci.junit]
path = "junit.xml"

# These cases serialize and validate full 32-agent checkpoint histories. Avoid
# competing large fixtures on small CI hosts; each case still overlaps four
# model futures and keeps the ordinary timeout and all product limits.
# https://nexte.st/docs/configuration/test-groups/
[test-groups]
core-tree-pressure = { max-threads = 1 }
shared-gateway-process = { max-threads = 1 }

# These two real-provider campaigns fill the unchanged 8 MiB Choice receipt
# budget over dozens of native turns. Full growing snapshots are deliberately
# retained and checked on every turn; debug serialization needs a bounded
# aggregate allowance beyond each unchanged operation deadline.
[[profile.default.overrides]]
filter = 'test(tenancy::tests::execution::native::session::choice::headroom::)'
test-group = 'core-tree-pressure'
slow-timeout = { period = "60s", terminate-after = 35 }

# This fixed 128-run campaign grows shared retained experiment history.
# Reserve all test slots so unrelated cases cannot consume its 180s aggregate
# budget. Internal concurrency, operation deadlines and assertions are unchanged.
[[profile.default.overrides]]
filter = 'test(=tenancy::tests::execution::native::session::experiment::consumer::native_mixed_arm_campaign_reconciles_every_real_unit_in_one_frozen_cohort)'
threads-required = "num-test-threads"

# Each shared process campaign owns a PostgreSQL workload and multiple servers.
# Keep separate campaigns from competing for host resources, including the
# delayed-database C16 cases. Concurrency inside each campaign is unchanged.
[[profile.default.overrides]]
filter = 'test(gateway::shared::runtime::process_tests::)'
test-group = 'shared-gateway-process'

[[profile.default.overrides]]
filter = 'test(capacity::tree_limits::maximum_tree_)'
test-group = 'core-tree-pressure'

# Native long-loop and ACP replay cases serialize growing Core checkpoints too.
# Share the existing pressure group so they do not compete with full-tree and
# cold-recovery workloads. Keep their ordinary timeout and product limits.
[[profile.default.overrides]]
filter = 'test(native_checkpoint_capacity_failure_reports_the_resource_cause) | test(native_long_tool_loop_completes_beyond_old_checkpoint_capacity) | test(unicode_stream_reconciles_once_and_replays_beyond_hot_history) | test(stalled_replay_disconnects_observer_without_cancelling_native_history)'
test-group = 'core-tree-pressure'

# A native cold recovery replays several multi-megabyte checkpoints before
# admitting another Turn. Its debug serialization exceeded five minutes on
# the two-core Linux runner when overlapping the full-tree cases. Serialize
# those workloads and give only this end-to-end recovery case ten minutes.
[[profile.default.overrides]]
filter = 'test(native_large_checkpoint_keeps_next_turn_admissible_after_cold_recovery)'
test-group = 'core-tree-pressure'
slow-timeout = { period = "60s", terminate-after = 10 }

# Explicitly ignored acceptance launches hundreds of sequential native sessions
# through external ACP workers. Its publication and rollback workload exceeds
# the ordinary suite deadline; each prompt and evaluation is separately bounded.
[[profile.default.overrides]]
filter = 'test(acp_cli::evolution_acceptance::publication::)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The opt-in terminal campaign retains the product's 10% initial allocation and
# real worker tool execution. Its per-operation and total workload are bounded.
[[profile.default.overrides]]
filter = 'test(tui_coding_publication_and_rollback)'
slow-timeout = { period = "60s", terminate-after = 41 }

# This opt-in campaign creates every one of the frozen 100,000 operation rows
# through the HTTP SDK. Only the aggregate test allowance is larger; individual
# management, SQL, offline and cleanup deadlines keep their product bounds.
[[profile.default.overrides]]
filter = 'test(offline::recovery::tests::saturation::)'
slow-timeout = { period = "60s", terminate-after = 35 }
