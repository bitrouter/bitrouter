# A hung test must fail by name, not by killing the runner.
#
# On PR #816 a test wedged on `ubuntu-latest`; the job ran 49 minutes until the
# hosted runner lost communication, and the log blob was never uploaded — so
# the failure named no test and left nothing to read. These bounds convert that
# into an ordinary, diagnosable failure.
#
# `period` is generous because the suite legitimately spawns daemons and agent
# subprocesses; `terminate-after` is what turns a hang into a verdict.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
# A test that returns while a descendant still holds its output pipe is a
# "leaky" test. Locally that is a warning; on a Linux CI runner the held pipe
# keeps the *step* alive after the suite finishes, until the runner is killed
# for unresponsiveness — which is how #816 burned 48 minutes per run and
# destroyed its own log. Spawn a subprocess, reap it.
# 2s, not something tighter: an HTTP client's pooled connection can outlive
# its test by a few hundred milliseconds, and failing that would be noise. The
# failure this guards against — an orphaned subprocess holding the pipe — holds
# it indefinitely, so a generous bound still catches it.
leak-timeout = "2s"


# CI has no tty and no operator: fail rather than retry into another 49-minute
# stall, and keep the leaf output so a failure is readable without a re-run.
[profile.ci]
# Bounded parallelism, and this is a mitigation rather than a diagnosis.
#
# Established on #816: every one of the seven partitions passes on
# ubuntu-latest, together covering all 2503 tests, and the whole suite passes
# there serially in 3m6s — but the same suite in the same job hangs
# indefinitely in parallel, until the runner stops answering and takes its own
# log with it. macOS and Windows are unaffected. No test is terminated by
# `terminate-after`, so nothing is individually stuck; the contention is
# between tests running at once over something machine-global.
#
# Two threads keeps CI deterministic for well under a minute of wall-clock
# (serial is 3m6s against a 2m29s parallel baseline on main). The root cause is
# still unidentified — if you are here because CI got slow, find it rather than
# raising this number.
test-threads = 2
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"
fail-fast = false
# Reported, not fatal. Several tests that predate #816 leak intermittently and
# `main` is green with them, so a leak is not by itself the thing that kills a
# runner — failing on it would buy flakiness without buying a diagnosis.
leak-timeout = "2s"
