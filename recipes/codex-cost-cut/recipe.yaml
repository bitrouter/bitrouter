# Codex + GPT-5.5 with learned Kimi downgrades.
#
# Numbers come from experiment 001 (Terminal-Bench 2.1, 88-task comparable set,
# one attempt per task) — see `source_url` for the full report and its stated
# limitations. `runs: 1` is not a rounding detail: single-attempt scores are
# noisy, and the site shows it next to the delta for that reason.

slug: codex-cost-cut
status: published

title:
  en: "Codex on GPT-5.5, a third cheaper"
  zh: "Codex + GPT-5.5：成本降三成"

description:
  en: >-
    Keeps GPT-5.5 on the planning turn and lets BitRouter learn which routine
    tool-follow-up steps can drop to Kimi K2.7 Code, escalating any downgrade
    that starts failing.
  zh: >-
    规划回合仍走 GPT-5.5，由 BitRouter 学习哪些常规工具后续步骤可以降级到
    Kimi K2.7 Code；一旦降级开始失败会自动升回。

workflow: coding
harness: [codex]
objectives: [cost]
updated_at: 2026-07-25

evaluation:
  eval: terminal-bench-2.1
  harness: codex
  config: policy-round-r2
  measured_by: bitrouter
  source_url: https://github.com/bitrouter/bitrouter/blob/main/benchmarks/001-2026-07-10-tbench-v2.1-codex-gpt55-kimi-k27.md
  as_of: 2026-07-14
  runs: 1
  baseline:
    label: "GPT-5.5 only, no routing"
    accuracy: 77.27
    # $330.70 over the 88-task comparable set.
    cost_per_task: 3.758
  recipe:
    label: "GPT-5.5 with learned Kimi K2.7 Code downgrades"
    accuracy: 76.14
    # $222.22 over the same 88 tasks.
    cost_per_task: 2.525
