name: CI
'on':
  push:
    branches:
    - v1
    - main
  pull_request:
    branches:
    - '**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      registry: ${{ steps.paths.outputs.registry }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: paths
      name: Classify changes without omitting the aggregate check
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=false
        registry=false
        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          code=true
          registry=true
        else
          git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/ci-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              registry/*|dist/registry/*|apps/bitrouter/registry-dist/*) registry=true ;;
              docs/specs/*) code=true ;;
              docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/ci-paths"
        fi
        printf 'code=%s\nregistry=%s\n' "$code" "$registry" >> "$GITHUB_OUTPUT"
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: reject tracked files that match gitignore
      shell: bash
      run: |
        ignored_tracked="$(git ls-files -ci --exclude-standard)"
        if [[ -n "$ignored_tracked" ]]; then
          echo "::error::Tracked files must not also match .gitignore:"
          printf '%s\n' "$ignored_tracked"
          exit 1
        fi
    - name: reject standalone Python files
      shell: bash
      run: |
        python_files="$(git ls-files -- '*.py' '*.pyi' '*.pyw' '*.pyc')"
        if [[ -n "$python_files" ]]; then
          echo "::error::Use Rust for executable source and test fixtures:"
          printf '%s\n' "$python_files"
          exit 1
        fi
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check
  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: claude plugin validate (strict)
      run: |
        npm install -g @anthropic-ai/claude-code
        claude plugin validate . --strict
    - name: codex loader exercise (presence-asserted)
      run: |
        npm install -g @openai/codex
        export CODEX_HOME="$(mktemp -d)"
        codex plugin marketplace add "$PWD"
        codex plugin add bitrouter@bitrouter
        codex plugin list --json | tee /tmp/codex-plugins.json
        jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: clippy
    - run: cargo clippy --workspace --all-features --tests -- -D warnings
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  build-linux:
    name: build Linux test artifacts
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Validate independent consumer lockfiles before compilation
      run: |
        cargo metadata --locked --manifest-path apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml --format-version 1 > /dev/null
    - name: Build tests and process fixtures once
      run: |
        mkdir -p ci-evidence
        /usr/bin/time -v -o ci-evidence/build-tests.txt cargo nextest run --locked --workspace --all-features --build-jobs 2 --no-run
        /usr/bin/time -v -o ci-evidence/build-fixtures.txt cargo build --locked --workspace --all-features --examples --jobs 2
        # Archive without recompiling, including the now-built process fixtures.
        cargo nextest archive --locked --workspace --all-features --build-jobs 2 --profile ci --archive-file tests.tar.zst
        cargo nextest list --workspace --all-features --message-format json > ci-evidence/test-inventory.json
        printf '%s\n' "$GITHUB_SHA" > tests.sha
        printf '%s\n' "$GITHUB_WORKSPACE" > tests.workspace
        sha256sum tests.tar.zst > tests.tar.zst.sha256
        du -sh target tests.tar.zst > ci-evidence/build-size.txt
    - uses: actions/upload-artifact@v4
      with:
        name: linux-tests-${{ github.sha }}
        path: |-
          tests.tar.zst
          tests.tar.zst.sha256
          tests.sha
          tests.workspace
        compression-level: 0
        retention-days: 2
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-evidence
        path: ci-evidence/
        retention-days: 7
  test-linux:
    name: test (Linux, ${{ matrix.suite }})
    needs:
    - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
    - name: Run archived tests
      env:
        FILTER: ${{ matrix.filter }}
      run: bash .github/scripts/ci-test.sh ordinary --test-threads 2 -E "$FILTER"
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-evidence
        path: ci-evidence/
        retention-days: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - suite: modules
          filter: kind(lib) | kind(bin)
        - suite: integration
          filter: kind(test)
  test-process:
    name: test (Linux, process contracts)
    needs:
    - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
    - name: verify native child and file ownership under cleanup faults
      env:
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
      run: bash .github/scripts/ci-test.sh 0 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::session::custody::native36_real_child_and_file_owner_follow_actual_cleanup_disposition)'
    - name: verify owned capture child and cleanup consumers
      timeout-minutes: 10
      env:
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: bash .github/scripts/ci-test.sh 1 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::capture::real_controller_passive_modes_freeze_owned_prefix_without_judge_or_legacy_reads)
        | test(=tenancy::tests::execution::native::capture::revocation_refuses_new_content_but_retains_admitted_disconnect_cleanup) | test(=tenancy::tests::execution::native::capture::cancelled_initialize_waiter_keeps_real_child_owner_until_service_drain)
        | test(=tenancy::tests::execution::native::capture::failed_provider_initialization_keeps_partial_client_child_and_capture_until_joined) | test(=tenancy::tests::execution::native::capture::revoke_across_initialize_wait_prevents_the_next_provider_configuration_effect)
        | test(=tenancy::tests::execution::native::capture::ingress::real_unterminated_child_line_is_refused_before_sdk_accumulation) | test(=tenancy::tests::execution::native::capture::ingress::real_small_frame_flood_is_bounded_while_capture_writer_is_held)
        | test(=tenancy::tests::execution::native::capture::ingress::real_byte_flood_exhausts_cumulative_allowance_without_frame_reset) | test(=tenancy::tests::execution::native::capture::faults::capture_caught_reaper_unwind_retains_the_actual_child_and_file_owner)
        | test(=tenancy::tests::execution::native::capture::faults::capture_missed_child_cleanup_keeps_owner_even_after_the_same_child_is_reaped) | test(=harness::acp::up::owned::tests::process::reaped_leader_with_live_descendant_is_not_group_absence)
        | test(=tenancy::tests::execution::native::capture::faults::reap::exited_child_is_reaped_before_owned_capture_cleanup_ack) | test(=tenancy::tests::execution::native::capture::faults::reap::exited_leader_does_not_skip_owned_live_descendant_cleanup)'
    - name: verify managed Choice and paid controllers
      timeout-minutes: 20
      env:
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: bash .github/scripts/ci-test.sh 2 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::capture::learning::coexistence::joint_choice_and_assessment_use_one_imported_revision_with_separate_child_receipts)
        | test(=tenancy::tests::execution::native::capture::learning::qualification::controller::checked_controller_shutdown_retains_the_held_paid_execution_and_reaps_its_real_child)
        | test(=tenancy::tests::execution::native::capture::learning::qualification::controller::rejected_paid_controller_initialization_still_drains_the_real_owner_and_reaps)
        | test(=tenancy::tests::execution::native::capture::learning::real_checked_controller_checkpoint_is_the_paid_assessment_initiator)'
    - name: verify public Human checkpoint edits
      timeout-minutes: 20
      env:
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: bash .github/scripts/ci-test.sh 3 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::capture::learning::human::handoff::cancelled_manual_queue_wait_is_reconciled_by_the_next_real_acp_callback)
        | test(=tenancy::tests::execution::native::capture::learning::human::handoff::cancelled_manual_commit_or_domain_rollback_hands_off_before_the_next_acp_operation)
        | test(=tenancy::tests::execution::native::capture::learning::human::handoff::current_revoke_after_a_known_manual_commit_denies_new_public_actions) | test(=tenancy::tests::execution::native::capture::learning::human::limits::held_paid_terminal_keeps_the_last_history_row_and_review_remains_available)
        | test(=tenancy::tests::execution::native::capture::learning::human::limits::held_paid_byte_reservation_refuses_manual_growth_before_the_terminal) | test(=tenancy::tests::execution::native::capture::learning::human::limits::full_manual_history_has_no_hidden_paid_reservation_and_replay_does_not_grow_it)
        | test(=tenancy::tests::execution::native::capture::learning::human::required::faults::public_human_real_begin_failure_retains_owner) | test(=tenancy::tests::execution::native::capture::learning::human::required::faults::public_human_real_consuming_rollback_failure_retains_owner)
        | test(=tenancy::tests::execution::native::capture::learning::human::required::faults::public_human_real_consuming_commit_failure_retains_owner) | test(=tenancy::tests::execution::native::capture::learning::human::required::faults::public_human_caught_unwind_retains_owner)
        | test(=tenancy::tests::execution::native::capture::learning::human::required::two_public_editors_compare_the_same_head_and_only_one_commits) | test(=tenancy::tests::execution::native::capture::learning::human::required::cancelled_human_predecessor_keeps_its_original_deadline_on_the_next_acp_callback)
        | test(=tenancy::tests::execution::native::capture::learning::human::required::queued_manual_edit_rechecks_current_revoke_suspend_and_tenant_scope) | test(=tenancy::tests::execution::native::capture::learning::human::required::public_input_exact_512k_and_one_over_are_distinguished_before_sql)
        | test(=tenancy::tests::execution::native::capture::learning::human::public_human_correction_and_retraction_win_held_judge_without_losing_paid_facts) | test(=tenancy::tests::execution::native::capture::learning::human::public_manual_no_paid_profile_exact_replay_and_stale_head_leave_controller_healthy)
        | test(=tenancy::tests::execution::native::capture::learning::human::same_database_equal_native_names_do_not_adopt_another_controller_history) | test(=tenancy::tests::execution::native::capture::learning::human::historical_public_correction_retains_its_prefix_without_overwriting_a_newer_head)'
    - name: verify stopped native recovery
      timeout-minutes: 20
      env:
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: bash .github/scripts/ci-test.sh 4 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::session::choice::recovery::companion::authority::native_recovery_committed_repair_survives_revocation_expiry_and_lost_waiter)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::capacity::native_recovery_reserves_aggregate_unknown_room_before_any_repair_write)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::capacity::native_recovery_counts_released_peer_rows_in_one_cumulative_budget)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::capture::native_recovery_refuses_actual_capture_history_without_retained_reaper_proof)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::custody::native_recovery_unwind_and_overdue_commit_keep_the_exact_owner)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::profiles::native_recovery_refuses_uncovered_generation_and_auxiliary_but_reopens_released_v1)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::scope::native_recovery_checks_exact_seed_scope_and_real_acquisition_origin)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::startup::native_recovery_cancelled_startup_keeps_actual_pool_and_transaction_owner)
        | test(=tenancy::tests::execution::native::session::choice::recovery::companion::native_recovery_shared_parent_two_real_choices_are_deduplicated) | test(=tenancy::tests::execution::native::session::choice::recovery::marker::native_stopped_owner_marker_precedes_discovery_and_preserves_released_source)
        | test(=tenancy::tests::execution::native::session::choice::recovery::native_stopped_owner_actual_receipt_repair_and_no_resend)'
    - name: verify stopped paid recovery
      timeout-minutes: 20
      env:
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: bash .github/scripts/ci-test.sh 5 --test-threads 1 --run-ignored only -E 'test(=tenancy::tests::execution::native::capture::learning::recovery::custody::paid_bootstrap_actual_begin_error_keeps_owner_until_process_exit)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::custody::paid_bootstrap_actual_consuming_rollback_error_keeps_owner_until_process_exit)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::custody::paid_bootstrap_caught_unwind_keeps_owner_until_process_exit) | test(=tenancy::tests::execution::native::capture::learning::recovery::custody::paid_cancelled_bootstrap_waiter_does_not_cancel_the_claimed_writer)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_local_cleanup_without_exact_registry_ack_cannot_recover) | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_stopped_counter_pending_and_origin_corruption_refuse_without_repair)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_stopped_failed_judge_is_interrupted_without_refund_or_resend) | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_stopped_repair_preserves_the_actual_public_human_head)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_stopped_restart_preserves_known_usage_never_selects_or_resends_and_is_idempotent)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_bootstrap_two_real_distinct_revisions_fit_the_shared_operation_budget)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::restart::paid_missing_terminal_after_confirmed_local_stop_repairs_unknown_once_without_resend)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::commit::paid_repair_consuming_commit_error_keeps_owner_until_death_then_repairs_once)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::commit::paid_repair_late_known_commit_retires_without_publishing_authority_or_resending)
        | test(=tenancy::tests::execution::native::capture::learning::recovery::commit::paid_repair_disconnected_opener_keeps_custody_until_late_known_commit)'
    - name: verify actual offline Eval CLI import and readers
      timeout-minutes: 10
      env:
        BITROUTER_TEST_BRO: ${{ github.workspace }}/target/debug/bro
      run: bash .github/scripts/ci-test.sh 6 --test-threads 1 --run-ignored only -E 'test(=offline::evaluation::tests::cli::built_cli_inventory_backfill_rejections_and_real_scoped_readers)'
    - name: verify exact Block and native repair consumers serially
      timeout-minutes: 30
      shell: bash
      env:
        BITROUTER_OWNED_CAPTURE_FIXTURE: ${{ github.workspace }}/target/debug/examples/owned_capture_fixture
      run: |
        for case in \
          tenancy::tests::execution::native::capture::block::actual_block_socket_selection_keeps_one_owner_and_rebuilds_effective_human_head \
          tenancy::tests::execution::native::capture::block::copied_headers_and_same_name_reopened_controller_cannot_reanimate_an_old_block_link \
          tenancy::tests::execution::native::capture::block::known_block_intent_cannot_send_after_original_capture_close_or_key_revocation \
          tenancy::tests::execution::native::capture::block::copied_block_nonce_does_not_authorize_a_second_key_or_another_principal \
          tenancy::tests::execution::native::capture::block::eligibility::actual_nonmatching_rule_sends_baseline_but_never_creates_a_conclusive_trial_score \
          tenancy::tests::execution::native::capture::block::eligibility::real_prior_local_turn_cannot_be_enrolled_as_a_fresh_provider_trial \
          tenancy::tests::execution::native::capture::block::restart::process_crash_reopen_refuses_stale_open_capture_link_before_any_new_provider_send \
          tenancy::tests::execution::native::capture::block::tenants::same_database_equal_names_keep_live_links_and_block_cohorts_tenant_scoped \
          tenancy::tests::execution::native::capture::block::faults::block_consuming_commit_error_retains_original_owner_and_denies_another_send \
          tenancy::tests::execution::native::capture::block::faults::block_lost_deadline_reply_keeps_one_committed_draw_without_provider_send \
          tenancy::tests::execution::native::capture::block::adoption::actual_adoption_is_withdrawn_after_original_public_human_retraction \
          tenancy::tests::execution::native::capture::block::adoption::actual_adoption_is_rolled_back_after_original_public_human_severe_correction \
          tenancy::tests::execution::native::capture::block::coexistence::actual_paid_block_head_validates_original_receipt_and_never_relabels_human_or_refunds \
          tenancy::tests::execution::native::capture::block::coexistence::actual_block_human_wins_held_judge_and_retraction_preserves_both_paid_facts \
          tenancy::tests::execution::native::capture::block::coexistence::integrity::actual_selected_paid_block_rejects_missing_job_changed_output_and_missing_judge_receipt \
          tenancy::tests::execution::native::capture::block::pricing::real_cached_usage_requires_the_effective_retained_tariff \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_actual_begin_error_retains_claim_then_fresh_repairs_twice \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_actual_rollback_error_retains_claim_then_fresh_repairs_twice \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_caught_unwind_retains_claim_then_fresh_repairs_twice \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_cancelled_begin_waiter_keeps_claim_until_process_exit \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_actual_commit_error_retains_candidate_then_fresh_repairs_twice \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_late_known_commit_retires_without_publishing_authority \
          tenancy::tests::execution::native::session::experiment::paid::recovery::integrity::repair::native_paid_repair_cancelled_commit_waiter_keeps_custody_until_known_ack; do
          bash .github/scripts/ci-test.sh block --test-threads 1 --run-ignored only -E "test(=$case)"
        done
    - name: verify actual archive, restart and refusal
      timeout-minutes: 45
      shell: bash
      env:
        BITROUTER_TEST_BRO: ${{ github.workspace }}/target/debug/bro
      run: |
        export BITROUTER_TEST_RECOVERY_KEY="$(openssl rand -base64 32)"
        for case in \
          actual_cli_verifies_fresh_static_provisioning_and_rejects_changed_evidence \
          actual_cli_refuses_unreadable_operation_context_and_timestamp \
          actual_cli_refuses_definition_substitution_and_copied_old_credential \
          abandoned_recovery_waiter_keeps_actual_file_owner_until_read_rollback_and_close \
          selected_files::actual_cli_refuses_changed_linked_or_nonprivate_selected_files \
          selected_files::selected_file_change_during_actual_read_prevents_publication_after_worker_close ; do
          bash .github/scripts/ci-test.sh "offline-${case//::/-}" --test-threads 1 --run-ignored only -E "test(=offline::recovery::tests::$case)"
        done
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-evidence
        path: ci-evidence/
        retention-days: 7
  database-backends:
    name: database (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: postgres
          image: postgres:17
          port: 5432
          url: postgres://fixture:fixture-password@127.0.0.1:5432/bitrouter_test
          healthcheck: pg_isready -U fixture -d bitrouter_test
        - backend: mysql
          image: mysql:8.4
          port: 3306
          url: mysql://fixture:fixture-password@127.0.0.1:3306/bitrouter_test
          healthcheck: mysql --host=127.0.0.1 --user=fixture --password=fixture-password --database=bitrouter_test --execute='SELECT 1'
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: bitrouter_test
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fixture-password
          MYSQL_DATABASE: bitrouter_test
        ports:
        - ${{ matrix.port }}:${{ matrix.port }}
        options: --health-cmd "${{ matrix.healthcheck }}" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
    - name: verify eval ownership migration before populating the test database
      env:
        BITROUTER_TEST_MIGRATION_DATABASE_URL: ${{ matrix.url }}
      run: |
        bash .github/scripts/ci-test.sh db-2 --test-threads 1 --run-ignored only -E '(kind(lib)) & test(server_migration030_preserves_legacy_resumes_and_refuses_owned_down)'
