name: CI
'on':
  push:
    branches:
    - v1
    - main
  pull_request:
    branches:
    - '**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      registry: ${{ steps.paths.outputs.registry }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: paths
      name: Classify changes without omitting the aggregate check
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=false
        registry=false
        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          code=true
          registry=true
        else
          git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/ci-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              registry/*|dist/registry/*|apps/bitrouter/registry-dist/*) registry=true ;;
              docs/specs/*) code=true ;;
              docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/ci-paths"
        fi
        printf 'code=%s\nregistry=%s\n' "$code" "$registry" >> "$GITHUB_OUTPUT"
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: reject tracked files that match gitignore
      shell: bash
      run: |
        ignored_tracked="$(git ls-files -ci --exclude-standard)"
        if [[ -n "$ignored_tracked" ]]; then
          echo "::error::Tracked files must not also match .gitignore:"
          printf '%s\n' "$ignored_tracked"
          exit 1
        fi
    - name: reject standalone Python files
      shell: bash
      run: |
        python_files="$(git ls-files -- '*.py' '*.pyi' '*.pyw' '*.pyc')"
        if [[ -n "$python_files" ]]; then
          echo "::error::Use Rust for executable source and test fixtures:"
          printf '%s\n' "$python_files"
          exit 1
        fi
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check
  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: claude plugin validate (strict)
      run: |
        npm install -g @anthropic-ai/claude-code
        claude plugin validate . --strict
    - name: codex loader exercise (presence-asserted)
      run: |
        npm install -g @openai/codex
        export CODEX_HOME="$(mktemp -d)"
        codex plugin marketplace add "$PWD"
        codex plugin add bitrouter@bitrouter
        codex plugin list --json | tee /tmp/codex-plugins.json
        jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: clippy
    - run: cargo clippy --workspace --all-features --tests -- -D warnings
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  build-linux:
    name: build Linux service test artifacts
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@v6
    - name: Prepare memory for the Linux test build
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        set -euo pipefail
        [[ "$GITHUB_ACTIONS" == true && "$RUNNER_KIND" == github-hosted ]]
        [[ ! -e /swapfile-bitrouter-ci && ! -L /swapfile-bitrouter-ci ]]
        free -h
        df -h "$GITHUB_WORKSPACE"
        sudo fallocate --length 8G /swapfile-bitrouter-ci
        sudo chmod 600 /swapfile-bitrouter-ci
        sudo mkswap /swapfile-bitrouter-ci
        sudo swapon /swapfile-bitrouter-ci
        free -h
        df -h "$GITHUB_WORKSPACE"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        # Keep cache restore without optional PR cache writes after archive upload.
        cache-save-if: ${{ github.event_name != 'pull_request' }}
        cache-key: linux-service-v2
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Validate independent consumer lockfiles before compilation
      run: |
        cargo metadata --locked --manifest-path apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml --format-version 1 > /dev/null
    - name: Build tests and process fixtures once
      # Leave time for diagnostics upload if this bounded build is interrupted.
      timeout-minutes: 110
      run: |
        set -euo pipefail
        mkdir -p ci-evidence
        command -v vmstat
        vmstat -w -t 30 220 &
        sampler_pid=$!
        finish_build() {
          result=$?
          trap - EXIT
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          free -h || true
          df -h "$GITHUB_WORKSPACE" || true
          exit "$result"
        }
        trap finish_build EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        bash .github/actions/test-archive/build.sh service
    - uses: actions/upload-artifact@v4
      with:
        name: linux-tests-service-${{ github.sha }}
        path: |-
          tests.tar.zst
          tests.tar.zst.sha256
          tests.sha
          tests.workspace
        compression-level: 0
        retention-days: 2
        overwrite: true
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}-evidence
        path: ci-evidence/
        retention-days: 7
  build-service-process:
    name: build gateway database and process regressions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-key: linux-service-process-v2
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - run: bash .github/actions/test-archive/build.sh service-process
    - uses: actions/upload-artifact@v4
      with:
        name: linux-tests-service-process-${{ github.sha }}
        path: |-
          tests.tar.zst
          tests.tar.zst.sha256
          tests.sha
          tests.workspace
        compression-level: 0
        retention-days: 2
        overwrite: true
  build-bro:
    name: build Linux BRO test artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-key: linux-bro-v2
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - run: bash .github/actions/test-archive/build.sh bro
    - uses: actions/upload-artifact@v4
      with:
        name: linux-tests-bro-${{ github.sha }}
        path: |-
          tests.tar.zst
          tests.tar.zst.sha256
          tests.sha
          tests.workspace
        compression-level: 0
        retention-days: 2
        overwrite: true
  test-bro:
    name: test (Linux, BRO)
    needs: build-bro
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
      with:
        product: bro
    - run: bash .github/scripts/ci-test.sh bro --test-threads 2
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bro-${{ github.run_attempt }}-evidence
        path: ci-evidence/
  test-linux:
    name: test (Linux, ${{ matrix.suite }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
    - name: Run archived tests
      env:
        FILTER: ${{ matrix.filter }}
        TEST_THREADS: ${{ matrix.threads }}
      run: bash .github/scripts/ci-test.sh ordinary --test-threads "$TEST_THREADS" -E "$FILTER"
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}-evidence
        path: ci-evidence/
        retention-days: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - suite: modules
          threads: 4
          filter: kind(lib) | kind(bin)
        - suite: integration
          threads: 2
          filter: kind(test)
  test-product-process:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - {product: service-process, name: BRO through BitRouter}
        - {product: bro, name: BRO gateway home ownership}
    needs: [build-service-process, build-bro]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
      with:
        product: ${{ matrix.product }}
        companion: 'true'
    - name: Install the BRO process-test sandbox
      if: matrix.product == 'service-process'
      run: |
        if [[ ! -x /usr/bin/bwrap ]]; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
        fi
    - name: Run gateway routing and paid history across the two products
      if: matrix.product == 'service-process'
      run: |
        bash .github/scripts/ci-test.sh gateway-bro --exact-tests 'binary(=product_process)' ignored gateway_routes_the_approved_bro_tool_continuation
        bash .github/scripts/ci-test.sh transferred-history --exact-tests 'binary(=mixed_store_migration)' ignored sealed::accounting::restarted_products_preserve_paid_history_and_refuse_historical_request_replay \
          sealed::acp::cold_restore_replays_the_captured_transcript_once
    - name: Open staged and activated gateway directories with BRO
      if: matrix.product == 'bro'
      run: bash .github/scripts/ci-test.sh gateway-home --exact-tests 'binary(=home_owner)' ignored real_staged_and_activated_gateway_halves_reject_bro
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: product-process-${{ matrix.product }}-${{ github.run_attempt }}-evidence
        path: ci-evidence/
  test-service-profile:
    name: test (gateway ${{ matrix.profile }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - profile: minimal
          flags: --no-default-features
        - profile: default
          flags: ''
        - profile: shared
          flags: --no-default-features --features multi-instance,http2
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/service-${{ matrix.profile }}
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-key: service-${{ matrix.profile }}
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Exercise the native service package
      env:
        FLAGS: ${{ matrix.flags }}
      run: |
        read -r -a features <<< "$FLAGS"
        cargo build --locked -p bitrouter "${features[@]}" --bin bitrouter --examples
        export BITROUTER_TEST_GATEWAY_BINARY="$CARGO_TARGET_DIR/debug/bitrouter"
        export BITROUTER_TEST_EXAMPLES_DIR="$CARGO_TARGET_DIR/debug/examples"
        export BITROUTER_TEST_PREBUILT_ONLY=1
        cargo nextest run --locked -p bitrouter "${features[@]}" --profile ci \
          --test-threads 2 --retries 0 --no-fail-fast --no-tests fail
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: service-${{ matrix.profile }}-${{ github.run_attempt }}-evidence
        path: target/service-${{ matrix.profile }}/nextest/ci/junit.xml
  test-libraries:
    name: test (contracts, SDK, registry and helpers)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-key: libraries
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - run: |
        for case in \
          core_channel/explicit_messages_preserve_prefix_auth_beta_and_close_semantics \
          harness_http/all_existing_routes_preserve_bodies_headers_and_explicit_identity; do
          cargo nextest run --locked -p bitrouter-sdk --all-features --test "${case%/*}" \
            --retries 0 --no-tests fail -E "test(=${case#*/})"
        done
        cargo nextest run --locked --workspace --exclude bitrouter --exclude bitrouter-bro \
          --all-features --retries 0 --no-fail-fast --no-tests fail
  test-capacity:
    name: test (Linux, capacity ${{ matrix.suite }})
    needs: [build-linux, build-bro]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'recovery-experiment' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {suite: core-tree, product: bro}
        - {suite: checkpoints, product: bro}
        - {suite: bro-process, product: bro}
        - {suite: recovery-experiment, product: service}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
      with:
        product: ${{ matrix.product }}
    - name: Exercise managed BRO processes and their durable boundaries
      if: matrix.product == 'bro'
      env:
        SUITE: ${{ matrix.suite }}
      run: bash .github/scripts/bro-boundary-tests.sh "$SUITE"
    - name: Verify gateway recovery against retained authority and history
      if: matrix.product == 'service'
      run: |
        export BITROUTER_TEST_RECOVERY_KEY="$(openssl rand -base64 32)"
        bash .github/scripts/ci-test.sh recovery --exact-tests 'kind(lib)' ignored \
          offline::recovery::tests::saturation::actual_history_crosses_legacy_limits_and_fresh_target_keeps_independent_history \
          offline::large::tests::dense_inventory_exceeds_all_v1_total_limits_with_fixed_working_budget \
          tenancy::audit::recovery::v2::tests::runner::real_v2_runner_proves_closure_and_refuses_changed_approval_and_revoked_source_key \
          tenancy::audit::recovery::v2::tests::restore::real_restore_keeps_old_resource_revisions_and_rotated_oauth_and_refuses_corruption
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}-evidence
        path: ci-evidence/
        retention-days: 7
  test-process:
    name: test (Linux, process contracts)
    needs:
    - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
    - name: verify actual archive, restart and refusal
      timeout-minutes: 45
      shell: bash
      env:
        BITROUTER_TEST_GATEWAY_BINARY: ${{ github.workspace }}/target/debug/bitrouter
      run: |
        export BITROUTER_TEST_RECOVERY_KEY="$(openssl rand -base64 32)"
        for case in \
          actual_cli_verifies_fresh_static_provisioning_and_rejects_changed_evidence \
          actual_cli_refuses_unreadable_operation_context_and_timestamp \
          actual_cli_refuses_definition_substitution_and_copied_old_credential \
          abandoned_recovery_waiter_keeps_actual_file_owner_until_read_rollback_and_close \
          selected_files::actual_cli_refuses_changed_linked_or_nonprivate_selected_files \
          selected_files::selected_file_change_during_actual_read_prevents_publication_after_worker_close ; do
          bash .github/scripts/ci-test.sh "offline-${case//::/-}" --test-threads 1 --run-ignored only -E "test(=offline::recovery::tests::$case)"
        done
    - name: Verify historical assessment ownership, corrections and paid facts
      run: |
        bash .github/scripts/ci-test.sh retained-history --exact-tests 'kind(lib)' ordinary \
          acp_trajectory::checkpoint::tests::offline::cases::historical_assessments_lock_both_fork_ancestries_and_keep_duplicate_receipts \
          acp_trajectory::checkpoint::tests::offline::cases::revision_cas_retries_corrections_and_retractions_preserve_one_label \
          acp_trajectory::checkpoint::tests::offline::cases::late_metering_changes_resources_without_changing_content_or_labels \
          tenancy::tests::eval::authority::rotated_principal_replays_without_new_events_but_foreign_tenant_body_is_not_adopted
    - name: verify current resource and Eval dataset cutover through actual restore
      timeout-minutes: 15
      run: |
        export BITROUTER_TEST_RECOVERY_KEY="$(openssl rand -base64 32)"
        bash .github/scripts/ci-test.sh resource-cutover --exact-tests 'kind(lib)' ignored tenancy::resources::tests::cutover::independent_admission_profiles_survive_file_restarts_and_v2_restore \
          tenancy::resources::tests::cutover::retired_policy_compiler_refuses_file_connector_and_v2_restore_without_writes \
          tenancy::resources::tests::cutover::unreferenced_retired_exploration_refuses_startup_and_v2_restore_without_writes
        bash .github/scripts/ci-test.sh eval-retained-restore --exact-tests 'kind(lib)' ignored tenancy::tests::eval::retained::actual_restore_rejects_isolated_old_subject_and_preserves_current_mixed_namespaces
    - name: verify current tenant Eval and Policy update through the SDK
      timeout-minutes: 10
      run: bash .github/scripts/ci-test.sh eval-policy --exact-tests 'kind(lib)' ordinary tenancy::tests::execution::model_policy::sdk_policy_submit_read_activate_and_dispatch_use_the_public_contract
    - name: Verify the gateway rejects retired experimental policy and preserves paid identity
      run: |
        bash .github/scripts/ci-test.sh gateway-boundaries --exact-tests 'kind(lib)' ordinary \
          tenancy::tests::resources::model_policy::legacy_and_experimental_source_rejection_does_not_create_a_resource_head \
          model_policy::tests::unsupported_contracts_and_experimental_fields_fail_closed \
          gateway::observability::requests::tests::binding::another_controller_cannot_repeat_a_completed_execution_or_replace_its_charge \
          gateway::observability::requests::tests::binding::competing_controller_admissions_cannot_initialize_two_attempts
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}-evidence
        path: ci-evidence/
        retention-days: 7
  database-backends:
    name: database (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: postgres
          image: postgres:17
          port: 5432
          url: postgres://fixture:fixture-password@127.0.0.1:5432/bitrouter_test
          healthcheck: pg_isready -U fixture -d bitrouter_test
        - backend: mysql
          image: mysql:8.4
          port: 3306
          url: mysql://fixture:fixture-password@127.0.0.1:3306/bitrouter_test
          healthcheck: mysql --host=127.0.0.1 --user=fixture --password=fixture-password --database=bitrouter_test --execute='SELECT 1'
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: bitrouter_test
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fixture-password
          MYSQL_DATABASE: bitrouter_test
        ports:
        - ${{ matrix.port }}:${{ matrix.port }}
        options: --health-cmd "${{ matrix.healthcheck }}" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-archive
      with:
        product: service-process
    - name: provision isolated MySQL baseline test databases
      if: matrix.backend == 'mysql'
      run: |
        docker exec -i -e MYSQL_PWD=fixture-password "${{ job.services.database.id }}" mysql --user=root <<'SQL'
        SET GLOBAL log_bin_trust_function_creators = 1;
        GRANT ALL PRIVILEGES ON `m0\_baseline\_%`.* TO 'fixture'@'%';
        SQL
    - name: verify current schema baseline and refusal before populating the database
      env:
        BITROUTER_TEST_MIGRATION_DATABASE_URL: ${{ matrix.url }}
        BACKEND: ${{ matrix.backend }}
      run: |
        bash .github/scripts/ci-test.sh db-baseline --test-threads 1 --run-ignored only -E "(kind(lib)) & test(=db::migration::baseline::server_tests::${BACKEND}_current_baseline_catalog_and_refusal)"
    - name: verify tenant eval conflicts preserve the transaction and creator
      env:
        BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
      run: |
        bash .github/scripts/ci-test.sh db-9 --exact-tests 'kind(lib)' ignored eval::store::scope_tests::server_immutable_conflicts_preserve_transaction_and_first_creator
    - name: provision isolated MySQL evaluation test databases
      if: matrix.backend == 'mysql'
      run: |
        docker exec -i -e MYSQL_PWD=fixture-password "${{ job.services.database.id }}" mysql --user=root <<'SQL'
        GRANT ALL PRIVILEGES ON `bitrouter\_eval\_%`.* TO 'fixture'@'%';
        SQL
    - name: verify tenant eval composites share one stable transaction
      env:
        BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
      run: |
        bash .github/scripts/ci-test.sh db-11 --exact-tests 'kind(lib)' ignored eval::store::owned_tests::server::lifecycle::server_owned_eval_committed_replay_preserves_provenance_and_historical_snapshot \
          eval::store::owned_tests::server::lifecycle::server_owned_eval_external_rr_winner_is_rejected_without_replay_or_events \
          eval::store::owned_tests::server::lifecycle::server_owned_eval_freeze_keeps_rr_membership_across_external_admission_commit \
          eval::store::owned_tests::server::lifecycle::server_owned_eval_terminal_fault_rolls_back_result_and_prior_dispute \
          eval::store::owned_tests::server::server_owned_eval_composites_share_rr_transaction_and_scoped_winner_reads
    - name: verify directory projections and receipt history on the selected backend
      env:
        BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
      run: |
        bash .github/scripts/ci-test.sh db-13 --exact-tests 'kind(lib)' ignored tenancy::tests::execution::evaluation::server::server_owned_trajectory_directory_projection_preserves_integer_decoders_and_bounds \
          tenancy::tests::execution::evaluation::server::server_owned_trajectory_empty_source_compatibility_refuses_retained_rows \
          tenancy::tests::execution::evaluation::server::server_owned_trajectory_known_receipts_drain_restart_and_scan_with_one_reservation
    - name: verify owned HTTP continuation consumers on the selected backend
      env:
        BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
      run: |
        bash .github/scripts/ci-test.sh db-15 --exact-tests 'kind(lib)' ignored tenancy::tests::execution::http_continuation::server::server_http034_consumer_exact_cas_absence_race_and_restart
    - name: verify current execution receipt persistence on the selected backend
      env:
        BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
