name: CI
'on':
  push:
    branches:
    - v1
    - main
  pull_request:
    branches:
    - '**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      bro: ${{ steps.paths.outputs.bro }}
      gateway: ${{ steps.paths.outputs.gateway }}
      shared: ${{ steps.paths.outputs.shared }}
      registry: ${{ steps.paths.outputs.registry }}
      cargo-args: ${{ steps.paths.outputs.cargo-args }}
      bro-build-runners: ${{ steps.paths.outputs.bro-build-runners }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: paths
      name: Select product checks without omitting the aggregate check
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        bro=false
        gateway=false
        shared=false
        registry=false
        paths="$RUNNER_TEMP/ci-paths"
        # Compare the revision we test (the merge commit for PRs). Disabling
        # renames reports both paths when a file moves across a product boundary.
        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
           ! git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- > "$paths"; then
          shared=true
          registry=true
        else
          while IFS= read -r -d '' path; do
            case "$path" in
              apps/bro/registry-dist/*) bro=true; registry=true ;;
              apps/bitrouter/registry-dist/*) gateway=true; registry=true ;;
              registry/*|dist/registry/*) registry=true ;;
              docs/specs/*) shared=true ;;
              docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE) ;;
              # BRO's gateway client, endpoint and tool-loop adapters, plus the real two-product fixture.
              apps/bro/Cargo.toml|apps/bro/src/main.rs|apps/bro/src/gateway.rs|apps/bro/src/runner.rs|apps/bro/src/tree.rs|\
              apps/bro/src/acp.rs|apps/bro/src/acp/serve.rs|apps/bro/src/acp/serve/*|\
              apps/bitrouter/tests/product_process.rs|apps/bitrouter/tests/support/product_bro.rs|.github/scripts/ci-bro-sandbox.sh)
                bro=true; gateway=true ;;
              apps/bro/*) bro=true ;;
              apps/bitrouter/*|templates/*) gateway=true ;;
              *) shared=true ;;
            esac
          done < "$paths"
        fi

        cargo_args=()
        bro_build_runners='["ubuntu-24.04"]'
        if [[ "$shared" == true ]]; then
          bro=true
          gateway=true
          cargo_args=(--workspace)
        else
          if [[ "$bro" == true ]]; then cargo_args+=(-p bitrouter-bro); fi
          if [[ "$gateway" == true ]]; then cargo_args+=(-p bitrouter); fi
        fi
        if [[ "$bro" == true ]]; then
          bro_build_runners='["ubuntu-24.04","macos-latest","windows-latest"]'
        fi
        printf '%s\n' "bro=$bro" "gateway=$gateway" "shared=$shared" "registry=$registry" \
          "cargo-args=${cargo_args[*]}" "bro-build-runners=$bro_build_runners" >> "$GITHUB_OUTPUT"
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: reject tracked files that match gitignore
      shell: bash
      run: |
        ignored_tracked="$(git ls-files -ci --exclude-standard)"
        if [[ -n "$ignored_tracked" ]]; then
          echo "::error::Tracked files must not also match .gitignore:"
          printf '%s\n' "$ignored_tracked"
          exit 1
        fi
    - name: reject standalone Python files
      shell: bash
      run: |
        python_files="$(git ls-files -- '*.py' '*.pyi' '*.pyw' '*.pyc')"
        if [[ -n "$python_files" ]]; then
          echo "::error::Use Rust for executable source and test fixtures:"
          printf '%s\n' "$python_files"
          exit 1
        fi
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check
  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: claude plugin validate (strict)
      run: |
        npm install -g @anthropic-ai/claude-code
        claude plugin validate . --strict
    - name: codex loader exercise (presence-asserted)
      run: |
        npm install -g @openai/codex
        export CODEX_HOME="$(mktemp -d)"
        codex plugin marketplace add "$PWD"
        codex plugin add bitrouter@bitrouter
        codex plugin list --json | tee /tmp/codex-plugins.json
        jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: clippy
    - shell: bash
      env:
        CARGO_ARGS: ${{ needs.changes.outputs.cargo-args }}
      run: |
        read -r -a packages <<< "$CARGO_ARGS"
        cargo clippy "${packages[@]}" --all-features --tests -- -D warnings
    needs:
    - changes
    if: needs.changes.outputs.cargo-args != ''
  build-gateway:
    name: build gateway (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 360 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '2' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        cache-save-if: ${{ github.event_name != 'pull_request' }}
        cache-key: ci-gateway-v3
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Validate the independent SDK consumer lockfile
      if: runner.os == 'Linux'
      run: cargo metadata --locked --manifest-path apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml --format-version 1 > /dev/null
    - name: Check gateway build and test dependency boundaries
      if: runner.os == 'Linux'
      run: |
        for flags in '' '--no-default-features' '--no-default-features --features multi-instance,http2' '--all-features'; do
          cargo tree --locked -p bitrouter $flags -e normal,build,dev --prefix none > service-tree.txt
          if grep -E '^(bitrouter-bro|agent-client-protocol[^ ]*) v' service-tree.txt; then
            echo '::error::The service test or build closure includes BRO/ACP'; exit 1
          fi
        done
    - name: Check the default gateway matcher dependency
      if: runner.os == 'Linux'
      run: |
        cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
        if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
          echo '::error::default service links the optional matcher'; exit 1
        fi
    - name: Check isolated production feature closures
      if: runner.os == 'Linux'
      shell: bash
      env:
        CARGO_TARGET_DIR: target/production-features
        FEATURES: '["", "http2", "eval-publication", "mcp", "server-tools", "guardrails", "otel-http", "otel-grpc", "otel-http,otel-grpc",
          "db-postgres", "multi-instance", "multi-instance,http2", "db-mysql", "mcp,server-tools,otel-http,db-postgres,db-mysql"]'
      run: |
        while IFS= read -r PROFILE_FEATURES; do
        # Keep dev-dependencies out of the production feature closure.
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bitrouter
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
        # Only the minimal gateway distributions promise an h2-free
        # production closure. Other features (such as otel-grpc) may need h2.
        case "$PROFILE_FEATURES" in
          ''|multi-instance)
            if grep -Eq '^h2 v' profile-tree.txt; then
              echo '::error::minimal HTTP/1 gateway profile pulled h2'; exit 1
            fi ;;
        esac
        if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
          echo '::error::service feature pulled ACP'; exit 1
        fi
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" \
          -e normal,build -i jsonschema --depth 1 --prefix none > profile-schema-owners.txt
        if grep -Ev '^(jsonschema|bitrouter-registry) v' profile-schema-owners.txt; then
          echo '::error::unexpected service schema validator owner'; exit 1
        fi
        case ",$PROFILE_FEATURES," in
          *,mcp,*|*,server-tools,*) ;;
          *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
               echo '::error::profile without MCP pulled its transport runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-http,*|*,otel-grpc,*) ;;
          *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
               echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-grpc,*) ;;
          *) if grep -Eq '^tonic v' profile-tree.txt; then
               echo '::error::profile without gRPC pulled tonic'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-postgres,*|*,multi-instance,*) ;;
          *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
               echo '::error::profile without PostgreSQL pulled its driver'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-mysql,*) ;;
          *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
               echo '::error::profile without MySQL pulled its driver'; exit 1
             fi ;;
        esac

        done < <(jq -r '.[]' <<< "$FEATURES")
        rm -rf "$CARGO_TARGET_DIR"
    - name: Build the independent ordered protocol SDK consumer
      if: runner.os == 'Linux'
      run: |
        cargo build --locked \
          --manifest-path apps/bitrouter/tests/fixtures/native_generate_content_ap/Cargo.toml \
          --target-dir target/native-ap-sdk-consumer --bin native-ap-sdk-consumer
        mkdir -p ci-artifacts
        cp target/native-ap-sdk-consumer/debug/native-ap-sdk-consumer ci-artifacts/
        rm -rf target/native-ap-sdk-consumer
    - name: Build and archive the isolated feature suites
      if: runner.os == 'Linux'
      run: |
        for suite in service-minimal service-default service-shared service-grpc; do
          bash .github/actions/test-archive/build.sh "$suite"
        done
    - name: Build and archive the all-feature gateway suite
      run: bash .github/actions/test-archive/build.sh service
    - name: Record the artifact revision and checksums
      run: |
        cd ci-artifacts
        printf '%s\n' "$GITHUB_SHA" > tests.sha
        printf '%s\n' "$GITHUB_WORKSPACE" > tests.workspace
        if [[ "$RUNNER_OS" == macOS ]]; then
          shasum -a 256 -- *.tar.zst > checksums.sha256
        elif [[ "$RUNNER_OS" == Linux ]]; then
          sha256sum -- *.tar.zst native-ap-sdk-consumer > checksums.sha256
        else
          sha256sum -- *.tar.zst > checksums.sha256
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: tests-service-${{ matrix.os }}-${{ github.sha }}
        path: ci-artifacts/
        if-no-files-found: error
        compression-level: 0
        retention-days: 2
        overwrite: true

  build-bro:
    name: build BRO (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bro == 'true' || needs.changes.outputs.gateway == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.bro-build-runners) }}
    defaults:
      run:
        shell: bash
    env:
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        cache-save-if: ${{ github.event_name != 'pull_request' }}
        cache-key: ci-bro-v3
    - name: Check BRO build and test dependency boundaries
      if: runner.os == 'Linux'
      run: |
        cargo tree --locked -p bitrouter-bro --all-features -e normal,build,dev --prefix none > bro-tree.txt
        if grep -E '^(bitrouter|bitrouter-registry|bitrouter-guardrails|sea-orm(-[^ ]*)?|sqlx-(postgres|mysql)|axum|rmcp) v' bro-tree.txt; then
          echo '::error::BRO builds gateway implementation dependencies'; exit 1
        fi
    - name: Build the Linux BRO companion
      if: runner.os == 'Linux' && needs.changes.outputs.gateway == 'true'
      run: bash .github/actions/test-archive/build.sh bro-companion
    - uses: actions/upload-artifact@v4
      if: runner.os == 'Linux' && needs.changes.outputs.gateway == 'true'
      with:
        name: tests-bro-companion-${{ github.sha }}
        path: ci-companion/
        if-no-files-found: error
        compression-level: 0
        retention-days: 2
        overwrite: true
    - uses: taiki-e/install-action@v2
      if: needs.changes.outputs.bro == 'true'
      with:
        tool: nextest@0.9.114
    - name: Build and archive the BRO suite
      if: needs.changes.outputs.bro == 'true'
      run: |
        bash .github/actions/test-archive/build.sh bro
        cd ci-artifacts
        printf '%s\n' "$GITHUB_SHA" > tests.sha
        printf '%s\n' "$GITHUB_WORKSPACE" > tests.workspace
        if [[ "$RUNNER_OS" == macOS ]]; then
          shasum -a 256 -- bro.tar.zst > checksums.sha256
        else
          sha256sum -- bro.tar.zst > checksums.sha256
        fi
    - uses: actions/upload-artifact@v4
      if: needs.changes.outputs.bro == 'true'
      with:
        name: tests-bro-${{ matrix.os }}-${{ github.sha }}
        path: ci-artifacts/
        if-no-files-found: error
        compression-level: 0
        retention-days: 2
        overwrite: true

  test-bro:
    name: test BRO (${{ matrix.os }})
    needs: [changes, build-bro]
    if: needs.changes.outputs.bro == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.bro-build-runners) }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache: false
    - uses: ./.github/actions/test-archive
      with:
        product: bro
        platform: ${{ matrix.os }}
    - name: Provision the Linux workspace sandbox
      if: runner.os == 'Linux'
      run: bash .github/scripts/ci-bro-sandbox.sh
    - name: Run the BRO suite
      env:
        BRO_TEST_REQUIRE_WORKSPACE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
      run: bash .github/scripts/ci-test.sh bro --test-threads 2

  test-gateway:
    name: test gateway (${{ matrix.os }})
    needs: [changes, build-gateway, build-bro]
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 240 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
        - os: macos-latest
          filter: test(=tests::daemon::status_route_and_stop_roundtrip_over_the_control_socket) | test(=tests::daemon::concurrent_clients_are_all_served) | test(=tests::daemon::socket_file_has_owner_only_permissions)
            | test(=tests::host_lifecycle::sigterm_control_error_drains_inflight_inference_before_nonzero_exit) | binary(=mcp_config_pty) | test(/^tests::onboarding_pty::/)
        - os: windows-latest
          filter: test(=tenancy::ownership::unsupported_claim_tests::native_recovery_connector_refuses_before_creating_non_unix_authority)
            | test(=providers::cli_install::tests::install_command_is_the_official_native_installer) | test(=paths::tests::replacing_private_file_overwrites_existing_destination_on_windows)
            | test(=tests::daemon::status_route_and_stop_roundtrip_over_the_control_socket)
            | test(=tests::daemon::concurrent_clients_are_all_served) | test(=tests::daemon::probe_status_reports_none_when_nothing_listens) | test(=tests::daemon::client_fails_clearly_when_no_daemon_is_listening)
            | (binary(=invocation) & test(=gateway_update_delegates_for_the_installed_profile_and_channel))
            | test(=daemon_locator::tests::config_identity_survives_file_deletion_and_recreation)
            | test(=policy_source::files_tests::current_source_history_cas_and_exact_rollback)
            | test(=db::tests::relative_sqlite_urls_anchor_to_config_home_and_preserve_queries)
            | (binary(=invocation) & test(=gateway_help_and_status_use_the_service_identity))
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: bitrouter_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture -d bitrouter_test" --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fixture-password
          MYSQL_DATABASE: bitrouter_test
        ports: ['3306:3306']
        options: --health-cmd "mysql --host=127.0.0.1 --user=fixture --password=fixture-password --database=bitrouter_test --execute='SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - uses: actions/checkout@v6
    - id: archives
      uses: ./.github/actions/test-archive
      with:
        product: service
        platform: ${{ matrix.os }}
        bro-companion: ${{ runner.os == 'Linux' && 'true' || 'false' }}
    - name: Exercise native gateway behavior
      if: runner.os != 'Linux'
      env:
        FILTER: ${{ matrix.filter }}
      run: bash .github/scripts/ci-test.sh service --test-threads 2 -E "$FILTER"
    - name: Run the all-feature gateway module tests
      if: runner.os == 'Linux'
      run: bash .github/scripts/ci-test.sh service --test-threads 4 -E 'kind(lib) | kind(bin)'
    - name: Run the all-feature gateway integration tests
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      run: bash .github/scripts/ci-test.sh service --test-threads 2 -E 'kind(test)'
    - name: Install the BRO process-test sandbox
      id: sandbox
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      run: bash .github/scripts/ci-bro-sandbox.sh
    - name: Run gateway routing through the BRO harness
      if: "!cancelled() && steps.sandbox.outcome == 'success'"
      run: bash .github/scripts/ci-test.sh service --run-ignored only -E 'binary(=product_process)'
    - name: Verify ordered native JSON and SSE with the independent AP SDK
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      env:
        BITROUTER_NATIVE_AP_CLIENT: ${{ github.workspace }}/ci-artifacts/native-ap-sdk-consumer
      run: |
        bash .github/scripts/ci-test.sh service --run-ignored only --test-threads 1 \
          -E 'kind(lib) & test(=tenancy::tests::execution::receipts::ordered::generate_content_native::boundaries::process_consumer::native_generate_content_actual_ap_sdk_consumer_keeps_original_tokens_json_sse_h1_h2)'
    - name: Verify gateway behavior against PostgreSQL
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      run: bash .github/scripts/ci-test.sh database postgres
    - name: Verify gateway behavior against MySQL
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      env:
        MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      run: |
        docker exec -i -e MYSQL_PWD=fixture-password "$MYSQL_CONTAINER" mysql --user=root <<'SQL'
        SET GLOBAL log_bin_trust_function_creators = 1;
        GRANT ALL PRIVILEGES ON `bitrouter\_schema\_%`.* TO 'fixture'@'%';
        GRANT ALL PRIVILEGES ON `bitrouter\_eval\_%`.* TO 'fixture'@'%';
        SQL
        bash .github/scripts/ci-test.sh database mysql
    - name: Test the minimal, default and shared gateway profiles
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      run: |
        result=0
        for suite in service-minimal service-default service-shared; do
          bash .github/scripts/ci-test.sh "$suite" --test-threads 2 || result=1
        done
        exit "$result"
    - name: Test the gRPC-only telemetry transport
      if: "!cancelled() && runner.os == 'Linux' && steps.archives.outcome == 'success'"
      run: |
        bash .github/scripts/ci-test.sh service-grpc --test-threads 1 \
          -E 'test(/^tests::telemetry_grpc_transport::/) | test(/^assemble::telemetry_opt_in_tests::/)'
    - uses: actions/upload-artifact@v4
      if: always() && runner.os == 'Linux'
      with:
        name: gateway-profiles-${{ github.run_attempt }}-evidence
        path: target/nextest/ci-service-*/junit.xml

  test-libraries:
    name: test (contracts, SDK, registry and helpers)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-key: libraries
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - run: |
        cargo nextest run --locked --workspace --exclude bitrouter --exclude bitrouter-bro \
          --all-features --retries 0 --no-fail-fast --no-tests fail
  feature-isolation:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: verify SDK without HTTP/2
      run: |
        # Check production before test dependencies can enable HTTP/2.
        cargo check --locked -p bitrouter-sdk --no-default-features --lib
        cargo check --all-targets --locked -p bitrouter-sdk --no-default-features --test transport_protocol
    - name: contracts, registry and client build independently
      run: |
        cargo check --all-targets -p bitrouter-registry --all-features
        cargo check --all-targets -p bitrouter-ai
        cargo check --all-targets -p bitrouter-ai --all-features
        cargo check --all-targets -p bitrouter-sdk
        cargo check --all-targets -p bitrouter-sdk --all-features
        cargo check --all-targets -p bitrouter-guardrails --all-features
    - name: inspect isolated production dependency closures
      shell: bash
      run: |
        # Successful checks above prove package membership. Inspect forward
        # trees: an unknown inverted dependency must not count as evidence.
        for flags in '' '--no-default-features' '--all-features'; do
          cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
          if grep -Eq '^(axum|axum-core|hyper|hyper-util) v' ai-tree.txt; then
            echo '::error::AI contracts pulled HTTP framework dependencies'; exit 1
          fi
          if grep -Eq '^(bitrouter(-sdk|-bro|-build|-update)?|reqwest|tokio(-[^ ]*)?|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
            echo '::error::AI public contracts pulled runtime dependencies'; exit 1
          fi
          cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
          if grep -Eq '^(bitrouter(-bro|-build|-update)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
            echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
        if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
          echo '::error::matcher depends on its host implementation'; exit 1
        fi
    needs: changes
    if: needs.changes.outputs.shared == 'true'
  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: read the pins
      id: pin
      shell: bash
      run: |
        pins=crates/bitrouter-sdk/public-api.pins
        for key in toolchain tool; do
          value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
          if [[ -z "$value" ]]; then
            echo "::error::$pins has no '$key=' line"; exit 1
          fi
          echo "$key=$value" >> "$GITHUB_OUTPUT"
        done
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false
    - name: install the pinned cargo-public-api
      run: cargo install --locked "${{ steps.pin.outputs.tool }}"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
    - name: verify public contract and client surfaces
      shell: bash
      run: |
        for package in bitrouter-ai bitrouter-sdk; do
          listing="$RUNNER_TEMP/$package-public-api.txt"
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p "$package" --all-features --simplified > "$listing"
          # --simplified excludes foreign blanket impls rustdoc attaches to
          # every type. Real authored fields and bounds remain in the listing.
          if [[ "$package" == bitrouter-ai ]]; then
            sentinels=(
              'pub enum bitrouter_ai::stream::ProtocolEnd'
              'pub struct bitrouter_ai::stream::ServerEvent<T>'
              'pub const bitrouter_ai::control::SPEC_VERSION'
              'pub struct bitrouter_ai::tenancy::resources::ResourcePut'
              'pub struct bitrouter_ai::tenancy::admission::AdmissionProfile'
              'pub enum bitrouter_ai::tenancy::admission::AdmissionMode'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationCapabilitiesV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationRequestV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationSnapshotV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::ProfileObservationV1'
              'pub enum bitrouter_ai::tenancy::resources::Definition'
              'pub struct bitrouter_ai::tenancy::resources::ResourceCapabilities'
              'pub struct bitrouter_ai::tenancy::generation_defaults::CanonicalGenerationDefaultsV1'
              'pub struct bitrouter_ai::tenancy::generation_defaults::GenerationDefaultsEnvelope'
              'pub enum bitrouter_ai::tenancy::generation_defaults::ConfigurationDefaults'
              'bitrouter_ai::tenancy::ordered::OrderedDispatchBinding::with_generation_defaults_envelope'
              'pub struct bitrouter_ai::tenancy::resources::ResourceStatus'
              'pub struct bitrouter_ai::tenancy::execution::ExecutionReceipt'
              'pub enum bitrouter_ai::tenancy::execution::Dispatch'
              'pub struct bitrouter_ai::tenancy::ordered::AcceptedSelection'
              'pub struct bitrouter_ai::tenancy::usage_evidence::ExecutionUsageEvidence'
              'pub struct bitrouter_ai::protocol::chat_completions::ChatRequest'
              'pub struct bitrouter_ai::gateway::ModelsResponse'
              'pub struct bitrouter_ai::control::reload::ReloadInput'
              'pub struct bitrouter_ai::control::requests::RequestFilters'
              'pub struct bitrouter_ai::control::status::StatusReport'
              'pub enum bitrouter_ai::control::action::Action'
              'pub struct bitrouter_ai::control::error::ErrorEnvelope'
              'pub struct bitrouter_ai::eval::EvalSubject'
              'pub struct bitrouter_ai::eval::AdmissionOutcome'
            )
            forbidden='bitrouter_ai::(axum|wire|event|observe|extension|error|core|harness)(::|[ {]|$)|protocol::mcp_skills::|tenancy::private_adapter::|ReasoningEffortConfig|axum_core::|http::|futures_core::|ExtensionApi|NativeExecutionControl|NativePrivateContextRuntime|CommitGate|VerifiedBatch|CheckpointBatchExt|HarnessManifestExt|ClientMessageExt|ToolResultLimitsExt|::capture_cache|::commitment\(|ToolResultOutput::(from_untyped_value|to_provider_string)|DataContent::(to_url|from_url)|Source::synthesize_id|GenerationParams::(extras_for_protocol|extra_value_for_protocol)|Prompt::required_capabilities|ModelTokenLimits::output_reservation_covers_model|NativeRoute::requires_input_count|Limits::within|Capabilities::negotiate|bitrouter::|bitrouter_sdk::|reqwest::|tokio::|sea_orm|sqlx|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::'
          else
            sentinels=(
              'pub struct bitrouter_sdk::gateway::GatewayClient'
              'bitrouter_sdk::gateway::GatewayClient::chat_reply'
              'bitrouter_sdk::gateway::GatewayClient::tenant'
              'pub struct bitrouter_sdk::gateway::tenancy::TenantGateway'
              "bitrouter_sdk::gateway::tenancy::TenantGateway<'_>::with_anthropic_beta"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_anthropic_beta"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_generation_defaults_envelope"
              'bitrouter_sdk::tenancy::TenancyClient::put_resource'
              'bitrouter_sdk::tenancy::TenancyClient::execution'
              'bitrouter_sdk::tenancy::TenancyClient::resource_capabilities'
              'bitrouter_sdk::tenancy::TenancyClient::admission_profile_observation_capabilities'
              'bitrouter_sdk::tenancy::TenancyClient::observe_admission_profiles'
              'bitrouter_sdk::tenancy::TenancyClient::usage_evidence'
              'bitrouter_sdk::gateway::GatewayClient::chat_completions'
              'bitrouter_sdk::gateway::GatewayClient::chat_reply_with_correlation'
              'bitrouter_sdk::gateway::GatewayClient::stream_responses'
              'pub struct bitrouter_sdk::control::ControlClient'
              'bitrouter_sdk::control::ControlClient::reload'
              'bitrouter_sdk::control::ControlClient::operation'
              'bitrouter_sdk::gateway::GatewayClient::submit_eval_result'
              'bitrouter_sdk::gateway::GatewayClient::eval_snapshot'
            )
            forbidden='bitrouter::|axum|sea_orm|sqlx|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::|tokio_tungstenite|tungstenite::'
          fi
          for sentinel in "${sentinels[@]}"; do
            if ! grep -qF "$sentinel" "$listing"; then
              echo "::error::$package public API listing is missing '$sentinel'"
              exit 1
            fi
          done
          if hits="$(grep -niE "$forbidden" "$listing")"; then
            echo "::error::runtime ownership leaked into $package's public API"
            printf '%s\n' "$hits"
            exit 1
          fi
          # A public re-export can hide its foreign origin in the listing.
          # Consumers import each contract from its owning public module.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]' "crates/$package/src/")"; then
            echo "::error::$package contains a public forwarding export"
            printf '%s\n' "$hits"
            exit 1
          fi
          crate_name="${package//-/_}"
          # Authored conversion impls can render primitive paths such as
          # u64::from. These are built-in types, not external crate roots.
          primitives='bool|char|str|[ui](8|16|32|64|128|size)|f(16|32|64|128)'
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$listing" \
            | cut -d: -f1 | sort -u \
            | grep -vxE "$crate_name|core|std|alloc|$primitives" > "$RUNNER_TEMP/$package-public-api-deps.txt"
          diff -u \
            <(grep -v '^#' "crates/$package/public-api-deps.txt") \
            "$RUNNER_TEMP/$package-public-api-deps.txt"
        done
        cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
          -p bitrouter-ai --no-default-features --simplified > "$RUNNER_TEMP/ai-default-public-api.txt"
        if grep -nE 'axum::|axum_core::|http::|futures_core::|tokio::|reqwest::' "$RUNNER_TEMP/ai-default-public-api.txt"; then
          echo '::error::AI API leaked HTTP/runtime bindings'; exit 1
        fi
    needs:
    - changes
    if: needs.changes.outputs.shared == 'true'
  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: registry source is valid
      run: cargo run -p dist-helper -- registry validate
    - name: generated dist is up to date
      run: cargo run -p dist-helper -- check
    - name: no deprecated/unsound yaml parser in the graph
      run: |
        for crate in serde_yaml serde_yml; do
          if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
            echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
            cargo tree -i "$crate"
            exit 1
          fi
        done
    needs:
    - changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.registry == 'true'
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.93'
    - shell: bash
      env:
        CARGO_ARGS: ${{ needs.changes.outputs.cargo-args }}
      run: |
        read -r -a packages <<< "$CARGO_ARGS"
        cargo check "${packages[@]}" --all-features
    needs:
    - changes
    if: needs.changes.outputs.cargo-args != ''
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - shell: bash
      env:
        CARGO_ARGS: ${{ needs.changes.outputs.cargo-args }}
      run: |
        read -r -a packages <<< "$CARGO_ARGS"
        cargo doc "${packages[@]}" --all-features --no-deps
    needs:
    - changes
    if: needs.changes.outputs.cargo-args != ''
  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - shell: bash
      env:
        CARGO_ARGS: ${{ needs.changes.outputs.cargo-args }}
      run: |
        read -r -a packages <<< "$CARGO_ARGS"
        cargo test --doc "${packages[@]}" --all-features
    needs:
    - changes
    if: needs.changes.outputs.cargo-args != ''
  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
    - changes
    - repository-hygiene
    - fmt
    - agent-plugin
    - clippy
    - build-gateway
    - test-gateway
    - build-bro
    - test-bro
    - test-libraries
    - feature-isolation
    - sdk-public-api
    - dist
    - msrv
    - doc
    - doctest
    runs-on: ubuntu-24.04
    steps:
    - name: Require selected checks and reject failed or cancelled dependencies
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -e '
          def passed($jobs): . as $needs | all($jobs[]; $needs[.].result == "success");
          .changes.outputs as $paths |
          passed(["changes", "repository-hygiene", "fmt", "agent-plugin"]) and
          all(.[]; .result == "success" or .result == "skipped") and
          (if $paths.bro == "true" or $paths.gateway == "true" then
             passed(["clippy", "msrv", "doc", "doctest", "build-bro"]) else true end) and
          (if $paths.bro == "true" then passed(["test-bro"]) else true end) and
          (if $paths.gateway == "true" then passed(["build-gateway", "test-gateway"]) else true end) and
          (if $paths.shared == "true" then passed(["test-libraries", "feature-isolation", "sdk-public-api"]) else true end) and
          (if $paths.gateway == "true" or $paths.registry == "true" then passed(["dist"]) else true end)
        ' <<< "$RESULTS"
