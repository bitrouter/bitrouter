name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject tracked files that match gitignore
        shell: bash
        run: |
          ignored_tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$ignored_tracked" ]]; then
            echo "::error::Tracked files must not also match .gitignore:"
            printf '%s\n' "$ignored_tracked"
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux, macOS, and Windows are all first-class platforms — clippy and test
  # run on each, no "primary" OS. The daemon control surface in particular has
  # platform-specific code (Unix domain socket vs Windows named pipe, SIGHUP /
  # SIGTERM vs ctrl_c, kill vs taskkill) and the matrix catches a regression in
  # any one of them at PR time.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            retries: "0"
          - os: windows-latest
            # Windows also exposes the trajectory timestamp race under load.
            retries: "2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --all-features
          --retries "${{ matrix.retries }}"

  # A cold all-features build used to compile and link every large application
  # test target on one runner. Split by Cargo target so each runner has bounded
  # late-stage link pressure while preserving the original Linux test surface.
  test-ubuntu-workspace:
    name: test (ubuntu-latest, workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --exclude bitrouter --all-features
          --build-jobs 2

  test-ubuntu-bitrouter:
    name: test (ubuntu-latest, bitrouter ${{ matrix.target }})
    needs: test-ubuntu-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lib
            build_jobs: "2"
            flags: --lib
          - target: bin
            build_jobs: "1"
            flags: --bin bitrouter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: add swap for the lib test harness
        if: matrix.target == 'lib'
        run: |
          sudo fallocate --length 8G /swapfile-bitrouter
          sudo chmod 600 /swapfile-bitrouter
          sudo mkswap /swapfile-bitrouter
          sudo swapon /swapfile-bitrouter
          free -h
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: false
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - env:
          TEST_BUILD_JOBS: ${{ matrix.build_jobs }}
          TEST_TARGET_FLAGS: ${{ matrix.flags }}
        shell: bash
        run: |
          read -r -a target_flags <<< "$TEST_TARGET_FLAGS"
          cargo nextest run -p bitrouter --all-features \
            --build-jobs "$TEST_BUILD_JOBS" \
            "${target_flags[@]}"

  test-ubuntu-integration:
    name: test (ubuntu-latest, bitrouter integration ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: interfaces
            retries: "0"
            targets: >-
              --test acp --test cloud_api --test daemon --test e2e
              --test full_stack
          - shard: observability
            retries: "0"
            targets: >-
              --test agent_trace_generalization --test observe_hierarchy
              --test workflow_state_real_agent_e2e
              --test workflow_state_replay
          - shard: optimization
            retries: "0"
            targets: >-
              --test eval_exchange_equivalence --test optimization_output
              --test policy_eval_control_plane
          - shard: control-plane
            # Trajectory assertions occasionally observe async event timestamps
            # out of order; retry the isolated test process before failing CI.
            retries: "2"
            targets: >-
              --test onboarding --test smithers_reward_loop
              --test terminus_2_workflow_state
              --test trajectory_progress_control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: ${{ matrix.shard == 'interfaces' }}
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - name: run integration shard
        shell: bash
        env:
          TEST_RETRIES: ${{ matrix.retries }}
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a test_targets <<< "$TEST_TARGETS"
          cargo nextest run -p bitrouter --all-features --build-jobs 2 \
            --retries "$TEST_RETRIES" \
            "${test_targets[@]}"

  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
      - test-ubuntu-workspace
      - test-ubuntu-bitrouter
      - test-ubuntu-integration
    runs-on: ubuntu-latest
    env:
      WORKSPACE_RESULT: ${{ needs.test-ubuntu-workspace.result }}
      BITROUTER_RESULT: ${{ needs.test-ubuntu-bitrouter.result }}
      INTEGRATION_RESULT: ${{ needs.test-ubuntu-integration.result }}
    steps:
      - name: require every ubuntu test shard
        shell: bash
        run: |
          for result in \
            "$WORKSPACE_RESULT" \
            "$BITROUTER_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Ubuntu test shard finished with: $result"
              exit 1
            fi
          done

  feature-isolation:
    name: feature-isolation
    runs-on: ubuntu-latest
    # The SDK's default dependency tree is a shipped promise: a consumer that
    # wants pure routing must not pay for the axum HTTP server. The whole
    # OpenTelemetry stack is a stronger promise still — it must not reach
    # `bitrouter-sdk` under ANY feature combination, because it lives in
    # `bitrouter-telemetry` and the SDK owns only the contract that crate
    # renders. Every capability that pulls weight sits behind a default-off
    # feature, and each feature must build on its own.
    #
    # `cargo tree` is the tool here, and it mishandles a bad name in *two*
    # different ways depending on which flag carries it. Both make a typo (or a
    # crate rename) pass silently, so both need a guard:
    #
    #   1. `-i <pkg>` — exits 101 both when the package is absent from the
    #      selected tree AND when the name matches no package at all, with a
    #      byte-identical message. Guard: every negative assertion below is
    #      preceded by a positive one proving the name resolves somewhere.
    #
    #   2. `-p <crate>` — the sharper one. An unknown package spec is silently
    #      ignored and `cargo tree` falls back to the **whole workspace**
    #      default tree: `cargo tree -p bitrouter-guardrailz -e normal -i axum`
    #      exits **0**, prints a full workspace-wide inverted tree, and writes
    #      nothing to stderr. Because it both succeeds and produces output,
    #      exit status alone cannot catch it — the `-i` guard above is no help
    #      here. In the crate loop below, a typo'd or renamed crate therefore
    #      stops asserting anything about that crate and silently asserts about
    #      the workspace instead. Today both `axum` and `opentelemetry` are in
    #      the workspace default tree (apps/bitrouter enables
    #      `bitrouter-telemetry/otel-http` unconditionally), so the failure is
    #      a *misleading* one: the job
    #      blames a crate that does not exist for a dependency it never had.
    #      Drop either from the workspace default tree and the same typo flips
    #      to the opposite failure — a negative assertion that passes forever
    #      without checking anything. Guard: assert workspace membership via
    #      `cargo metadata` before using a name in `-p`.
    #
    # Literal `-p bitrouter-sdk` / `-p bitrouter-telemetry` uses are covered
    # already: the `cargo check -p` steps above exit 101 on an unknown package
    # spec (unlike `cargo tree`).
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check -p bitrouter-sdk --no-default-features
      - run: cargo check -p bitrouter-sdk --no-default-features --features config_file
      - run: cargo check -p bitrouter-guardrails
      - run: cargo check -p bitrouter-sdk --no-default-features --features server
      - run: cargo check -p bitrouter-sdk --no-default-features --features acp
      - run: cargo check -p bitrouter-sdk --no-default-features --features acp-controller
      - run: cargo check -p bitrouter-telemetry --no-default-features --features otel-http
      - run: cargo check -p bitrouter-telemetry --no-default-features --features otel-grpc
      - run: cargo check -p bitrouter-telemetry --no-default-features --features otel,server
      - name: the OpenTelemetry stack never reaches the SDK
        # The gate the telemetry crate exists for, and the strongest form of
        # it: not "off by default" but absent at every feature combination.
        # `--all-features` is the whole point — a feature that quietly pulled
        # the stack back into the foundation crate would pass a default-tree
        # check and fail this one.
        #
        # Scope, because the first draft got this wrong and failed on its first
        # CI run. Only crates that can be in the SDK's tree *solely* because of
        # the OTLP renderer belong here. `tracing-subscriber`, `tonic` and
        # `dashmap` were on the list and do not qualify: they are
        # general-purpose, and something unrelated may legitimately want them.
        # `tracing-subscriber` promptly proved it — `agent-client-protocol-conductor`
        # pulls it, so the over-broad list failed on a dependency that has
        # nothing to do with telemetry.
        #
        # The semver argument this job serves was never about tree membership
        # anyway. It is about *public* dependencies, and
        # `public-api-deps.txt` below is what guards those. A crate can sit in
        # the tree transitively forever without costing a semver commitment;
        # only appearing in a public signature does that. Do not conflate them
        # again by re-widening this list.
        #
        # `tonic` and `dashmap` keep their guard in "telemetry default tree
        # stays lean" and "transports stay isolated", where the question asked
        # is one they can actually answer.
        run: |
          for pkg in opentelemetry opentelemetry_sdk opentelemetry-otlp \
                     opentelemetry-semantic-conventions tracing-opentelemetry; do
            if ! cargo tree -p bitrouter-telemetry --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-sdk --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg reached bitrouter-sdk — the OTLP renderer belongs in bitrouter-telemetry; see docs/TELEMETRY_CRATE_SPEC.md"; exit 1
            fi
          done
      - name: "`acp` routing does not drag an HTTP server"
        # `acp` is documented as the thin proxy plus the live runtime. The
        # connection-level controller sits behind `acp-controller` because it
        # needs `agent-client-protocol-conductor`, which reaches `axum`
        # non-optionally through `agent-client-protocol-trace-viewer`. Folded
        # together, a consumer wanting ACP routing linked a whole HTTP server —
        # `dist-helper` did, until it stopped enabling a feature it never used.
        run: |
          if ! cargo tree -p bitrouter-sdk --no-default-features --features acp-controller \
               -e normal -i agent-client-protocol-conductor >/dev/null 2>&1; then
            echo "::error::the conductor is in no tree at all — has acp-controller been renamed?"; exit 1
          fi
          for pkg in axum agent-client-protocol-conductor; do
            if cargo tree -p bitrouter-sdk --no-default-features --features acp -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg reached the SDK through the \`acp\` feature; the controller belongs behind \`acp-controller\`"; exit 1
            fi
          done
      - name: SDK default tree stays lean
        # Just `axum` now: the OTel names moved to their own steps above, and
        # `tower` is not a valid subject here — `reqwest` puts it in the
        # default tree regardless of the `server` feature.
        run: |
          for pkg in axum; do
            if ! cargo tree -p bitrouter-sdk --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-sdk --no-default-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg is in bitrouter-sdk's default tree"; exit 1
            fi
          done
      - name: telemetry default tree stays lean
        run: |
          for pkg in opentelemetry opentelemetry_sdk opentelemetry-otlp \
                     tracing-opentelemetry tracing-subscriber tonic dashmap axum; do
            if ! cargo tree -p bitrouter-telemetry --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-telemetry --no-default-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg is in bitrouter-telemetry's default tree"; exit 1
            fi
          done
      - name: transports stay isolated
        run: |
          for pkg in tonic axum; do
            if ! cargo tree -p bitrouter-telemetry --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-telemetry --no-default-features --features otel-http -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg leaked into the otel-http tree"; exit 1
            fi
          done
      - name: consumers stay lean when consumed on their own
        # Scope, stated exactly, because the obvious reading of this step is
        # wrong and the wrong reading is the reassuring one.
        #
        # `cargo tree -p <crate>` resolves that crate's features IN ISOLATION —
        # what a downstream gets from `cargo add bitrouter-guardrails`. That is
        # a real shipped promise and this step guards it: pull the hook crate
        # on its own and no axum, no OpenTelemetry.
        #
        # It is NOT a claim about building this workspace. `apps/bitrouter`
        # enables `bitrouter-telemetry/otel-http` unconditionally, and cargo
        # unifies features across a workspace build, so `cargo build
        # --workspace` DOES link the OTel stack into every crate here —
        # `cargo tree --workspace -e normal -i opentelemetry` lists
        # bitrouter-guardrails among its dependents. Both facts are true at
        # once; they answer different questions. Do not "strengthen" this step
        # to assert the workspace case, and do not read its green as evidence
        # that the stack is absent from a local `cargo build`.
        #
        # `bitrouter-sdk` is in the crate loop now that the OTel stack is not
        # its to carry: `cargo add bitrouter-sdk` must pull neither.
        run: |
          if ! cargo tree -p bitrouter-sdk --all-features -e normal -i axum >/dev/null 2>&1; then
            echo "::error::axum resolves in no tree at all — misspelled?"; exit 1
          fi
          if ! cargo tree -p bitrouter-telemetry --all-features -e normal -i opentelemetry >/dev/null 2>&1; then
            echo "::error::opentelemetry resolves in no tree at all — misspelled?"; exit 1
          fi
          for crate in bitrouter-sdk bitrouter-guardrails bitrouter-providers dist-helper; do
            # `cargo tree -p` ignores an unknown spec and exits 0 (see the job
            # comment), so prove membership before trusting anything below.
            if ! cargo metadata --no-deps --format-version 1 \
                 | jq -e --arg c "$crate" '.packages[] | select(.name == $c)' >/dev/null; then
              echo "::error::unknown workspace crate: $crate"; exit 1
            fi
            for pkg in axum opentelemetry; do
              if cargo tree -p "$crate" -e normal -i "$pkg" >/dev/null 2>&1; then
                echo "::error::$crate must not depend on $pkg when resolved on its own (a workspace build unifies features and legitimately does link it)"; exit 1
              fi
            done
          done
      - name: "the OTel core without a transport is a compile error"
        run: |
          if out=$(cargo check -p bitrouter-telemetry --features __otel-core --message-format=short 2>&1); then
            echo "::error::expected the transport-less build to fail"; printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'the OpenTelemetry stack needs a transport' || {
            echo "::error::failed, but not with the transport compile_error"; printf '%s\n' "$out"; exit 1; }

  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    # The SDK owns the observability contract without owning any renderer of
    # it, and that only means something while the hard constraint holds:
    #
    #   No `opentelemetry*` or `tracing_opentelemetry` type may appear in any
    #   public `bitrouter-sdk` signature.
    #
    # `feature-isolation` now proves the stronger version — the stack is not in
    # the SDK's tree at any feature combination — so this job's `opentelemetry`
    # grep is the *forward* guard, not the live one: it is what catches the
    # next change that pulls a renderer back in. Keep it.
    #
    # "Signature" is broader than function returns — public struct fields, enum
    # variant payloads, trait method signatures, generic bounds, associated
    # types, type aliases, and re-exports all count. `cargo public-api` prints
    # one fully-qualified line per public item with rustdoc's own resolution
    # already applied, so all of those collapse into the same grep.
    #
    # `--simplified` omits blanket impls. That is load-bearing, not cosmetic:
    # `opentelemetry` has `impl<T> FutureExt for T`, which rustdoc attaches to
    # every documented type in the crate. Without the flag the listing carries
    # hundreds of `impl<T> opentelemetry::context::future_ext::FutureExt for
    # <every SDK type>` lines that this crate never authored, and the gate
    # below would be permanently red. The flag drops them structurally — no
    # allow-list, so a real `opentelemetry` leak still cannot hide behind one.
    #
    # The same listing feeds a committed manifest of the foreign crates the
    # public API reaches. A guard that only greps cannot see *unintended*
    # public API growth, which is how a public foreign type gets added in the
    # first place; the manifest makes that specific change show up in review
    # as a one-line diff.
    #
    # Linux-only on purpose: the SDK has `#[cfg(unix)]` items, so a Windows
    # runner would produce a different (correct, but non-matching) listing.
    # This is not folded into `feature-isolation` — that job is stable-only,
    # and rustdoc JSON needs nightly.
    steps:
      - uses: actions/checkout@v6
      - name: read the pins
        id: pin
        shell: bash
        run: |
          # Single source of truth: the pins live beside the baseline they
          # describe, so a human regenerating locally uses the same versions
          # this job runs on. Both are load-bearing — rustdoc's JSON format and
          # `cargo public-api`'s rendering each change across releases, and
          # either would rewrite the whole baseline.
          pins=crates/bitrouter-sdk/public-api.pins
          for key in toolchain tool; do
            value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
            if [[ -z "$value" ]]; then
              echo "::error::$pins has no '$key=' line"; exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This step exists only to build the helper binary below; the nightly
          # step is the one whose cache is worth keeping.
          cache: false
      # Built on stable. It shells out to `cargo rustdoc` itself and picks the
      # toolchain up from the `+<pin>` on the invocation further down.
      - name: install the pinned cargo-public-api
        run: cargo install --locked "${{ steps.pin.outputs.tool }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: render the SDK's public API
        shell: bash
        run: |
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p bitrouter-sdk --all-features --simplified > "$RUNNER_TEMP/public-api.txt"
      - name: the listing is real
        shell: bash
        run: |
          # The gates below are negative assertions over this one file, and an
          # empty or otel-less listing would satisfy every one of them
          # vacuously — exactly the silent pass this job exists to prevent.
          # Prove the surface under test is in the listing before trusting
          # anything the listing does not say.
          #
          # Both sentinels name the observability contract, which is what the
          # negative gates are ultimately about. They are ungated, so unlike
          # their predecessors they cannot go missing because a feature stopped
          # resolving — if they are absent, the listing itself is broken.
          for sentinel in \
            'pub mod bitrouter_sdk::observe' \
            'pub fn bitrouter_sdk::observe::schema::is_reserved_attribute_key'; do
            if ! grep -qF "$sentinel" "$RUNNER_TEMP/public-api.txt"; then
              echo "::error::'$sentinel' is missing — the listing is not real; do not trust the negative gates below"
              exit 1
            fi
          done
      - name: no opentelemetry type in the SDK's public API
        shell: bash
        run: |
          # Case-insensitive so it catches both the module paths
          # (`opentelemetry_sdk::…`, `tracing_opentelemetry::…`) and the type
          # names (`OpenTelemetryLayer`). `tracing_opentelemetry` contains
          # `opentelemetry`, so one pattern covers both crates.
          if hits="$(grep -niE 'opentelemetry' "$RUNNER_TEMP/public-api.txt")"; then
            echo "::error::opentelemetry types leaked into bitrouter-sdk's public API — see docs/TELEMETRY_CRATE_SPEC.md"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: no re-export of an OTel type out of the SDK
        shell: bash
        run: |
          # The one thing the listing grep above cannot see. `cargo public-api`
          # renders a bare re-export under its *local* path — re-exporting
          # `opentelemetry_sdk::trace::SdkTracer` from a module named `otel`
          # prints `pub use bitrouter_sdk::observe::SdkTracer`, with the origin crate
          # nowhere in the line. Types whose *name* carries "OpenTelemetry"
          # (e.g. `OpenTelemetrySpanExt`) do trip the grep; neutrally-named
          # ones do not. The baseline gate still catches the added line, but it
          # would not say why the line matters — so pin it at the source.
          #
          # Verbatim `pub use` only: `pub(crate) use` is not public API, and a
          # re-export laundered through a local alias is out of reach of any
          # lexical check. That residual is the baseline gate's job.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]+(::)?(opentelemetry|tracing_opentelemetry)' crates/bitrouter-sdk/src/)"; then
            echo "::error::bitrouter-sdk re-exports an OpenTelemetry type — see docs/TELEMETRY_CRATE_SPEC.md"
            printf '%s\n' "$hits"
            exit 1
          fi
      # Gates 1-3 above answer "is an OTel type public?". This one answers the
      # broader question a grep structurally cannot: "did the SDK gain a public
      # dependency nobody noticed?" That is not hypothetical — `tracing_core`
      # became public surface here via a generic bound, and no `opentelemetry`
      # grep would ever have seen it.
      #
      # We track the foreign-crate *set*, not the full item listing. The full
      # listing is ~8.5k lines of which ~22% is auto-derived marker impls
      # (`Sync`/`Unpin`/`RefUnwindSafe`/…), so adding one public struct writes
      # six lines of noise into review and the real signal drowns. The set
      # changes on exactly the semver-relevant event and is silent otherwise.
      - name: the SDK's public dependency surface is unchanged
        shell: bash
        run: |
          # Path roots only: the regex is greedy from the word boundary, so
          # `bitrouter_sdk::observe::SpanAttributes` yields `bitrouter_sdk`, not
          # `observe`. Generic params (`S`, `T`) start uppercase and never match.
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$RUNNER_TEMP/public-api.txt" \
            | cut -d: -f1 | sort -u \
            | grep -vxE 'bitrouter_sdk|core|std|alloc' > "$RUNNER_TEMP/public-api-deps.txt"
          if ! diff -u \
            <(grep -v '^#' crates/bitrouter-sdk/public-api-deps.txt) \
            "$RUNNER_TEMP/public-api-deps.txt"
          then
            echo "::error::bitrouter-sdk's public dependency surface changed. A '+' line means an upstream breaking release in that crate now becomes a BitRouter breaking release — confirm that is intended, then update crates/bitrouter-sdk/public-api-deps.txt (regeneration command in crates/bitrouter-sdk/public-api.pins)."
            exit 1
          fi

  dist:
    name: dist
    runs-on: ubuntu-latest
    # Guards generated distribution artifacts: the committed config schema and
    # registry dist JSON must match the Rust source/YAML data, and deprecated
    # YAML parsers must stay out of the graph.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: generated dist is up to date
        run: cargo run -p dist-helper -- check
      - name: no deprecated/unsound yaml parser in the graph
        run: |
          for crate in serde_yaml serde_yml; do
            if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
              echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
              cargo tree -i "$crate"
              exit 1
            fi
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93"
      - run: cargo check --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    # Build rustdoc for the whole workspace under -D warnings: any broken
    # intra-doc link or missing-docs warning becomes a CI failure. Matches
    # what docs.rs will run.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --workspace --all-features --no-deps

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    # Compile and run every ``` example in rustdoc comments. The plain
    # `test` job uses nextest, which does not execute doctests, so they
    # need their own pass.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --doc --workspace --all-features

  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    # Validate the agent-plugin manifests (.claude-plugin/, .codex-plugin/)
    # against the real loaders. Two gates:
    #   1. Claude Code has a purpose-built validator — run it strict.
    #   2. Codex has NO validator and its loader warn-and-ignores broken
    #      manifests (a typo silently drops a component), so we exercise
    #      the real install path in an isolated CODEX_HOME and
    #      presence-assert the plugin actually loaded.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: codex loader exercise (presence-asserted)
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add "$PWD"
          codex plugin add bitrouter@bitrouter
          codex plugin list --json | tee /tmp/codex-plugins.json
          jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
