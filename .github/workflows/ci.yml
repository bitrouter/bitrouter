name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject tracked files that match gitignore
        shell: bash
        run: |
          ignored_tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$ignored_tracked" ]]; then
            echo "::error::Tracked files must not also match .gitignore:"
            printf '%s\n' "$ignored_tracked"
            exit 1
          fi

      - name: reject standalone Python files
        shell: bash
        run: |
          python_files="$(git ls-files -- '*.py' '*.pyi' '*.pyw' '*.pyc')"
          if [[ -n "$python_files" ]]; then
            echo "::error::Use Rust for executable source and test fixtures:"
            printf '%s\n' "$python_files"
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux, macOS, and Windows are all first-class platforms — clippy and test
  # run on each, no "primary" OS. The daemon control surface in particular has
  # platform-specific code (Unix domain socket vs Windows named pipe, SIGHUP /
  # SIGTERM vs ctrl_c, kill vs taskkill) and the matrix catches a regression in
  # any one of them at PR time.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Rust 1.99 reports double_must_use inside async-trait expansions.
          # Keep strict linting on the verified compiler until the upstream
          # macro false-positive fix ships: rust-lang/rust-clippy#17529.
          toolchain: "1.97.0"
          components: clippy
      - run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            retries: "0"
          - os: windows-latest
            # Windows also exposes the trajectory timestamp race under load.
            retries: "2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --all-features
          --no-fail-fast
          --retries "${{ matrix.retries }}"

  # A cold all-features build used to compile and link every large application
  # test target on one runner. Split by Cargo target so each runner has bounded
  # late-stage link pressure while preserving the original Linux test surface.
  test-ubuntu-workspace:
    name: test (ubuntu-latest, workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --exclude bitrouter --all-features
          --build-jobs 2

  test-ubuntu-bitrouter:
    name: test (ubuntu-latest, bitrouter ${{ matrix.target }})
    needs: test-ubuntu-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lib
            build_jobs: "2"
            flags: --lib
          - target: bin
            build_jobs: "1"
            flags: --bin bro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: add swap for the lib test harness
        if: matrix.target == 'lib'
        run: |
          sudo fallocate --length 8G /swapfile-bitrouter
          sudo chmod 600 /swapfile-bitrouter
          sudo mkswap /swapfile-bitrouter
          sudo swapon /swapfile-bitrouter
          free -h
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: false
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - env:
          TEST_BUILD_JOBS: ${{ matrix.build_jobs }}
          TEST_TARGET_FLAGS: ${{ matrix.flags }}
        shell: bash
        run: |
          read -r -a target_flags <<< "$TEST_TARGET_FLAGS"
          cargo nextest run -p bitrouter --all-features \
            --build-jobs "$TEST_BUILD_JOBS" \
            "${target_flags[@]}"

  test-ubuntu-integration:
    name: test (ubuntu-latest, bitrouter integration ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: interfaces
            retries: "0"
            targets: >-
              --test acp --test acp_checkpoints --test native_acp --test cloud_api --test daemon --test e2e
              --test full_stack --test configuration_state --test extension_host --test subscription
              --test router_continuation --test router_migration_cli --test request_checks --test guardrails_migration
          - shard: gateway
            retries: "0"
            targets: >-
              --test gateway_anthropic_authority --test gateway_decision_model
              --test gateway_decisions --test gateway_model_boundary
              --test gateway_routing_assessment --test gateway_routing_plan
          - shard: observability
            retries: "0"
            targets: >-
              --test agent_trace_generalization --test observe_hierarchy
              --test workflow_state_real_agent_e2e
              --test workflow_state_replay --test telemetry_ingress_log_target --test source_boundaries
          - shard: core-scheduling
            retries: "0"
            targets: --test core_contract --test core_execution
          - shard: optimization
            retries: "0"
            targets: >-
              --test eval_exchange_equivalence --test optimization_output
              --test policy_eval_control_plane
          - shard: control-plane
            # Trajectory assertions occasionally observe async event timestamps
            # out of order; retry the isolated test process before failing CI.
            retries: "2"
            targets: >-
              --test managed_native --test onboarding --test smithers_reward_loop
              --test terminus_2_workflow_state
              --test trajectory_progress_control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: ${{ matrix.shard == 'interfaces' }}
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - name: run integration shard
        shell: bash
        env:
          TEST_RETRIES: ${{ matrix.retries }}
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a test_targets <<< "$TEST_TARGETS"
          cargo nextest run -p bitrouter --all-features --build-jobs 2 \
            --retries "$TEST_RETRIES" \
            "${test_targets[@]}"

  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
      - test-ubuntu-workspace
      - test-ubuntu-bitrouter
      - test-ubuntu-integration
    runs-on: ubuntu-latest
    env:
      WORKSPACE_RESULT: ${{ needs.test-ubuntu-workspace.result }}
      BITROUTER_RESULT: ${{ needs.test-ubuntu-bitrouter.result }}
      INTEGRATION_RESULT: ${{ needs.test-ubuntu-integration.result }}
    steps:
      - name: require every ubuntu test shard
        shell: bash
        run: |
          for result in \
            "$WORKSPACE_RESULT" \
            "$BITROUTER_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Ubuntu test shard finished with: $result"
              exit 1
            fi
          done

  feature-isolation:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: verify final workspace membership
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e '
            [.packages[].name] | sort ==
            ["bitrouter", "bitrouter-ai", "bitrouter-guardrails", "bitrouter-sdk", "dist-helper"]'
      - name: contracts and client build independently
        run: |
          cargo test -p bitrouter-ai
          cargo test -p bitrouter-ai --all-features
          cargo test -p bitrouter-sdk
          cargo test -p bitrouter-sdk --all-features
          cargo test -p bitrouter-guardrails --all-features
      - name: inspect isolated production dependency closures
        shell: bash
        run: |
          # Successful checks above prove package membership. Inspect forward
          # trees: an unknown inverted dependency must not count as evidence.
          for flags in '' '--all-features'; do
            cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
            if grep -Eq '^(bitrouter(-sdk)?|reqwest|tokio(-[^ ]*)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
              echo '::error::AI public contracts pulled runtime dependencies'; exit 1
            fi
            cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
            if grep -Eq '^(bitrouter|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
              echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
            fi
          done
          cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
          if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
            echo '::error::matcher depends on its host implementation'; exit 1
          fi
          cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
          if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
            echo '::error::default bro links the optional matcher'; exit 1
          fi

  application-features:
    name: application-features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ''
          - core
          - harness
          - tui
          - core,harness
          - core,tui
          - mcp
          - server-tools
          - guardrails
          - otel-http
          - otel-grpc
          - otel-http,otel-grpc
          - harness,otel-http
          - db-postgres
          - db-mysql
          - mcp,server-tools,otel-http,db-postgres,db-mysql
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build selected profile without workspace feature unification
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: |
          cargo check -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --all-targets
          cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
          case ",$PROFILE_FEATURES," in
            *,tui,*) ;;
            *) if grep -Eq '^(ratatui(-[^ ]*)?|crossterm) v' profile-tree.txt; then
                 echo '::error::headless profile pulled terminal dependencies'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,harness,*|*,tui,*) ;;
            *) if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
                 echo '::error::profile without harness pulled ACP runtime'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,otel-http,*|*,otel-grpc,*) ;;
            *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
                 echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,otel-grpc,*) ;;
            *) if grep -Eq '^tonic v' profile-tree.txt; then
                 echo '::error::profile without gRPC pulled tonic'; exit 1
               fi ;;
          esac

  telemetry-transports:
    name: telemetry (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: otel-http
            targets: --test telemetry_ingress_log_target --test observe_hierarchy --test full_stack
          - transport: otel-grpc
            targets: --test telemetry_grpc_transport
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p bitrouter --no-default-features --features ${{ matrix.transport }} ${{ matrix.targets }}

  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    # The SDK owns the observability contract without owning any renderer of
    # it, and that only means something while the hard constraint holds:
    #
    #   No `opentelemetry*` or `tracing_opentelemetry` type may appear in any
    #   public `bitrouter-sdk` signature.
    #
    # `feature-isolation` now proves the stronger version — the stack is not in
    # the SDK's tree at any feature combination — so this job's `opentelemetry`
    # grep is the *forward* guard, not the live one: it is what catches the
    # next change that pulls a renderer back in. Keep it.
    #
    # "Signature" is broader than function returns — public struct fields, enum
    # variant payloads, trait method signatures, generic bounds, associated
    # types, type aliases, and re-exports all count. `cargo public-api` prints
    # one fully-qualified line per public item with rustdoc's own resolution
    # already applied, so all of those collapse into the same grep.
    #
    # `--simplified` omits blanket impls. That is load-bearing, not cosmetic:
    # `opentelemetry` has `impl<T> FutureExt for T`, which rustdoc attaches to
    # every documented type in the crate. Without the flag the listing carries
    # hundreds of `impl<T> opentelemetry::context::future_ext::FutureExt for
    # <every SDK type>` lines that this crate never authored, and the gate
    # below would be permanently red. The flag drops them structurally — no
    # allow-list, so a real `opentelemetry` leak still cannot hide behind one.
    #
    # The same listing feeds a committed manifest of the foreign crates the
    # public API reaches. A guard that only greps cannot see *unintended*
    # public API growth, which is how a public foreign type gets added in the
    # first place; the manifest makes that specific change show up in review
    # as a one-line diff.
    #
    # Linux-only on purpose: the SDK has `#[cfg(unix)]` items, so a Windows
    # runner would produce a different (correct, but non-matching) listing.
    # This is not folded into `feature-isolation` — that job is stable-only,
    # and rustdoc JSON needs nightly.
    steps:
      - uses: actions/checkout@v6
      - name: read the pins
        id: pin
        shell: bash
        run: |
          # Single source of truth: the pins live beside the baseline they
          # describe, so a human regenerating locally uses the same versions
          # this job runs on. Both are load-bearing — rustdoc's JSON format and
          # `cargo public-api`'s rendering each change across releases, and
          # either would rewrite the whole baseline.
          pins=crates/bitrouter-sdk/public-api.pins
          for key in toolchain tool; do
            value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
            if [[ -z "$value" ]]; then
              echo "::error::$pins has no '$key=' line"; exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This step exists only to build the helper binary below; the nightly
          # step is the one whose cache is worth keeping.
          cache: false
      # Built on stable. It shells out to `cargo rustdoc` itself and picks the
      # toolchain up from the `+<pin>` on the invocation further down.
      - name: install the pinned cargo-public-api
        run: cargo install --locked "${{ steps.pin.outputs.tool }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: render the SDK's public API
        shell: bash
        run: |
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p bitrouter-sdk --all-features --simplified > "$RUNNER_TEMP/public-api.txt"
      - name: the listing is real
        shell: bash
        run: |
          # The gates below are negative assertions over this one file, and an
          # empty or otel-less listing would satisfy every one of them
          # vacuously — exactly the silent pass this job exists to prevent.
          # Prove the surface under test is in the listing before trusting
          # anything the listing does not say.
          #
          # Verify ungated host API declarations before using negative checks.
          # Contract declarations now belong to bitrouter-ai.
          for sentinel in \
            'pub mod bitrouter_sdk::extension' \
            'pub fn bitrouter_sdk::extension::ExtensionApi::request_check'; do
            if ! grep -qF "$sentinel" "$RUNNER_TEMP/public-api.txt"; then
              echo "::error::'$sentinel' is missing — the listing is not real; do not trust the negative gates below"
              exit 1
            fi
          done
      - name: no opentelemetry type in the SDK's public API
        shell: bash
        run: |
          # Case-insensitive so it catches both the module paths
          # (`opentelemetry_sdk::…`, `tracing_opentelemetry::…`) and the type
          # names (`OpenTelemetryLayer`). `tracing_opentelemetry` contains
          # `opentelemetry`, so one pattern covers both crates.
          if hits="$(grep -niE 'opentelemetry' "$RUNNER_TEMP/public-api.txt")"; then
            echo "::error::opentelemetry types leaked into bitrouter-sdk's public API — see docs/TELEMETRY_CRATE_SPEC.md"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: no re-export of an OTel type out of the SDK
        shell: bash
        run: |
          # The one thing the listing grep above cannot see. `cargo public-api`
          # renders a bare re-export under its *local* path — re-exporting
          # `opentelemetry_sdk::trace::SdkTracer` from a module named `otel`
          # prints `pub use bitrouter_sdk::observe::SdkTracer`, with the origin crate
          # nowhere in the line. Types whose *name* carries "OpenTelemetry"
          # (e.g. `OpenTelemetrySpanExt`) do trip the grep; neutrally-named
          # ones do not. The baseline gate still catches the added line, but it
          # would not say why the line matters — so pin it at the source.
          #
          # Verbatim `pub use` only: `pub(crate) use` is not public API, and a
          # re-export laundered through a local alias is out of reach of any
          # lexical check. That residual is the baseline gate's job.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]+(::)?(opentelemetry|tracing_opentelemetry)' crates/bitrouter-sdk/src/)"; then
            echo "::error::bitrouter-sdk re-exports an OpenTelemetry type — see docs/TELEMETRY_CRATE_SPEC.md"
            printf '%s\n' "$hits"
            exit 1
          fi
      # Gates 1-3 above answer "is an OTel type public?". This one answers the
      # broader question a grep structurally cannot: "did the SDK gain a public
      # dependency nobody noticed?" That is not hypothetical — `tracing_core`
      # became public surface here via a generic bound, and no `opentelemetry`
      # grep would ever have seen it.
      #
      # We track the foreign-crate *set*, not the full item listing. The full
      # listing is ~8.5k lines of which ~22% is auto-derived marker impls
      # (`Sync`/`Unpin`/`RefUnwindSafe`/…), so adding one public struct writes
      # six lines of noise into review and the real signal drowns. The set
      # changes on exactly the semver-relevant event and is silent otherwise.
      - name: the SDK's public dependency surface is unchanged
        shell: bash
        run: |
          # Path roots only: the regex is greedy from the word boundary, so
          # `bitrouter_sdk::observe::SpanAttributes` yields `bitrouter_sdk`, not
          # `observe`. Generic params (`S`, `T`) start uppercase and never match.
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$RUNNER_TEMP/public-api.txt" \
            | cut -d: -f1 | sort -u \
            | grep -vxE 'bitrouter_sdk|core|std|alloc' > "$RUNNER_TEMP/public-api-deps.txt"
          if ! diff -u \
            <(grep -v '^#' crates/bitrouter-sdk/public-api-deps.txt) \
            "$RUNNER_TEMP/public-api-deps.txt"
          then
            echo "::error::bitrouter-sdk's public dependency surface changed. A '+' line means an upstream breaking release in that crate now becomes a BitRouter breaking release — confirm that is intended, then update crates/bitrouter-sdk/public-api-deps.txt (regeneration command in crates/bitrouter-sdk/public-api.pins)."
            exit 1
          fi

  dist:
    name: dist
    runs-on: ubuntu-latest
    # Guards generated distribution artifacts: the committed config schema and
    # registry dist JSON must match the Rust source/YAML data, and deprecated
    # YAML parsers must stay out of the graph.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: registry source is valid
        # Advisories (non-curated provider models, unpinned agent invocations,
        # agents with no conformance record) are expected and do not fail.
        run: cargo run -p dist-helper -- registry validate
      - name: generated dist is up to date
        run: cargo run -p dist-helper -- check
      - name: no deprecated/unsound yaml parser in the graph
        run: |
          for crate in serde_yaml serde_yml; do
            if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
              echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
              cargo tree -i "$crate"
              exit 1
            fi
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93"
      - run: cargo check --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    # Build rustdoc for the whole workspace under -D warnings: any broken
    # intra-doc link or missing-docs warning becomes a CI failure. Matches
    # what docs.rs will run.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --workspace --all-features --no-deps

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    # Compile and run every ``` example in rustdoc comments. The plain
    # `test` job uses nextest, which does not execute doctests, so they
    # need their own pass.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --doc --workspace --all-features

  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    # Validate the agent-plugin manifests (.claude-plugin/, .codex-plugin/)
    # against the real loaders. Two gates:
    #   1. Claude Code has a purpose-built validator — run it strict.
    #   2. Codex has NO validator and its loader warn-and-ignores broken
    #      manifests (a typo silently drops a component), so we exercise
    #      the real install path in an isolated CODEX_HOME and
    #      presence-assert the plugin actually loaded.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: codex loader exercise (presence-asserted)
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add "$PWD"
          codex plugin add bitrouter@bitrouter
          codex plugin list --json | tee /tmp/codex-plugins.json
          jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
