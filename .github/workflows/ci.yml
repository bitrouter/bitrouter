name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject tracked files that match gitignore
        shell: bash
        run: |
          ignored_tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$ignored_tracked" ]]; then
            echo "::error::Tracked files must not also match .gitignore:"
            printf '%s\n' "$ignored_tracked"
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux, macOS, and Windows are all first-class platforms — clippy and test
  # run on each, no "primary" OS. The daemon control surface in particular has
  # platform-specific code (Unix domain socket vs Windows named pipe, SIGHUP /
  # SIGTERM vs ctrl_c, kill vs taskkill) and the matrix catches a regression in
  # any one of them at PR time.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cache-warm run of this job takes ~2-3 minutes; a cold one has to build
    # the whole `--all-features` graph, which is tens of GB of target tree. Cap
    # the job so an exhausted runner fails readably instead of dying at ~49
    # minutes with no uploaded logs at all (bitrouter/bitrouter#809, #811).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # ubuntu runners preinstall ~25 GB of toolchains this workspace never
      # uses, leaving roughly 14 GB free. A cold `--workspace --all-features`
      # target tree does not fit in that. When the disk fills, the runner is
      # killed mid-step — which surfaces as a ~49 minute hang with no logs
      # rather than an error, because logs are only uploaded when a job ends
      # cleanly. The `df` lines on either side are deliberate: they are the
      # evidence that says whether disk was ever the constraint.
      - name: reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          echo "::group::disk before reclaim"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "::group::disk after reclaim"
          df -h /
          echo "::endgroup::"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - name: diagnose ubuntu test build
        if: runner.os == 'Linux'
        shell: bash
        # Bypass the partial target cache created by the two-minute probe so
        # this run exercises a known-cold build on the same runner shape.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cold-target
        run: |
          snapshot() {
            {
              echo "resource snapshot: $(date --utc --iso-8601=seconds)"
              free -h
              df -h /
              df -ih /
              uptime
              ps -eo pid,ppid,%cpu,%mem,rss,etime,stat,comm,args --sort=-rss \
                | sed -n '1,16p'
              echo
            } 2>&1 | tee -a "$RUNNER_TEMP/ubuntu-test-resources.log"
          }

          snapshot
          while sleep 10; do snapshot; done &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          # The runner stopped responding to a 15-minute deadline even with
          # Cargo compilation serialized. Capture the original workload's
          # early resource curve and exit before the host becomes unresponsive.
          set +e
          timeout --signal=INT --kill-after=30s 150s \
            cargo nextest run --workspace --all-features
          nextest_status=$?
          set -e

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          trap - EXIT
          snapshot

          if [[ "$nextest_status" -eq 124 ]]; then
            echo "::error::Diagnostic deadline reached; inspect ubuntu-test-resources"
          fi
          exit "$nextest_status"
      - name: run tests
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --all-features
      # `always()` so this still reports when the build itself failed — a
      # near-zero figure here is the confirmation that disk was the cause.
      - name: disk after build
        if: always() && runner.os == 'Linux'
        run: df -h /
      - name: upload ubuntu test diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-resources
          path: ${{ runner.temp }}/ubuntu-test-resources.log
          if-no-files-found: warn
          retention-days: 3

  feature-isolation:
    name: feature-isolation
    runs-on: ubuntu-latest
    # Verifies the SDK builds without its `server` feature, and that the
    # default builds of the hook crates stay lean — guardrails never carries
    # the axum HTTP stack, and observe only pulls it in under its opt-in
    # `otel-*` features.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check -p bitrouter-sdk --no-default-features
      - run: cargo check -p bitrouter-sdk --no-default-features --features config_file
      - run: cargo check -p bitrouter-guardrails
      - run: cargo check -p bitrouter-observe
      - name: assert axum not in default hook-crate dep trees
        run: |
          for crate in bitrouter-guardrails bitrouter-observe; do
            if cargo tree -p "$crate" -i axum 2>/dev/null | grep -q '^axum'; then
              echo "::error::$crate must not depend on axum by default"
              exit 1
            fi
          done

  dist:
    name: dist
    runs-on: ubuntu-latest
    # Guards generated distribution artifacts: the committed config schema and
    # registry dist JSON must match the Rust source/YAML data, and deprecated
    # YAML parsers must stay out of the graph.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: generated dist is up to date
        run: cargo run -p dist-helper -- check
      - name: no deprecated/unsound yaml parser in the graph
        run: |
          for crate in serde_yaml serde_yml; do
            if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
              echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
              cargo tree -i "$crate"
              exit 1
            fi
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93"
      - run: cargo check --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    # Build rustdoc for the whole workspace under -D warnings: any broken
    # intra-doc link or missing-docs warning becomes a CI failure. Matches
    # what docs.rs will run.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --workspace --all-features --no-deps

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    # Compile and run every ``` example in rustdoc comments. The plain
    # `test` job uses nextest, which does not execute doctests, so they
    # need their own pass.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --doc --workspace --all-features

  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    # Validate the agent-plugin manifests (.claude-plugin/, .codex-plugin/)
    # against the real loaders. Two gates:
    #   1. Claude Code has a purpose-built validator — run it strict.
    #   2. Codex has NO validator and its loader warn-and-ignores broken
    #      manifests (a typo silently drops a component), so we exercise
    #      the real install path in an isolated CODEX_HOME and
    #      presence-assert the plugin actually loaded.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: codex loader exercise (presence-asserted)
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add "$PWD"
          codex plugin add bitrouter@bitrouter
          codex plugin list --json | tee /tmp/codex-plugins.json
          jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
