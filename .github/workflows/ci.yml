    needs:
    - build-linux
  application-features:
    name: feature compile (${{ matrix.batch }})
    runs-on: ubuntu-latest
    env:
      BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - batch: 0
          features: '["", "harness", "server-tools", "otel-grpc", "db-postgres", "db-mysql"]'
        - batch: 1
          features: '["http2", "core,harness", "guardrails", "otel-http,otel-grpc", "multi-instance", "mcp,server-tools,otel-http,db-postgres,db-mysql"]'
        - batch: 2
          features: '["core", "mcp", "otel-http", "harness,otel-http", "multi-instance,http2"]'
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
    - name: Check isolated production feature closures
      shell: bash
      env:
        FEATURES: ${{ matrix.features }}
      run: |
        while IFS= read -r PROFILE_FEATURES; do
        # Check production before dev-dependencies can unify extra features.
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bro
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --all-targets
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
        # Only the minimal gateway distributions promise an h2-free
        # production closure. Other features (such as otel-grpc) may need h2.
        case "$PROFILE_FEATURES" in
          ''|multi-instance)
            if grep -Eq '^h2 v' profile-tree.txt; then
              echo '::error::minimal HTTP/1 gateway profile pulled h2'; exit 1
            fi ;;
        esac
        if grep -Eq '^(ratatui(-[^ ]*)?|crossterm) v' profile-tree.txt; then
               echo '::error::headless profile pulled terminal dependencies'; exit 1
        fi
        case ",$PROFILE_FEATURES," in
          *,harness,*) ;;
          *) if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
               echo '::error::profile without harness pulled ACP runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,harness,*) ;;
          *)
             # Registry admission validates its wire schema in every profile.
             # The application must still keep harness result validation optional.
             cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" \
               -e normal,build -i jsonschema --depth 1 --prefix none > profile-schema-owners.txt
             if grep -Ev '^(jsonschema|bitrouter-registry) v' profile-schema-owners.txt; then
               echo '::error::profile without harness pulled schema validation outside registry'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,mcp,*|*,server-tools,*|*,harness,*) ;;
          *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
               echo '::error::profile without MCP pulled its transport runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-http,*|*,otel-grpc,*) ;;
          *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
               echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-grpc,*) ;;
          *) if grep -Eq '^tonic v' profile-tree.txt; then
               echo '::error::profile without gRPC pulled tonic'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-postgres,*|*,multi-instance,*) ;;
          *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
               echo '::error::profile without PostgreSQL pulled its driver'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-mysql,*) ;;
          *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
               echo '::error::profile without MySQL pulled its driver'; exit 1
             fi ;;
        esac

        done < <(jq -r '.[]' <<< "$FEATURES")
    timeout-minutes: 40
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  feature-isolation:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: verify final workspace membership
      run: |
        cargo metadata --no-deps --format-version 1 | jq -e '
          [.packages[].name] | sort ==
          ["bitrouter", "bitrouter-ai", "bitrouter-guardrails", "bitrouter-registry", "bitrouter-sdk", "dist-helper"]'
    - name: verify SDK without HTTP/2
      run: |
        # Check production before test dependencies can enable HTTP/2.
        cargo check --locked -p bitrouter-sdk --no-default-features --lib
        cargo check --locked -p bitrouter-sdk --no-default-features --features core --lib
        cargo check --all-targets --locked -p bitrouter-sdk --no-default-features --test transport_protocol
    - name: contracts, registry and client build independently
      run: |
        cargo check --all-targets -p bitrouter-registry --all-features
        cargo check --all-targets -p bitrouter-ai
        cargo check --all-targets -p bitrouter-ai --all-features
        cargo check --all-targets -p bitrouter-sdk
        cargo check --all-targets -p bitrouter-sdk --all-features
        cargo check --all-targets -p bitrouter-guardrails --all-features
    - name: inspect isolated production dependency closures
      shell: bash
      run: |
        # Successful checks above prove package membership. Inspect forward
        # trees: an unknown inverted dependency must not count as evidence.
        for flags in '' '--no-default-features' '--all-features'; do
          cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
          if grep -Eq '^(bitrouter(-sdk)?|reqwest|tokio(-[^ ]*)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
            echo '::error::AI public contracts pulled runtime dependencies'; exit 1
          fi
          cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
          if grep -Eq '^(bitrouter|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
            echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
        if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
          echo '::error::matcher depends on its host implementation'; exit 1
        fi
        cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
        if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
          echo '::error::default bro links the optional matcher'; exit 1
        fi
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: read the pins
      id: pin
      shell: bash
      run: |
        pins=crates/bitrouter-sdk/public-api.pins
        for key in toolchain tool; do
          value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
          if [[ -z "$value" ]]; then
            echo "::error::$pins has no '$key=' line"; exit 1
          fi
          echo "$key=$value" >> "$GITHUB_OUTPUT"
        done
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false
    - name: install the pinned cargo-public-api
      run: cargo install --locked "${{ steps.pin.outputs.tool }}"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
    - name: verify public contract and client surfaces
      shell: bash
      run: |
        for package in bitrouter-ai bitrouter-sdk; do
          listing="$RUNNER_TEMP/$package-public-api.txt"
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p "$package" --all-features --simplified > "$listing"
          # --simplified excludes foreign blanket impls rustdoc attaches to
          # every type. Real authored fields and bounds remain in the listing.
          if [[ "$package" == bitrouter-ai ]]; then
            sentinels=(
              'pub struct bitrouter_ai::protocol::chat_completions::ChatRequest'
              'pub struct bitrouter_ai::gateway::ModelsResponse'
              'pub mod bitrouter_ai::extension'
              'pub struct bitrouter_ai::control::reload::ReloadInput'
              'pub struct bitrouter_ai::control::requests::RequestFilters'
              'pub struct bitrouter_ai::control::status::StatusReport'
              'pub enum bitrouter_ai::control::action::Action'
              'pub struct bitrouter_ai::control::error::ErrorEnvelope'
              'pub struct bitrouter_ai::eval::EvalSubject'
              'pub struct bitrouter_ai::eval::AdmissionOutcome'
              'pub struct bitrouter_ai::core::evidence::NativeAttemptReport'
              'pub enum bitrouter_ai::core::evidence::NativeTokenCost'
              'pub struct bitrouter_ai::core::protocol::ClientMessage'
              'pub enum bitrouter_ai::core::protocol::ServerMessage'
              'pub struct bitrouter_ai::core::protocol::ErrorEnvelope'
              'pub struct bitrouter_ai::core::checkpoint::CheckpointBatch'
              'pub struct bitrouter_ai::core::responses::CreateRequest'
              'pub struct bitrouter_ai::core::responses::FunctionOutput'
            )
            forbidden='extension::request_check::Registration|ExtensionApi|NativeExecutionControl|NativePrivateContextRuntime|CommitGate|VerifiedBatch|CheckpointBatchExt|HarnessManifestExt|ClientMessageExt|ToolResultLimitsExt|::capture_cache|::commitment\(|ToolResultOutput::(from_untyped_value|to_provider_string)|DataContent::(to_url|from_url)|Source::synthesize_id|GenerationParams::(extras_for_protocol|extra_value_for_protocol)|Prompt::required_capabilities|ModelTokenLimits::output_reservation_covers_model|NativeRoute::requires_input_count|Limits::within|Capabilities::negotiate|bitrouter::|bitrouter_sdk::|reqwest::|tokio::|axum|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::'
          else
            sentinels=(
              'pub struct bitrouter_sdk::gateway::GatewayClient'
              'bitrouter_sdk::gateway::GatewayClient::chat_completions'
              'bitrouter_sdk::gateway::GatewayClient::stream_responses'
              'pub struct bitrouter_sdk::control::ControlClient'
              'bitrouter_sdk::control::ControlClient::reload'
              'bitrouter_sdk::control::ControlClient::operation'
              'bitrouter_sdk::gateway::GatewayClient::submit_eval_result'
              'bitrouter_sdk::gateway::GatewayClient::eval_snapshot'
              'bitrouter_sdk::gateway::GatewayClient::core_capabilities'
              'bitrouter_sdk::gateway::GatewayClient::managed_responses'
              'bitrouter_sdk::gateway::GatewayClient::stream_managed_responses'
              'bitrouter_sdk::gateway::GatewayClient::core_channel'
              'pub struct bitrouter_sdk::core::CoreChannel'
              'pub struct bitrouter_sdk::core::CoreSender'
              'pub struct bitrouter_sdk::core::CoreReceiver'
            )
            forbidden='bitrouter::|axum|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::|tokio_tungstenite|tungstenite::'
          fi
          for sentinel in "${sentinels[@]}"; do
            if ! grep -qF "$sentinel" "$listing"; then
              echo "::error::$package public API listing is missing '$sentinel'"
              exit 1
            fi
          done
          if hits="$(grep -niE "$forbidden" "$listing")"; then
            echo "::error::runtime ownership leaked into $package's public API"
            printf '%s\n' "$hits"
            exit 1
          fi
          # A public re-export can hide its foreign origin in the listing.
          # Consumers import each contract from its owning public module.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]' "crates/$package/src/")"; then
            echo "::error::$package contains a public forwarding export"
            printf '%s\n' "$hits"
            exit 1
          fi
          crate_name="${package//-/_}"
          # Authored conversion impls can render primitive paths such as
          # u64::from. These are built-in types, not external crate roots.
          primitives='bool|char|str|[ui](8|16|32|64|128|size)|f(16|32|64|128)'
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$listing" \
            | cut -d: -f1 | sort -u \
            | grep -vxE "$crate_name|core|std|alloc|$primitives" > "$RUNNER_TEMP/$package-public-api-deps.txt"
          diff -u \
            <(grep -v '^#' "crates/$package/public-api-deps.txt") \
            "$RUNNER_TEMP/$package-public-api-deps.txt"
        done
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: registry source is valid
      run: cargo run -p dist-helper -- registry validate
    - name: generated dist is up to date
      run: cargo run -p dist-helper -- check
    - name: no deprecated/unsound yaml parser in the graph
      run: |
        for crate in serde_yaml serde_yml; do
          if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
            echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
            cargo tree -i "$crate"
            exit 1
          fi
        done
    needs:
    - changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.registry == 'true'
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.93'
    - run: cargo check --workspace --all-features
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo doc --workspace --all-features --no-deps
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test --doc --workspace --all-features
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  test-platform:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          targets: --test daemon --test host_lifecycle --test mcp_config_pty --test onboarding_pty
          filter: (binary(=daemon) & (test(=status_route_and_stop_roundtrip_over_the_control_socket) | test(=concurrent_clients_are_all_served) | test(=socket_file_has_owner_only_permissions)))
            | (binary(=host_lifecycle) & test(=sigterm_control_error_drains_inflight_inference_before_nonzero_exit)) | binary(=mcp_config_pty) | binary(=onboarding_pty)
        - os: windows-latest
          targets: --lib --test daemon
          filter: test(=tenancy::ownership::unsupported_claim_tests::native_recovery_connector_refuses_before_creating_non_unix_authority) | test(=tenancy::tests::execution::native::local_tenancy_remains_unavailable_without_creating_files)
            | test(=providers::cli_install::tests::install_command_is_the_official_native_installer) | test(=paths::tests::replacing_private_file_overwrites_existing_destination_on_windows)
            | test(harness::tools::tests::powershell_) | test(=harness::tools::tests::dropped_powershell_future_stops_descendants) | test(=status_route_and_stop_roundtrip_over_the_control_socket)
            | test(=concurrent_clients_are_all_served) | test(=probe_status_reports_none_when_nothing_listens) | test(=client_fails_clearly_when_no_daemon_is_listening)
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Build platform fixtures
      if: runner.os == 'macOS'
      run: cargo build --locked -p bitrouter --all-features --example onboarding_fixture --jobs 2
    - name: Verify platform behavior
      shell: bash
      env:
        TARGETS: ${{ matrix.targets }}
        FILTER: ${{ matrix.filter }}
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
      run: |
        read -r -a targets <<< "$TARGETS"
        cargo nextest run --locked -p bitrouter --all-features "${targets[@]}" --build-jobs 2 --test-threads 2 --retries 0 --no-tests fail -E "$FILTER"
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
    - changes
    - repository-hygiene
    - fmt
    - agent-plugin
    - clippy
    - build-linux
    - test-linux
    - test-process
    - database-backends
    - application-features
    - feature-isolation
    - sdk-public-api
    - dist
    - msrv
    - doc
    - doctest
    - test-platform
    runs-on: ubuntu-24.04
    steps:
    - name: Require selected checks and reject failed or cancelled dependencies
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -e '
          .changes.result == "success" and
          ([to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length == 0) and
          (if .changes.outputs.code == "true" then
             [to_entries[].value] | all(.result == "success")
           else [."repository-hygiene", .fmt, ."agent-plugin"] | all(.result == "success") end) and
          (if .changes.outputs.registry == "true" then .dist.result == "success" else true end)
        ' <<< "$RESULTS"
