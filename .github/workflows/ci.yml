name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject tracked files that match gitignore
        shell: bash
        run: |
          ignored_tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$ignored_tracked" ]]; then
            echo "::error::Tracked files must not also match .gitignore:"
            printf '%s\n' "$ignored_tracked"
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux, macOS, and Windows are all first-class platforms — clippy and test
  # run on each, no "primary" OS. The daemon control surface in particular has
  # platform-specific code (Unix domain socket vs Windows named pipe, SIGHUP /
  # SIGTERM vs ctrl_c, kill vs taskkill) and the matrix catches a regression in
  # any one of them at PR time.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The write grants exist for the live-stream diagnostic in the Linux test
    # step: the runner dies too abruptly to upload logs, so the step streams
    # its own output into a PR comment while the machine is still alive.
    # Commenting on a PR via the issues endpoint requires pull-requests:write
    # (issues:write alone 403s — measured on run 31626912063).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # This is the only job in the workspace that *links* — clippy, doc, msrv
    # and dist all stop at metadata — and it is the one job that has been
    # dying on ubuntu whenever it runs cold. What is actually known, after
    # nine dead runs (each annotated "The hosted runner lost communication
    # with the server"):
    #
    #   - Warm runs pass in 2-3 minutes on every OS. Only a *cold* ubuntu
    #     build has ever died, and it has died every single time.
    #   - The runner goes deaf UNDER 25 MINUTES into the cold build (an
    #     in-step `timeout 25m` never fired on run 31616659931; a job-level
    #     30m cancellation was never processed on run 31594067605). The
    #     ~48-minute failure timestamps are GitHub's detection lag, not the
    #     moment of death.
    #   - Nothing inside the VM moved that death: +25 GB disk (31601397839),
    #     +8 GB swap (31611661569), lld, and reduced debuginfo all left the
    #     timeline byte-identical. Every run died with post steps skipped,
    #     so nothing was ever cached and no logs were ever uploaded.
    #
    # Hence the shape of this job: never require any single cargo process to
    # survive longer than 15 minutes, and bank progress with an explicit
    # cache save after every bounded chunk — inside the job, before the
    # wedge window, not in a post step that a dead runner will never run. A
    # cold build then converges across attempts no matter what the killer
    # turns out to be: each attempt restores the previous attempt's chunks
    # and reaches strictly further. `timeout-minutes` stays only as an outer
    # backstop; a cancelled job skips its post steps (measured, 31594067605),
    # so nothing below relies on it.
    timeout-minutes: 75
    env:
      # Headroom for the cold build. A cold `--workspace --all-features` test
      # build is ~9.1 GB of `target/` (measured on macOS/arm64);
      # `line-tables-only` takes that to ~7.2 GB with all 2496 tests still
      # enumerating identically, and keeps `file:line` in test backtraces —
      # the part anyone reads.
      #
      # Expect a larger saving on Linux than that macOS figure suggests, since
      # Linux embeds DWARF in each of the ~25 test binaries while macOS leaves
      # it in the `.o` files and Windows in separate `.pdb`s.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      # Ruled-out-but-kept: +25 GB disk and +8 GB swap each failed to move
      # the cold-build death by a second (runs 31601397839, 31611661569), so
      # neither is the fix — but both are cheap, harmless headroom and
      # removing them would re-add untested variables. lld likewise: not the
      # fix, kept because it makes the bounded chunks below cover more build
      # per 15 minutes.
      - name: reclaim disk, extend swap
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
          command -v ld.lld || sudo apt-get install -y --no-install-recommends lld
      # rust-cache saves in a POST step, and nine dead runners have proven a
      # post step is exactly where this job's cache save must not live. On
      # Linux the explicit restore/save steps below replace it; macOS and
      # Windows keep it, since their runners end cleanly.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: ${{ matrix.os != 'ubuntu-latest' }}
      - uses: taiki-e/install-action@nextest
      - name: restore build cache
        id: restore
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seed-test-linux-${{ hashFiles('Cargo.lock') }}-final
          restore-keys: |
            seed-test-linux-${{ hashFiles('Cargo.lock') }}-
            seed-test-linux-
      # ── bounded build chunks ──
      # Each chunk gives cargo at most 15 minutes — safely inside the <25m
      # window the runner is known to survive — and exits 124 on the bound.
      # An explicit save banks whatever that chunk compiled BEFORE the next
      # chunk risks the machine. Exit codes other than 0/124 are real build
      # errors and fail the job honestly. RUSTFLAGS restates -D warnings
      # because a step-level env overrides the job-level value
      # setup-rust-toolchain sets; it must be identical across every cargo
      # invocation here or the chunks would rebuild instead of resuming.
      - name: build (chunk 1)
        id: b1
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
        run: |
          ( while true; do
              { date -u +%T; free -m | sed -n '2,3p'; df -h / | tail -1; } \
                >> "$RUNNER_TEMP/resources.log"
              sleep 30
            done ) &
          rc=0
          timeout --signal=INT --kill-after=60s 15m \
            cargo build --workspace --all-features --tests || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { [ "$rc" = 0 ] || [ "$rc" = 124 ]; }
      - name: bank chunk 1
        if: runner.os == 'Linux' && steps.b1.outputs.rc == '124'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seed-test-linux-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-c1
      - name: build (chunk 2)
        id: b2
        if: runner.os == 'Linux' && steps.b1.outputs.rc == '124'
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
        run: |
          rc=0
          timeout --signal=INT --kill-after=60s 15m \
            cargo build --workspace --all-features --tests || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { [ "$rc" = 0 ] || [ "$rc" = 124 ]; }
      - name: bank chunk 2
        if: runner.os == 'Linux' && steps.b2.outputs.rc == '124'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seed-test-linux-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-c2
      - name: build (chunk 3)
        id: b3
        if: runner.os == 'Linux' && steps.b2.outputs.rc == '124'
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
        run: |
          rc=0
          timeout --signal=INT --kill-after=60s 15m \
            cargo build --workspace --all-features --tests || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { [ "$rc" = 0 ] || [ "$rc" = 124 ]; }
      - name: bank chunk 3
        if: runner.os == 'Linux' && steps.b3.outputs.rc == '124'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seed-test-linux-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-c3
      # Bank the COMPLETED build before any test runs. Run 31621627135 is
      # why this sits here and not at the end of the job: the cold build
      # finished in 4m01s (the build was never the killer), the machine then
      # went deaf during the test phase, and the completed build was lost
      # because the save was ordered after the tests. Tests must never be
      # able to destroy a finished build again.
      - name: save build cache
        if: >-
          runner.os == 'Linux' &&
          (steps.b1.outputs.rc == '0' || steps.b2.outputs.rc == '0' || steps.b3.outputs.rc == '0')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seed-test-linux-${{ hashFiles('Cargo.lock') }}-final
      # Tests only run against a completed build; the RUSTFLAGS match makes
      # nextest reuse the chunks' artifacts instead of rebuilding.
      #
      # The machine dies DURING THE TEST PHASE (established by run
      # 31621627135: cold build done in 4m01s, wedge afterwards), and it dies
      # too abruptly for logs, artifacts, or post steps — so the step streams
      # its own output somewhere the death cannot reach: a PR comment,
      # PATCHed in place every 20s while the machine is alive. When the
      # runner goes deaf, the last update names the tests that were running.
      #
      # The stream arms ONLY when the exact-key cache restore missed — the
      # cold-ish runs, which are the only runs that have ever died (warm runs
      # finish the whole test phase inside the first ~5 minutes after boot,
      # which every historically-green ubuntu job also did). Warm runs stay
      # comment-free. Push-triggered runs (no PR number) skip the stream too.
      # This diagnostic comes out once the wedging test is found and fixed.
      - name: test
        if: >-
          runner.os == 'Linux' &&
          (steps.b1.outputs.rc == '0' || steps.b2.outputs.rc == '0' || steps.b3.outputs.rc == '0')
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          NO_COLOR: "1"
          CARGO_TERM_COLOR: never
        run: |
          LOG="$RUNNER_TEMP/nextest.log"
          : > "$LOG"
          if [ -n "$PR_NUMBER" ] && [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            HDR="🔬 live \`test (ubuntu-latest)\` stream — run ${{ github.run_id }} attempt ${{ github.run_attempt }} — auto-updated in place"
            CID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$HDR" --jq .id || true)
            if [ -n "$CID" ]; then
              ( while true; do
                  { printf '%s — %s UTC\n\n```\n' "$HDR" "$(date -u +%T)"
                    tail -c 55000 "$LOG"
                    printf '\n```\n'
                  } > "$RUNNER_TEMP/body.txt"
                  gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$CID" \
                    -F body=@"$RUNNER_TEMP/body.txt" >/dev/null 2>&1 || true
                  sleep 20
                done ) &
            fi
          fi
          set -o pipefail
          timeout --signal=INT --kill-after=60s 15m \
            cargo nextest run --workspace --all-features 2>&1 | tee "$LOG"
      # A checkpointed-but-unfinished cold build must fail the job — tests
      # did not run — but it fails having banked up to 45 minutes of build,
      # so re-running this job resumes instead of starting over.
      - name: cold build checkpointed, not finished
        if: runner.os == 'Linux' && steps.b3.outputs.rc == '124'
        run: |
          echo "::warning::cold build exceeded 3x15m chunks; progress is cached — re-run this job to continue"
          exit 1
      # macOS and Windows restore a cache and finish in minutes. They have
      # never been in the failing state, so they run unwrapped — and
      # `timeout` is coreutils anyway, not a pwsh builtin with the same name.
      - name: test
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --all-features
      # Runs on the failure path: if this job dies on capacity again, these
      # are the numbers that say so instead of leaving it to inference.
      - name: resources
        if: always() && runner.os == 'Linux'
        run: |
          df -h /
          free -h
          sudo dmesg | tail -n 40 || true
          tail -n 240 "$RUNNER_TEMP/resources.log" || true

  feature-isolation:
    name: feature-isolation
    runs-on: ubuntu-latest
    # The SDK's default dependency tree is a shipped promise: a consumer that
    # wants pure routing must not pay for the axum HTTP server or the whole
    # OpenTelemetry stack. Every capability that pulls weight sits behind a
    # default-off feature, and each feature must build on its own.
    #
    # `cargo tree` is the tool here, and it mishandles a bad name in *two*
    # different ways depending on which flag carries it. Both make a typo (or a
    # crate rename) pass silently, so both need a guard:
    #
    #   1. `-i <pkg>` — exits 101 both when the package is absent from the
    #      selected tree AND when the name matches no package at all, with a
    #      byte-identical message. Guard: every negative assertion below is
    #      preceded by a positive one proving the name resolves somewhere.
    #
    #   2. `-p <crate>` — the sharper one. An unknown package spec is silently
    #      ignored and `cargo tree` falls back to the **whole workspace**
    #      default tree: `cargo tree -p bitrouter-guardrailz -e normal -i axum`
    #      exits **0**, prints a full workspace-wide inverted tree, and writes
    #      nothing to stderr. Because it both succeeds and produces output,
    #      exit status alone cannot catch it — the `-i` guard above is no help
    #      here. In the crate loop below, a typo'd or renamed crate therefore
    #      stops asserting anything about that crate and silently asserts about
    #      the workspace instead. Today both `axum` and `opentelemetry` are in
    #      the workspace default tree (apps/bitrouter enables `otel-http`
    #      unconditionally), so the failure is a *misleading* one: the job
    #      blames a crate that does not exist for a dependency it never had.
    #      Drop either from the workspace default tree and the same typo flips
    #      to the opposite failure — a negative assertion that passes forever
    #      without checking anything. Guard: assert workspace membership via
    #      `cargo metadata` before using a name in `-p`.
    #
    # Literal `-p bitrouter-sdk` uses are covered already: the `cargo check -p`
    # steps above exit 101 on an unknown package spec (unlike `cargo tree`).
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check -p bitrouter-sdk --no-default-features
      - run: cargo check -p bitrouter-sdk --no-default-features --features config_file
      - run: cargo check -p bitrouter-guardrails
      - run: cargo check -p bitrouter-sdk --no-default-features --features otel-http
      - run: cargo check -p bitrouter-sdk --no-default-features --features otel-grpc
      - run: cargo check -p bitrouter-sdk --no-default-features --features otel,server
      - name: SDK default tree stays lean
        run: |
          for pkg in opentelemetry opentelemetry_sdk opentelemetry-otlp \
                     tracing-opentelemetry tracing-subscriber tonic dashmap axum; do
            if ! cargo tree -p bitrouter-sdk --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-sdk --no-default-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg is in bitrouter-sdk's default tree"; exit 1
            fi
          done
      - name: transports stay isolated
        run: |
          for pkg in tonic axum; do
            if ! cargo tree -p bitrouter-sdk --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
            if cargo tree -p bitrouter-sdk --no-default-features --features otel-http -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg leaked into the otel-http tree"; exit 1
            fi
          done
      - name: consumers stay lean
        run: |
          for pkg in axum opentelemetry; do
            if ! cargo tree -p bitrouter-sdk --all-features -e normal -i "$pkg" >/dev/null 2>&1; then
              echo "::error::$pkg resolves in no tree at all — misspelled in this list?"; exit 1
            fi
          done
          for crate in bitrouter-guardrails bitrouter-cloud-sdk bitrouter-providers dist-helper; do
            # `cargo tree -p` ignores an unknown spec and exits 0 (see the job
            # comment), so prove membership before trusting anything below.
            if ! cargo metadata --no-deps --format-version 1 \
                 | jq -e --arg c "$crate" '.packages[] | select(.name == $c)' >/dev/null; then
              echo "::error::unknown workspace crate: $crate"; exit 1
            fi
            for pkg in axum opentelemetry; do
              if cargo tree -p "$crate" -e normal -i "$pkg" >/dev/null 2>&1; then
                echo "::error::$crate must not depend on $pkg by default"; exit 1
              fi
            done
          done
      - name: "the OTel core without a transport is a compile error"
        run: |
          if out=$(cargo check -p bitrouter-sdk --features __otel-core --message-format=short 2>&1); then
            echo "::error::expected the transport-less build to fail"; printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'the OpenTelemetry stack needs a transport' || {
            echo "::error::failed, but not with the transport compile_error"; printf '%s\n' "$out"; exit 1; }

  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    # The SDK exports OTLP without making the OpenTelemetry version part of its
    # own semver contract. That only holds while the hard constraint holds:
    #
    #   No `opentelemetry*` or `tracing_opentelemetry` type may appear in any
    #   public `bitrouter-sdk` signature.
    #
    # "Signature" is broader than function returns — public struct fields, enum
    # variant payloads, trait method signatures, generic bounds, associated
    # types, type aliases, and re-exports all count. `cargo public-api` prints
    # one fully-qualified line per public item with rustdoc's own resolution
    # already applied, so all of those collapse into the same grep.
    #
    # `--simplified` omits blanket impls. That is load-bearing, not cosmetic:
    # `opentelemetry` has `impl<T> FutureExt for T`, which rustdoc attaches to
    # every documented type in the crate. Without the flag the listing carries
    # hundreds of `impl<T> opentelemetry::context::future_ext::FutureExt for
    # <every SDK type>` lines that this crate never authored, and the gate
    # below would be permanently red. The flag drops them structurally — no
    # allow-list, so a real `opentelemetry` leak still cannot hide behind one.
    #
    # The same listing feeds a committed manifest of the foreign crates the
    # public API reaches. A guard that only greps cannot see *unintended*
    # public API growth, which is how a public foreign type gets added in the
    # first place; the manifest makes that specific change show up in review
    # as a one-line diff.
    #
    # Linux-only on purpose: the SDK has `#[cfg(unix)]` items, so a Windows
    # runner would produce a different (correct, but non-matching) listing.
    # This is not folded into `feature-isolation` — that job is stable-only,
    # and rustdoc JSON needs nightly.
    steps:
      - uses: actions/checkout@v6
      - name: read the pins
        id: pin
        shell: bash
        run: |
          # Single source of truth: the pins live beside the baseline they
          # describe, so a human regenerating locally uses the same versions
          # this job runs on. Both are load-bearing — rustdoc's JSON format and
          # `cargo public-api`'s rendering each change across releases, and
          # either would rewrite the whole baseline.
          pins=crates/bitrouter-sdk/public-api.pins
          for key in toolchain tool; do
            value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
            if [[ -z "$value" ]]; then
              echo "::error::$pins has no '$key=' line"; exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This step exists only to build the helper binary below; the nightly
          # step is the one whose cache is worth keeping.
          cache: false
      # Built on stable. It shells out to `cargo rustdoc` itself and picks the
      # toolchain up from the `+<pin>` on the invocation further down.
      - name: install the pinned cargo-public-api
        run: cargo install --locked "${{ steps.pin.outputs.tool }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: render the SDK's public API
        shell: bash
        run: |
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p bitrouter-sdk --all-features --simplified > "$RUNNER_TEMP/public-api.txt"
      - name: the listing is real
        shell: bash
        run: |
          # The gates below are negative assertions over this one file, and an
          # empty or otel-less listing would satisfy every one of them
          # vacuously — exactly the silent pass this job exists to prevent.
          # Prove the surface under test is in the listing before trusting
          # anything the listing does not say.
          for sentinel in \
            'pub mod bitrouter_sdk::otel' \
            'pub fn bitrouter_sdk::otel::subscriber::tracing_subscriber_layer'; do
            if ! grep -qF "$sentinel" "$RUNNER_TEMP/public-api.txt"; then
              echo "::error::'$sentinel' is missing — did --all-features stop enabling otel?"
              exit 1
            fi
          done
      - name: no opentelemetry type in the SDK's public API
        shell: bash
        run: |
          # Case-insensitive so it catches both the module paths
          # (`opentelemetry_sdk::…`, `tracing_opentelemetry::…`) and the type
          # names (`OpenTelemetryLayer`). `tracing_opentelemetry` contains
          # `opentelemetry`, so one pattern covers both crates.
          if hits="$(grep -niE 'opentelemetry' "$RUNNER_TEMP/public-api.txt")"; then
            echo "::error::opentelemetry types leaked into bitrouter-sdk's public API — see docs/OTEL_SDK_MIGRATION_SPEC.md 'Hard constraint'"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: no re-export of an OTel type out of the SDK
        shell: bash
        run: |
          # The one thing the listing grep above cannot see. `cargo public-api`
          # renders a bare re-export under its *local* path — re-exporting
          # `opentelemetry_sdk::trace::SdkTracer` from `otel` prints
          # `pub use bitrouter_sdk::otel::SdkTracer`, with the origin crate
          # nowhere in the line. Types whose *name* carries "OpenTelemetry"
          # (e.g. `OpenTelemetrySpanExt`) do trip the grep; neutrally-named
          # ones do not. The baseline gate still catches the added line, but it
          # would not say why the line matters — so pin it at the source.
          #
          # Verbatim `pub use` only: `pub(crate) use` is not public API, and a
          # re-export laundered through a local alias is out of reach of any
          # lexical check. That residual is the baseline gate's job.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]+(::)?(opentelemetry|tracing_opentelemetry)' crates/bitrouter-sdk/src/)"; then
            echo "::error::bitrouter-sdk re-exports an OpenTelemetry type — see docs/OTEL_SDK_MIGRATION_SPEC.md 'Hard constraint'"
            printf '%s\n' "$hits"
            exit 1
          fi
      # Gates 1-3 above answer "is an OTel type public?". This one answers the
      # broader question a grep structurally cannot: "did the SDK gain a public
      # dependency nobody noticed?" That is not hypothetical — `tracing_core`
      # became public surface here via a generic bound, and no `opentelemetry`
      # grep would ever have seen it.
      #
      # We track the foreign-crate *set*, not the full item listing. The full
      # listing is ~8.5k lines of which ~22% is auto-derived marker impls
      # (`Sync`/`Unpin`/`RefUnwindSafe`/…), so adding one public struct writes
      # six lines of noise into review and the real signal drowns. The set
      # changes on exactly the semver-relevant event and is silent otherwise.
      - name: the SDK's public dependency surface is unchanged
        shell: bash
        run: |
          # Path roots only: the regex is greedy from the word boundary, so
          # `bitrouter_sdk::otel::OtelExporter` yields `bitrouter_sdk`, not
          # `otel`. Generic params (`S`, `T`) start uppercase and never match.
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$RUNNER_TEMP/public-api.txt" \
            | cut -d: -f1 | sort -u \
            | grep -vxE 'bitrouter_sdk|core|std|alloc' > "$RUNNER_TEMP/public-api-deps.txt"
          if ! diff -u \
            <(grep -v '^#' crates/bitrouter-sdk/public-api-deps.txt) \
            "$RUNNER_TEMP/public-api-deps.txt"
          then
            echo "::error::bitrouter-sdk's public dependency surface changed. A '+' line means an upstream breaking release in that crate now becomes a BitRouter breaking release — confirm that is intended, then update crates/bitrouter-sdk/public-api-deps.txt (regeneration command in crates/bitrouter-sdk/public-api.pins)."
            exit 1
          fi

  dist:
    name: dist
    runs-on: ubuntu-latest
    # Guards generated distribution artifacts: the committed config schema and
    # registry dist JSON must match the Rust source/YAML data, and deprecated
    # YAML parsers must stay out of the graph.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: generated dist is up to date
        run: cargo run -p dist-helper -- check
      - name: no deprecated/unsound yaml parser in the graph
        run: |
          for crate in serde_yaml serde_yml; do
            if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
              echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
              cargo tree -i "$crate"
              exit 1
            fi
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93"
      - run: cargo check --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    # Build rustdoc for the whole workspace under -D warnings: any broken
    # intra-doc link or missing-docs warning becomes a CI failure. Matches
    # what docs.rs will run.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --workspace --all-features --no-deps

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    # Compile and run every ``` example in rustdoc comments. The plain
    # `test` job uses nextest, which does not execute doctests, so they
    # need their own pass.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --doc --workspace --all-features

  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    # Validate the agent-plugin manifests (.claude-plugin/, .codex-plugin/)
    # against the real loaders. Two gates:
    #   1. Claude Code has a purpose-built validator — run it strict.
    #   2. Codex has NO validator and its loader warn-and-ignores broken
    #      manifests (a typo silently drops a component), so we exercise
    #      the real install path in an isolated CODEX_HOME and
    #      presence-assert the plugin actually loaded.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: codex loader exercise (presence-asserted)
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add "$PWD"
          codex plugin add bitrouter@bitrouter
          codex plugin list --json | tee /tmp/codex-plugins.json
          jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
