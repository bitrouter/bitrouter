name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  packaged-gateway:
    uses: ./.github/workflows/gateway-artifacts.yml
    with:
      plan: '{"releases":[{"app_name":"bitrouter"}]}'
      cargo-profile: dev

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject tracked files that match gitignore
        shell: bash
        run: |
          ignored_tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$ignored_tracked" ]]; then
            echo "::error::Tracked files must not also match .gitignore:"
            printf '%s\n' "$ignored_tracked"
            exit 1
          fi

      - name: reject standalone Python files
        shell: bash
        run: |
          python_files="$(git ls-files -- '*.py' '*.pyi' '*.pyw' '*.pyc')"
          if [[ -n "$python_files" ]]; then
            echo "::error::Use Rust for executable source and test fixtures:"
            printf '%s\n' "$python_files"
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux, macOS, and Windows are all first-class platforms — clippy and test
  # run on each, no "primary" OS. The daemon control surface in particular has
  # platform-specific code (Unix domain socket vs Windows named pipe, SIGHUP /
  # SIGTERM vs ctrl_c, kill vs taskkill) and the matrix catches a regression in
  # any one of them at PR time.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Rust 1.99 reports double_must_use inside async-trait expansions.
          # Keep strict linting on the verified compiler until the upstream
          # macro false-positive fix ships: rust-lang/rust-clippy#17529.
          toolchain: "1.97.0"
          components: clippy
      - run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            retries: "0"
          - os: windows-latest
            # Windows also exposes the trajectory timestamp race under load.
            retries: "2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --all-features
          --no-fail-fast
          --retries "${{ matrix.retries }}"

  # A cold all-features build used to compile and link every large application
  # test target on one runner. Split by Cargo target so each runner has bounded
  # late-stage link pressure while preserving the original Linux test surface.
  test-ubuntu-workspace:
    name: test (ubuntu-latest, workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace --exclude bitrouter --all-features
          --build-jobs 2

  test-ubuntu-bitrouter:
    name: test (ubuntu-latest, bitrouter ${{ matrix.target }})
    needs: test-ubuntu-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lib
            build_jobs: "2"
            flags: --lib
          - target: bin
            build_jobs: "1"
            flags: --bin bro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: add swap for the lib test harness
        if: matrix.target == 'lib'
        run: |
          sudo fallocate --length 8G /swapfile-bitrouter
          sudo chmod 600 /swapfile-bitrouter
          sudo mkswap /swapfile-bitrouter
          sudo swapon /swapfile-bitrouter
          free -h
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: false
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - env:
          TEST_BUILD_JOBS: ${{ matrix.build_jobs }}
          TEST_TARGET_FLAGS: ${{ matrix.flags }}
        shell: bash
        run: |
          read -r -a target_flags <<< "$TEST_TARGET_FLAGS"
          cargo nextest run -p bitrouter --all-features \
            --build-jobs "$TEST_BUILD_JOBS" \
            "${target_flags[@]}"

  test-ubuntu-integration:
    name: test (ubuntu-latest, bitrouter integration ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: interfaces
            retries: "0"
            targets: >-
              --test acp --test acp_checkpoints --test native_acp --test cloud_api --test daemon --test e2e
              --test full_stack --test configuration_state --test extension_host --test subscription --test feature_ingress --test database_backends --test database_capture
              --test router_continuation --test router_migration_cli --test request_checks --test guardrails_migration --test harness_sdk --test artifact_build_metadata
          - shard: gateway
            retries: "0"
            targets: >-
              --test gateway_anthropic_authority --test gateway_decision_model
              --test gateway_decisions --test gateway_model_boundary
              --test gateway_routing_assessment --test gateway_routing_plan
          - shard: models
            retries: "0"
            targets: >-
              --test model_projection_attributes
              --test model_ingress_admission
              --test model_explicit_login
              --test model_decisions
              --test model_responses_reasoning
              --test model_file_store
              --test model_admitted_conversions
              --test model_hosted
              --test model_auth
              --test model_retirement
              --test model_content_boundaries
              --test model_invocation
              --test model_hosted_login
              --test model_anthropic
              --test model_providers
              --test model_google_chat
              --test model_projection_admission
          - shard: observability
            retries: "0"
            targets: >-
              --test agent_trace_generalization --test observe_hierarchy
              --test workflow_state_real_agent_e2e
              --test workflow_state_replay --test gateway_workflow --test telemetry_ingress_log_target --test source_boundaries
          - shard: core-scheduling
            retries: "0"
            targets: --test core_contract --test core_execution
          - shard: terminal
            retries: "0"
            targets: --test code_tui_pty --test native_agent_tui
          - shard: optimization
            retries: "0"
            targets: >-
              --test eval_exchange_equivalence --test optimization_output
              --test policy_eval_control_plane
          - shard: control-plane
            # Trajectory assertions occasionally observe async event timestamps
            # out of order; retry the isolated test process before failing CI.
            retries: "2"
            targets: >-
              --test managed_native --test onboarding --test smithers_reward_loop
              --test terminus_2_workflow_state
              --test trajectory_progress_control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ubuntu-bitrouter-tests-v1
          cache-save-if: ${{ matrix.shard == 'interfaces' }}
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - name: run integration shard
        shell: bash
        env:
          TEST_RETRIES: ${{ matrix.retries }}
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a test_targets <<< "$TEST_TARGETS"
          cargo nextest run -p bitrouter --all-features --build-jobs 2 \
            --retries "$TEST_RETRIES" \
            "${test_targets[@]}"

  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
      - test-ubuntu-workspace
      - test-ubuntu-bitrouter
      - test-ubuntu-integration
    runs-on: ubuntu-latest
    env:
      WORKSPACE_RESULT: ${{ needs.test-ubuntu-workspace.result }}
      BITROUTER_RESULT: ${{ needs.test-ubuntu-bitrouter.result }}
      INTEGRATION_RESULT: ${{ needs.test-ubuntu-integration.result }}
    steps:
      - name: require every ubuntu test shard
        shell: bash
        run: |
          for result in \
            "$WORKSPACE_RESULT" \
            "$BITROUTER_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Ubuntu test shard finished with: $result"
              exit 1
            fi
          done

  feature-isolation:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: verify final workspace membership
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e '
            [.packages[].name] | sort ==
            ["bitrouter", "bitrouter-ai", "bitrouter-guardrails", "bitrouter-sdk", "dist-helper"]'
      - name: contracts and client build independently
        run: |
          cargo test -p bitrouter-ai
          cargo test -p bitrouter-ai --all-features
          cargo test -p bitrouter-sdk
          cargo test -p bitrouter-sdk --all-features
          cargo test -p bitrouter-guardrails --all-features
      - name: inspect isolated production dependency closures
        shell: bash
        run: |
          # Successful checks above prove package membership. Inspect forward
          # trees: an unknown inverted dependency must not count as evidence.
          for flags in '' '--all-features'; do
            cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
            if grep -Eq '^(bitrouter(-sdk)?|reqwest|tokio(-[^ ]*)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
              echo '::error::AI public contracts pulled runtime dependencies'; exit 1
            fi
            cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
            if grep -Eq '^(bitrouter|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
              echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
            fi
          done
          cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
          if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
            echo '::error::matcher depends on its host implementation'; exit 1
          fi
          cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
          if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
            echo '::error::default bro links the optional matcher'; exit 1
          fi

  application-features:
    name: application-features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ''
          - core
          - harness
          - tui
          - core,harness
          - core,tui
          - mcp
          - server-tools
          - guardrails
          - otel-http
          - otel-grpc
          - otel-http,otel-grpc
          - harness,otel-http
          - db-postgres
          - db-mysql
          - mcp,server-tools,otel-http,db-postgres,db-mysql
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build selected profile without workspace feature unification
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: |
          cargo check -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --all-targets
          cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
          case ",$PROFILE_FEATURES," in
            *,tui,*) ;;
            *) if grep -Eq '^(ratatui(-[^ ]*)?|crossterm) v' profile-tree.txt; then
                 echo '::error::headless profile pulled terminal dependencies'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,harness,*|*,tui,*) ;;
            *) if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
                 echo '::error::profile without harness pulled ACP runtime'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,harness,*|*,tui,*) ;;
            *) if grep -Eq '^jsonschema v' profile-tree.txt; then
                 echo '::error::profile without harness pulled result validation'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,mcp,*|*,server-tools,*|*,harness,*|*,tui,*) ;;
            *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
                 echo '::error::profile without MCP pulled its transport runtime'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,otel-http,*|*,otel-grpc,*) ;;
            *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
                 echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,otel-grpc,*) ;;
            *) if grep -Eq '^tonic v' profile-tree.txt; then
                 echo '::error::profile without gRPC pulled tonic'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,db-postgres,*) ;;
            *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
                 echo '::error::profile without PostgreSQL pulled its driver'; exit 1
               fi ;;
          esac
          case ",$PROFILE_FEATURES," in
            *,db-mysql,*) ;;
            *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
                 echo '::error::profile without MySQL pulled its driver'; exit 1
               fi ;;
          esac

      - name: verify gateway behavior without learning services
        if: matrix.features == '' || matrix.features == 'harness'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: >-
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --test core_disabled --test trajectory_progress_control --test gateway_workflow --test feature_ingress

      - name: verify noninteractive setup and source boundaries
        if: matrix.features == '' || matrix.features == 'harness' || matrix.features == 'core,harness'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: >-
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --test onboarding --test source_boundaries

      - name: verify unavailable telemetry before startup side effects
        if: matrix.features == '' || matrix.features == 'harness' || matrix.features == 'tui'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: >-
          cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --test telemetry_disabled --jobs 2 -- --test-threads=2

      - uses: taiki-e/install-action@nextest
        if: matrix.features == '' || matrix.features == 'core' || matrix.features == 'harness' || matrix.features == 'core,harness'

      - name: verify base contracts without harness
        if: matrix.features == ''
        run: >-
          cargo nextest run -p bitrouter --no-default-features
          --lib --bin bro --build-jobs 2 --test-threads 2
          -E 'test(client::agent_local::) | test(providers::cli_install::) | test(skills::) | test(skills_init_tests) | test(config::yaml::) | test(daemon::tests::opaque_session) | binary(bro)'

      - name: verify stored history without live capture
        if: matrix.features == '' || matrix.features == 'core'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: >-
          cargo nextest run -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --lib --test acp_checkpoints --test daemon --build-jobs 2 --test-threads 2
          -E 'test(acp_trajectory::) | test(storage::acp_history::) | test(gateway::routing::blocks::) | test(core::evolution::) | binary(acp_checkpoints) | binary(daemon)'

      - name: verify headless ACP, capture and shared transcript behavior
        if: matrix.features == 'harness' || matrix.features == 'core,harness'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: >-
          cargo nextest run -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --lib --test acp --test database_capture --build-jobs 2 --test-threads 2
          -E 'test(presentation::) | test(output::plain::) | test(text_presenter_tests) | test(agent_sessions::) | test(agent_api::) | test(commands::tests::) | test(onboarding::tests::) | test(acp_trajectory::live_tests::) | test(acp_trajectory::checkpoint::tests::live::) | test(harness::resources::mcp::) | test(harness::service::core_disabled_tests::) | test(harness::service::recovery::tests::baseline_) | test(harness::agent::native::replay_tests::) | test(harness::acp::native::core_disabled_tests::) | test(harness::permission::) | test(harness::local::) | test(harness::result_contract::) | binary(acp) | binary(database_capture)'

      - name: verify scheduler acknowledgements and recovery without harness
        if: matrix.features == 'core'
        run: >-
          cargo nextest run --locked -p bitrouter --no-default-features --features core
          --test core_contract --test core_execution --build-jobs 2 --test-threads 2

      - name: verify execution SDK against the headless service
        if: matrix.features == 'core,harness'
        run: >-
          cargo test -p bitrouter --no-default-features --features core,harness
          --test harness_sdk --jobs 2

      - name: verify database feature availability
        if: matrix.features == 'db-postgres' || matrix.features == 'db-mysql'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test feature_ingress

      - name: verify optional server tools
        if: matrix.features == 'server-tools' || matrix.features == 'mcp'
        env:
          PROFILE_FEATURES: ${{ matrix.features }}
        run: |
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test feature_ingress
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib server_tool

      - name: verify MCP discovery and process cleanup without harness
        if: matrix.features == 'mcp'
        run: >-
          cargo test -p bitrouter --no-default-features --features mcp
          --test harness_mcp_check --jobs 2 -- --test-threads=2

  artifact-profiles:
    name: artifact profiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: preserve full and minimum executables from the same revision
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/profile-full" "$RUNNER_TEMP/profile-gateway"
          cargo build --locked -p bitrouter --bin bro --jobs 2
          cp target/debug/bro "$RUNNER_TEMP/profile-full/bro"
          cargo build --locked -p bitrouter --no-default-features --bin bro --jobs 2
          cp target/debug/bro "$RUNNER_TEMP/profile-gateway/bro"
      - name: verify real daemon profile transitions and artifact metadata
        shell: bash
        env:
          BITROUTER_TEST_FULL_BINARY: ${{ runner.temp }}/profile-full/bro
          BITROUTER_TEST_GATEWAY_BINARY: ${{ runner.temp }}/profile-gateway/bro
        run: |
          cargo test --locked -p bitrouter --no-default-features --jobs 2 --test artifact_build_metadata
          cargo test --locked -p bitrouter --no-default-features --jobs 2 --test artifact_profiles -- --ignored --exact artifact_profiles_preserve_residents_and_gate_explicit_replacement

  database-backends:
    name: database (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            image: postgres:17
            port: 5432
            feature: db-postgres
            url: postgres://fixture:fixture-password@127.0.0.1:5432/bitrouter_test
            healthcheck: pg_isready -U fixture -d bitrouter_test
          - backend: mysql
            image: mysql:8.4
            port: 3306
            feature: db-mysql
            url: mysql://fixture:fixture-password@127.0.0.1:3306/bitrouter_test
            healthcheck: mysql --host=127.0.0.1 --user=fixture --password=fixture-password --database=bitrouter_test --execute='SELECT 1'
    services:
      database:
        image: ${{ matrix.image }}
        env:
          # Each official image consumes its own initialization variables.
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: bitrouter_test
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fixture-password
          MYSQL_DATABASE: bitrouter_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.healthcheck }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: exercise migrations and gateway persistence on the selected backend
        env:
          BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
          PROFILE_FEATURES: ${{ matrix.feature }}
        run: >-
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES"
          --test database_backends -- --include-ignored --test-threads=1

      - name: exercise retained core and capture records on the selected backend
        env:
          BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
          PROFILE_FEATURES: ${{ matrix.feature }}
        run: >-
          cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES,core,harness"
          --test database_backends --test database_capture -- --include-ignored --test-threads=1

      - name: verify MySQL transaction snapshot boundaries
        if: matrix.backend == 'mysql'
        env:
          BITROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
        run: |
          cargo test -p bitrouter --no-default-features --features db-mysql \
          --lib mysql_tests -- --ignored --test-threads=1
          cargo test -p bitrouter --no-default-features --features db-mysql,core,harness \
          --lib mysql_tests -- --ignored --test-threads=1

  telemetry-transports:
    name: telemetry (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: otel-http
            targets: --test telemetry_ingress_log_target --test observe_hierarchy --test full_stack
          - transport: otel-grpc
            targets: --test telemetry_grpc_transport
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p bitrouter --no-default-features --features ${{ matrix.transport }} ${{ matrix.targets }}

  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    # Keep the check identity while covering both sides of the new client boundary.
    # Dependency trees are checked separately; these listings also inspect public
    # fields, bounds, associated types and signatures rather than only imports.
    steps:
      - uses: actions/checkout@v6
      - name: read the pins
        id: pin
        shell: bash
        run: |
          pins=crates/bitrouter-sdk/public-api.pins
          for key in toolchain tool; do
            value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
            if [[ -z "$value" ]]; then
              echo "::error::$pins has no '$key=' line"; exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: install the pinned cargo-public-api
        run: cargo install --locked "${{ steps.pin.outputs.tool }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: verify public contract and client surfaces
        shell: bash
        run: |
          for package in bitrouter-ai bitrouter-sdk; do
            listing="$RUNNER_TEMP/$package-public-api.txt"
            cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
              -p "$package" --all-features --simplified > "$listing"
            # --simplified excludes foreign blanket impls rustdoc attaches to
            # every type. Real authored fields and bounds remain in the listing.
            if [[ "$package" == bitrouter-ai ]]; then
              sentinels=(
                'pub struct bitrouter_ai::protocol::chat_completions::ChatRequest'
                'pub struct bitrouter_ai::gateway::ModelsResponse'
                'pub mod bitrouter_ai::extension'
                'pub struct bitrouter_ai::control::reload::ReloadInput'
                'pub struct bitrouter_ai::control::requests::RequestFilters'
                'pub struct bitrouter_ai::control::status::StatusReport'
                'pub enum bitrouter_ai::control::action::Action'
                'pub struct bitrouter_ai::control::error::ErrorEnvelope'
                'pub struct bitrouter_ai::eval::EvalSubject'
                'pub struct bitrouter_ai::eval::AdmissionOutcome'
                'pub struct bitrouter_ai::core::evidence::NativeAttemptReport'
                'pub enum bitrouter_ai::core::evidence::NativeTokenCost'
                'pub struct bitrouter_ai::core::protocol::ClientMessage'
                'pub enum bitrouter_ai::core::protocol::ServerMessage'
                'pub struct bitrouter_ai::core::protocol::ErrorEnvelope'
                'pub struct bitrouter_ai::core::checkpoint::CheckpointBatch'
              )
              forbidden='NativeExecutionControl|NativePrivateContextRuntime|CommitGate|VerifiedBatch|CheckpointBatchExt|HarnessManifestExt|ClientMessageExt|ToolResultLimitsExt|::capture_cache|::commitment\(|ToolResultOutput::(from_untyped_value|to_provider_string)|DataContent::(to_url|from_url)|Source::synthesize_id|GenerationParams::(extras_for_protocol|extra_value_for_protocol)|Prompt::required_capabilities|Limits::within|Capabilities::negotiate|bitrouter::|bitrouter_sdk::|reqwest::|tokio::|axum|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::'
            else
              sentinels=(
                'pub struct bitrouter_sdk::gateway::GatewayClient'
                'bitrouter_sdk::gateway::GatewayClient::chat_completions'
                'bitrouter_sdk::gateway::GatewayClient::stream_responses'
                'pub struct bitrouter_sdk::control::ControlClient'
                'bitrouter_sdk::control::ControlClient::reload'
                'bitrouter_sdk::control::ControlClient::operation'
                'bitrouter_sdk::gateway::GatewayClient::submit_eval_result'
                'bitrouter_sdk::gateway::GatewayClient::eval_snapshot'
                'bitrouter_sdk::gateway::GatewayClient::core_capabilities'
                'bitrouter_sdk::gateway::GatewayClient::core_channel'
                'pub struct bitrouter_sdk::core::CoreChannel'
                'pub struct bitrouter_sdk::core::CoreSender'
                'pub struct bitrouter_sdk::core::CoreReceiver'
              )
              forbidden='bitrouter::|axum|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::|tokio_tungstenite|tungstenite::'
            fi
            for sentinel in "${sentinels[@]}"; do
              if ! grep -qF "$sentinel" "$listing"; then
                echo "::error::$package public API listing is missing '$sentinel'"
                exit 1
              fi
            done
            if hits="$(grep -niE "$forbidden" "$listing")"; then
              echo "::error::runtime ownership leaked into $package's public API"
              printf '%s\n' "$hits"
              exit 1
            fi
            # A public re-export can hide its foreign origin in the listing.
            # Consumers import each contract from its owning public module.
            if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]' "crates/$package/src/")"; then
              echo "::error::$package contains a public forwarding export"
              printf '%s\n' "$hits"
              exit 1
            fi
            crate_name="${package//-/_}"
            grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$listing" \
              | cut -d: -f1 | sort -u \
              | grep -vxE "$crate_name|core|std|alloc" > "$RUNNER_TEMP/$package-public-api-deps.txt"
            diff -u \
              <(grep -v '^#' "crates/$package/public-api-deps.txt") \
              "$RUNNER_TEMP/$package-public-api-deps.txt"
          done

  dist:
    name: dist
    runs-on: ubuntu-latest
    # Guards generated distribution artifacts: the committed config schema and
    # registry dist JSON must match the Rust source/YAML data, and deprecated
    # YAML parsers must stay out of the graph.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: registry source is valid
        # Advisories (non-curated provider models, unpinned agent invocations,
        # agents with no conformance record) are expected and do not fail.
        run: cargo run -p dist-helper -- registry validate
      - name: generated dist is up to date
        run: cargo run -p dist-helper -- check
      - name: no deprecated/unsound yaml parser in the graph
        run: |
          for crate in serde_yaml serde_yml; do
            if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
              echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
              cargo tree -i "$crate"
              exit 1
            fi
          done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93"
      - run: cargo check --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    # Build rustdoc for the whole workspace under -D warnings: any broken
    # intra-doc link or missing-docs warning becomes a CI failure. Matches
    # what docs.rs will run.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --workspace --all-features --no-deps

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    # Compile and run every ``` example in rustdoc comments. The plain
    # `test` job uses nextest, which does not execute doctests, so they
    # need their own pass.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --doc --workspace --all-features

  agent-plugin:
    name: agent-plugin
    runs-on: ubuntu-latest
    # Validate the agent-plugin manifests (.claude-plugin/, .codex-plugin/)
    # against the real loaders. Two gates:
    #   1. Claude Code has a purpose-built validator — run it strict.
    #   2. Codex has NO validator and its loader warn-and-ignores broken
    #      manifests (a typo silently drops a component), so we exercise
    #      the real install path in an isolated CODEX_HOME and
    #      presence-assert the plugin actually loaded.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: codex loader exercise (presence-asserted)
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add "$PWD"
          codex plugin add bitrouter@bitrouter
          codex plugin list --json | tee /tmp/codex-plugins.json
          jq -e '.installed[] | select(.name == "bitrouter")' /tmp/codex-plugins.json
