    needs:
    - build-service-process
  application-features:
    name: feature compile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        cache-key: production-v1
    - name: Check isolated production feature closures
      shell: bash
      env:
        FEATURES: '["", "http2", "eval-publication", "mcp", "server-tools", "guardrails", "otel-http", "otel-grpc", "otel-http,otel-grpc",
          "db-postgres", "multi-instance", "multi-instance,http2", "db-mysql", "mcp,server-tools,otel-http,db-postgres,db-mysql"]'
      run: |
        while IFS= read -r PROFILE_FEATURES; do
        # Keep dev-dependencies out of the production feature closure.
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bitrouter
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
        # Only the minimal gateway distributions promise an h2-free
        # production closure. Other features (such as otel-grpc) may need h2.
        case "$PROFILE_FEATURES" in
          ''|multi-instance)
            if grep -Eq '^h2 v' profile-tree.txt; then
              echo '::error::minimal HTTP/1 gateway profile pulled h2'; exit 1
            fi ;;
        esac
        if grep -Eq '^(ratatui(-[^ ]*)?|crossterm) v' profile-tree.txt; then
               echo '::error::headless profile pulled terminal dependencies'; exit 1
        fi
        if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
          echo '::error::service feature pulled ACP'; exit 1
        fi
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" \
          -e normal,build -i jsonschema --depth 1 --prefix none > profile-schema-owners.txt
        if grep -Ev '^(jsonschema|bitrouter-registry) v' profile-schema-owners.txt; then
          echo '::error::unexpected service schema validator owner'; exit 1
        fi
        case ",$PROFILE_FEATURES," in
          *,mcp,*|*,server-tools,*) ;;
          *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
               echo '::error::profile without MCP pulled its transport runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-http,*|*,otel-grpc,*) ;;
          *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
               echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-grpc,*) ;;
          *) if grep -Eq '^tonic v' profile-tree.txt; then
               echo '::error::profile without gRPC pulled tonic'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-postgres,*|*,multi-instance,*) ;;
          *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
               echo '::error::profile without PostgreSQL pulled its driver'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-mysql,*) ;;
          *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
               echo '::error::profile without MySQL pulled its driver'; exit 1
             fi ;;
        esac

        done < <(jq -r '.[]' <<< "$FEATURES")
    timeout-minutes: 40
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  feature-isolation:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: verify final workspace membership
      run: |
        cargo metadata --locked --no-deps --format-version 1 | jq -e '
          (.workspace_members | length == 10) and (([.packages[].name] | sort) ==
          ["bitrouter", "bitrouter-ai", "bitrouter-bro", "bitrouter-build", "bitrouter-guardrails", "bitrouter-registry", "bitrouter-sdk", "bitrouter-skills", "bitrouter-update", "dist-helper"])'
    - name: Inspect native build and test dependency boundaries
      run: |
        for flags in '' '--no-default-features' '--no-default-features --features multi-instance,http2' '--all-features'; do
          cargo tree --locked -p bitrouter $flags -e normal,build,dev --prefix none > service-tree.txt
          if grep -E '^(bitrouter-bro|agent-client-protocol[^ ]*) v' service-tree.txt; then
            echo '::error::The service test or build closure includes BRO/ACP'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-bro --all-features -e normal,build,dev --prefix none > bro-tree.txt
        if grep -E '^(bitrouter|bitrouter-registry|bitrouter-guardrails|sea-orm(-[^ ]*)?|sqlx-(postgres|mysql)|axum|rmcp) v' bro-tree.txt; then
          echo '::error::BRO builds gateway implementation dependencies'; exit 1
        fi
    - name: verify SDK without HTTP/2
      run: |
        # Check production before test dependencies can enable HTTP/2.
        cargo check --locked -p bitrouter-sdk --no-default-features --lib
        cargo check --locked -p bitrouter-sdk --no-default-features --features core --lib
        cargo check --all-targets --locked -p bitrouter-sdk --no-default-features --test transport_protocol
    - name: contracts, registry and client build independently
      run: |
        cargo check --all-targets -p bitrouter-registry --all-features
        cargo check --all-targets -p bitrouter-ai
        cargo check --all-targets -p bitrouter-ai --all-features
        cargo check --all-targets -p bitrouter-sdk
        cargo check --all-targets -p bitrouter-sdk --all-features
        cargo check --all-targets -p bitrouter-guardrails --all-features
    - name: inspect isolated production dependency closures
      shell: bash
      run: |
        cargo check --locked -p bitrouter-ai --no-default-features --features axum --lib
        # Successful checks above prove package membership. Inspect forward
        # trees: an unknown inverted dependency must not count as evidence.
        for flags in '' '--no-default-features' '--all-features'; do
          cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
          if [[ "$flags" != '--all-features' ]] && grep -Eq '^(axum|axum-core|hyper|hyper-util) v' ai-tree.txt; then
            echo '::error::default AI contracts pulled HTTP framework dependencies'; exit 1
          fi
          if grep -Eq '^(bitrouter(-sdk|-bro|-build|-update)?|reqwest|tokio(-[^ ]*)?|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
            echo '::error::AI public contracts pulled runtime dependencies'; exit 1
          fi
          cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
          if grep -Eq '^(bitrouter(-bro|-build|-update)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
            echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
        if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
          echo '::error::matcher depends on its host implementation'; exit 1
        fi
        cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
        if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
          echo '::error::default service links the optional matcher'; exit 1
        fi
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  sdk-public-api:
    name: sdk-public-api
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: read the pins
      id: pin
      shell: bash
      run: |
        pins=crates/bitrouter-sdk/public-api.pins
        for key in toolchain tool; do
          value="$(sed -n "s/^$key=//p" "$pins" | tr -d '[:space:]')"
          if [[ -z "$value" ]]; then
            echo "::error::$pins has no '$key=' line"; exit 1
          fi
          echo "$key=$value" >> "$GITHUB_OUTPUT"
        done
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false
    - name: install the pinned cargo-public-api
      run: cargo install --locked "${{ steps.pin.outputs.tool }}"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
    - name: verify public contract and client surfaces
      shell: bash
      run: |
        for package in bitrouter-ai bitrouter-sdk; do
          listing="$RUNNER_TEMP/$package-public-api.txt"
          cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
            -p "$package" --all-features --simplified > "$listing"
          # --simplified excludes foreign blanket impls rustdoc attaches to
          # every type. Real authored fields and bounds remain in the listing.
          if [[ "$package" == bitrouter-ai ]]; then
            sentinels=(
              'pub struct bitrouter_ai::axum::response::Reply'
              'pub enum bitrouter_ai::stream::ProtocolEnd'
              'pub struct bitrouter_ai::tenancy::resources::ResourcePut'
              'pub struct bitrouter_ai::tenancy::admission::AdmissionProfileV1'
              'pub struct bitrouter_ai::tenancy::admission_v2::AdmissionProfileV2'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationCapabilitiesV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationRequestV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::AdmissionProfileObservationSnapshotV1'
              'pub struct bitrouter_ai::tenancy::profile_observation::ProfileObservationV1'
              'pub struct bitrouter_ai::tenancy::resources_v2::ResourcePutV2'
              'pub struct bitrouter_ai::tenancy::resources_v2::ResourceCapabilitiesV2'
              'pub struct bitrouter_ai::tenancy::generation_defaults::CanonicalGenerationDefaultsV1'
              'pub struct bitrouter_ai::tenancy::generation_defaults::GenerationDefaultsEnvelopeV1'
              'pub struct bitrouter_ai::tenancy::generation_defaults::GenerationDefaultsEnvelopeV2'
              'pub enum bitrouter_ai::tenancy::generation_defaults::ConfigurationDefaults'
              'bitrouter_ai::tenancy::ordered::OrderedDispatchBindingV2::with_generation_defaults_envelope_v2'
              'bitrouter_ai::tenancy::ordered::OrderedDispatchBindingV2::with_generation_defaults_envelope'
              'bitrouter_ai::tenancy::ordered::OrderedDispatchBindingV2::with_generation_defaults'
              'pub struct bitrouter_ai::tenancy::resources::ResourceStatus'
              'pub struct bitrouter_ai::tenancy::usage_evidence::ExecutionUsageEvidenceV1'
              'pub struct bitrouter_ai::protocol::chat_completions::ChatRequest'
              'pub struct bitrouter_ai::gateway::ModelsResponse'
              'pub mod bitrouter_ai::extension'
              'pub struct bitrouter_ai::control::reload::ReloadInput'
              'pub struct bitrouter_ai::control::requests::RequestFilters'
              'pub struct bitrouter_ai::control::status::StatusReport'
              'pub enum bitrouter_ai::control::action::Action'
              'pub struct bitrouter_ai::control::error::ErrorEnvelope'
              'pub struct bitrouter_ai::eval::EvalSubject'
              'pub struct bitrouter_ai::eval::AdmissionOutcome'
              'pub struct bitrouter_ai::harness::api::CapabilitiesResponse'
              'pub struct bitrouter_ai::harness::thread::ThreadView'
              'pub struct bitrouter_ai::core::evidence::NativeAttemptReport'
              'pub enum bitrouter_ai::core::evidence::NativeTokenCost'
              'pub struct bitrouter_ai::core::protocol::ClientMessage'
              'pub enum bitrouter_ai::core::protocol::ServerMessage'
              'pub struct bitrouter_ai::core::protocol::ErrorEnvelope'
              'pub struct bitrouter_ai::core::checkpoint::CheckpointBatch'
              'pub struct bitrouter_ai::core::responses::CreateRequest'
              'pub struct bitrouter_ai::core::responses::FunctionOutput'
            )
            forbidden='extension::request_check::Registration|ExtensionApi|NativeExecutionControl|NativePrivateContextRuntime|CommitGate|VerifiedBatch|CheckpointBatchExt|HarnessManifestExt|ClientMessageExt|ToolResultLimitsExt|::capture_cache|::commitment\(|ToolResultOutput::(from_untyped_value|to_provider_string)|DataContent::(to_url|from_url)|Source::synthesize_id|GenerationParams::(extras_for_protocol|extra_value_for_protocol)|Prompt::required_capabilities|ModelTokenLimits::output_reservation_covers_model|NativeRoute::requires_input_count|Limits::within|Capabilities::negotiate|bitrouter::|bitrouter_sdk::|reqwest::|tokio::|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::'
          else
            sentinels=(
              'pub struct bitrouter_sdk::gateway::GatewayClient'
              'bitrouter_sdk::gateway::GatewayClient::chat_reply'
              'bitrouter_sdk::gateway::GatewayClient::tenant'
              'pub struct bitrouter_sdk::gateway::tenancy::TenantGateway'
              "bitrouter_sdk::gateway::tenancy::TenantGateway<'_>::with_anthropic_beta"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_anthropic_beta"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_generation_defaults"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_generation_defaults_envelope"
              "bitrouter_sdk::gateway::tenancy::ordered::OrderedTenantGateway<'_>::with_generation_defaults_envelope_v2"
              'bitrouter_sdk::tenancy::TenancyClient::put_resource'
              'bitrouter_sdk::tenancy::TenancyClient::put_resource_v2'
              'bitrouter_sdk::tenancy::TenancyClient::resource_capabilities_v2'
              'bitrouter_sdk::tenancy::TenancyClient::admission_profile_observation_capabilities'
              'bitrouter_sdk::tenancy::TenancyClient::observe_admission_profiles'
              'bitrouter_sdk::tenancy::TenancyClient::usage_evidence'
              'bitrouter_sdk::gateway::GatewayClient::chat_completions'
              'bitrouter_sdk::gateway::GatewayClient::chat_reply_with_correlation'
              'bitrouter_sdk::gateway::GatewayClient::stream_responses'
              'pub struct bitrouter_sdk::harness::HarnessClient'
              'bitrouter_sdk::harness::HarnessClient::connect'
              'bitrouter_sdk::harness::HarnessClient::submit_turn'
              'bitrouter_sdk::harness::HarnessClient::answer_input'
              'bitrouter_sdk::harness::HarnessClient::history'
              'pub struct bitrouter_sdk::control::ControlClient'
              'bitrouter_sdk::control::ControlClient::reload'
              'bitrouter_sdk::control::ControlClient::operation'
              'bitrouter_sdk::gateway::GatewayClient::submit_eval_result'
              'bitrouter_sdk::gateway::GatewayClient::eval_snapshot'
              'bitrouter_sdk::gateway::GatewayClient::core_capabilities'
              'bitrouter_sdk::gateway::GatewayClient::managed_responses'
              'bitrouter_sdk::gateway::GatewayClient::stream_managed_responses'
              'bitrouter_sdk::gateway::GatewayClient::core_channel'
              'pub struct bitrouter_sdk::core::CoreChannel'
              'pub struct bitrouter_sdk::core::CoreSender'
              'pub struct bitrouter_sdk::core::CoreReceiver'
            )
            forbidden='bitrouter::|axum|sea_orm|sqlx|ratatui|crossterm|opentelemetry|tracing_subscriber|agent_client_protocol|rmcp::|tokio_tungstenite|tungstenite::'
          fi
          for sentinel in "${sentinels[@]}"; do
            if ! grep -qF "$sentinel" "$listing"; then
              echo "::error::$package public API listing is missing '$sentinel'"
              exit 1
            fi
          done
          if hits="$(grep -niE "$forbidden" "$listing")"; then
            echo "::error::runtime ownership leaked into $package's public API"
            printf '%s\n' "$hits"
            exit 1
          fi
          # A public re-export can hide its foreign origin in the listing.
          # Consumers import each contract from its owning public module.
          if hits="$(grep -rnE '^[[:space:]]*pub use[[:space:]]' "crates/$package/src/")"; then
            echo "::error::$package contains a public forwarding export"
            printf '%s\n' "$hits"
            exit 1
          fi
          crate_name="${package//-/_}"
          # Authored conversion impls can render primitive paths such as
          # u64::from. These are built-in types, not external crate roots.
          primitives='bool|char|str|[ui](8|16|32|64|128|size)|f(16|32|64|128)'
          grep -oE '\b[a-z_][a-z0-9_]*(::[a-zA-Z_][a-zA-Z0-9_]*)+' "$listing" \
            | cut -d: -f1 | sort -u \
            | grep -vxE "$crate_name|core|std|alloc|$primitives" > "$RUNNER_TEMP/$package-public-api-deps.txt"
          diff -u \
            <(grep -v '^#' "crates/$package/public-api-deps.txt") \
            "$RUNNER_TEMP/$package-public-api-deps.txt"
        done
        cargo "+${{ steps.pin.outputs.toolchain }}" public-api \
          -p bitrouter-ai --no-default-features --simplified > "$RUNNER_TEMP/ai-default-public-api.txt"
        if grep -nE 'axum::|axum_core::|http::|futures_core::|tokio::|reqwest::' "$RUNNER_TEMP/ai-default-public-api.txt"; then
          echo '::error::default AI API leaked optional HTTP/runtime bindings'; exit 1
        fi
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: registry source is valid
      run: cargo run -p dist-helper -- registry validate
    - name: generated dist is up to date
      run: cargo run -p dist-helper -- check
    - name: no deprecated/unsound yaml parser in the graph
      run: |
        for crate in serde_yaml serde_yml; do
          if cargo tree -i "$crate" 2>/dev/null | grep -q "^$crate"; then
            echo "::error::$crate must not be in the dependency graph (RUSTSEC: deprecated/unsound)"
            cargo tree -i "$crate"
            exit 1
          fi
        done
    needs:
    - changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.registry == 'true'
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.93'
    - run: cargo check --workspace --all-features
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo doc --workspace --all-features --no-deps
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test --doc --workspace --all-features
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  test-platform:
    name: test (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          package: bitrouter
          timeout-minutes: 45
          expected-tests: 16
          targets: --test daemon --test host_lifecycle --test mcp_config_pty --test onboarding_pty
          filter: (binary(=daemon) & (test(=status_route_and_stop_roundtrip_over_the_control_socket) | test(=concurrent_clients_are_all_served) | test(=socket_file_has_owner_only_permissions)))
            | (binary(=host_lifecycle) & test(=sigterm_control_error_drains_inflight_inference_before_nonzero_exit)) | binary(=mcp_config_pty) | binary(=onboarding_pty)
        - os: windows-latest
          package: bitrouter
          # Leave time for the test suite after the all-features MSVC build.
          timeout-minutes: 60
          expected-tests: 13
          targets: --lib --test daemon --test invocation
          filter: test(=tenancy::ownership::unsupported_claim_tests::native_recovery_connector_refuses_before_creating_non_unix_authority) | test(=tenancy::tests::execution::native::local_tenancy_remains_unavailable_without_creating_files)
            | test(=providers::cli_install::tests::install_command_is_the_official_native_installer) | test(=paths::tests::replacing_private_file_overwrites_existing_destination_on_windows)
            | test(=status_route_and_stop_roundtrip_over_the_control_socket)
            | test(=concurrent_clients_are_all_served) | test(=probe_status_reports_none_when_nothing_listens) | test(=client_fails_clearly_when_no_daemon_is_listening)
            | (binary(=invocation) & test(=gateway_update_delegates_for_the_installed_profile_and_channel))
            | test(=daemon_locator::tests::config_identity_survives_file_deletion_and_recreation)
            | test(=policy_lock::files_tests::current_source_history_cas_and_exact_rollback)
            | test(=db::tests::relative_sqlite_urls_anchor_to_config_home_and_preserve_queries)
            | (binary(=invocation) & test(=gateway_help_and_status_use_the_service_identity))
        - os: windows-latest
          package: bitrouter-bro
          timeout-minutes: 45
          expected-tests: 22
          targets: ''
          filter: (kind(bin) & test(=tools::tests::missing_sandbox_omits_and_refuses_shell)) | binary(=invocation) | binary(=acp_serve)
            | (binary(=managed_native) & (test(=approved_write_reads_and_continues_then_cancels_the_next_approval)
            | test(=full_tree_runs_four_models_and_delivers_each_conclusion_once)
            | test(=large_cold_checkpoint_keeps_multiturn_context_and_sixteen_step_tool_loop)
            | test(=the_tree_shares_one_model_attempt_budget_across_all_workers)
            | test(=active_child_cancellation_fences_paid_dispatch_and_overlap_on_restart)))
            | (binary(=native_acp) & (test(=native_stdio_streams_and_reopens_persisted_history_without_resending)
            | test(=cold_load_reissues_the_exact_permission_and_cancel_prevents_an_effect)
            | test(=cancelling_a_paid_stream_keeps_its_receipt_and_blocks_cold_redispatch)
            | test(=manager_eof_during_stream_preserves_the_complete_message_for_cold_replay)
            | test(=permission_callback_cancel_and_error_settle_once_on_a_connected_manager)))
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        cache-key: complete-v1
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: Build platform fixtures
      if: runner.os == 'macOS'
      run: cargo build --locked -p bitrouter --all-features --example onboarding_fixture --jobs 2
    - name: Build BRO ACP adapter
      if: matrix.package == 'bitrouter-bro'
      run: cargo build --locked -p bitrouter-bro --example bro_acp_fixture --jobs 2
    - name: Verify platform behavior
      shell: bash
      env:
        PACKAGE: ${{ matrix.package }}
        TARGETS: ${{ matrix.targets }}
        FILTER: ${{ matrix.filter }}
        EXPECTED_TESTS: ${{ matrix.expected-tests }}
        BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
      run: |
        read -r -a targets <<< "$TARGETS"
        mkdir -p ci-evidence
        cargo nextest list --locked -p "$PACKAGE" --all-features "${targets[@]}" --build-jobs 2 \
          --profile ci -E "$FILTER" --message-format json > ci-evidence/platform-selection.json
        # Require the entire platform allowlist, not merely one surviving match.
        # https://nexte.st/docs/machine-readable/list/
        jq -e --argjson expected "$EXPECTED_TESTS" '
          [."rust-suites"[].testcases[] | select(."filter-match".status == "matches")]
          | length == $expected and all(.ignored == false)
        ' ci-evidence/platform-selection.json
        selection=(-E "$FILTER")
        # The BRO inventory includes the real ACP job-object cleanup regression.
        # Exercise the complete native BRO package after checking its required cases.
        if [[ "$PACKAGE" == bitrouter-bro ]]; then selection=(); fi
        cargo nextest run --locked -p "$PACKAGE" --all-features "${targets[@]}" --build-jobs 2 \
          --profile ci --test-threads 2 --retries 0 --no-fail-fast --no-tests fail "${selection[@]}"
    - name: Upload platform evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}-evidence
        path: |
          ci-evidence/
          target/nextest/ci/junit.xml
        retention-days: 7
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
  test-telemetry-grpc:
    name: test (Linux, gRPC-only telemetry)
    needs:
    - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
    # The all-feature archive selects HTTP at compile time. This one small
    # integration target needs its own gRPC-only build to exercise the wire path.
    - uses: ./.github/actions/test-grpc
  test-ubuntu:
    name: test (ubuntu-latest)
    if: always()
    needs:
    - changes
    - repository-hygiene
    - fmt
    - agent-plugin
    - clippy
    - build-linux
    - test-linux
    - test-process
    - test-product-process
    - build-service-process
    - build-bro
    - test-bro
    - test-service-profile
    - test-libraries
    - test-capacity
    - database-backends
    - application-features
    - feature-isolation
    - sdk-public-api
    - dist
    - msrv
    - doc
    - doctest
    - test-platform
    - test-telemetry-grpc
    runs-on: ubuntu-24.04
    steps:
    - name: Require selected checks and reject failed or cancelled dependencies
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -e '
          .changes.result == "success" and
          ([to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length == 0) and
          (if .changes.outputs.code == "true" then
             [to_entries[].value] | all(.result == "success")
           else [."repository-hygiene", .fmt, ."agent-plugin"] | all(.result == "success") end) and
          (if .changes.outputs.registry == "true" then .dist.result == "success" else true end)
        ' <<< "$RESULTS"
