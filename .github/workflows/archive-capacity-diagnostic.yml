---
name: Archive process validation from frozen CI artifacts
'on':
  push:
    branches:
    - codex/tenant-capacity-diagnostics
    paths:
    - ".github/workflows/archive-capacity-diagnostic.yml"
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
      with:
        ref: fc7a40db6c2705d87e34ce04346b71ed98994f54
        persist-credentials: false
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - uses: actions/download-artifact@v4
      with:
        name: linux-tests-fc7a40db6c2705d87e34ce04346b71ed98994f54
        path: ".ci-archive"
        run-id: 41419321397
        github-token: "${{ github.token }}"
    - name: Restore the exact failed candidate without a build
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 'fc7a40db6c2705d87e34ce04346b71ed98994f54'
        test "$(git rev-parse HEAD^{tree})" = 'db35b2bc4408ec1533d3f7ffaa65233fb02543d0'
        test "$(cat .ci-archive/tests.sha)" = 'fc7a40db6c2705d87e34ce04346b71ed98994f54'
        test "$(cat .ci-archive/tests.workspace)" = "$GITHUB_WORKSPACE"
        (cd .ci-archive && sha256sum -c tests.tar.zst.sha256)
        mkdir -p ci-evidence
        tar --zstd -xf .ci-archive/tests.tar.zst
        test -x target/debug/bro
        test -x target/debug/examples/owned_capture_fixture
        printf '%s\n' \
          'BITROUTER_TEST_PREBUILT_ONLY=1' \
          "BITROUTER_TEST_EXAMPLES_DIR=$GITHUB_WORKSPACE/target/debug/examples" \
          "BITROUTER_TEST_BRO=$GITHUB_WORKSPACE/target/debug/bro" \
          "BITROUTER_TEST_GATEWAY_BINARY=$GITHUB_WORKSPACE/target/debug/bro" \
          "BITROUTER_OWNED_CAPTURE_FIXTURE=$GITHUB_WORKSPACE/target/debug/examples/owned_capture_fixture" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/ci-no-build"
        printf '#!/bin/sh\necho "diagnostic must use prebuilt artifacts" >&2\nexit 97\n' > "$RUNNER_TEMP/ci-no-build/cargo"
        chmod +x "$RUNNER_TEMP/ci-no-build/cargo"
        printf '%s\n' "$RUNNER_TEMP/ci-no-build" >> "$GITHUB_PATH"
    - name: verify actual archive, restart and refusal
      timeout-minutes: 45
      shell: bash
      env:
        BITROUTER_TEST_BRO: "${{ github.workspace }}/target/debug/bro"
      run: |
        set -euo pipefail
        export BITROUTER_TEST_RECOVERY_KEY="$(openssl rand -base64 32)"
        for case in \
          actual_cli_verifies_fresh_static_provisioning_and_rejects_changed_evidence \
          actual_cli_refuses_unreadable_operation_context_and_timestamp \
          actual_cli_refuses_definition_substitution_and_copied_old_credential \
          abandoned_recovery_waiter_keeps_actual_file_owner_until_read_rollback_and_close \
          selected_files::actual_cli_refuses_changed_linked_or_nonprivate_selected_files \
          selected_files::selected_file_change_during_actual_read_prevents_publication_after_worker_close ; do
          bash .github/scripts/ci-test.sh "offline-${case//::/-}" --test-threads 1 --run-ignored only -E "test(=offline::recovery::tests::$case)"
        done
