name: Distribution acceptance
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 20 2 * * 0
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: distribution-acceptance-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  application-features:
    name: application-features (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
      BITROUTER_TEST_GATEWAY_BINARY: ${{ github.workspace }}/target/debug/bitrouter
      BITROUTER_TEST_PREBUILT_ONLY: '1'
    strategy:
      fail-fast: false
      matrix:
        features:
        - ''
        - http2
        - eval-publication
        - mcp
        - server-tools
        - guardrails
        - otel-http
        - otel-grpc
        - otel-http,otel-grpc
        - eval-publication,otel-http
        - db-postgres
        - multi-instance
        - multi-instance,http2
        - db-mysql
        - eval-publication,mcp,server-tools,otel-http,db-postgres,db-mysql,http2
      max-parallel: 2
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: build selected profile without workspace feature unification
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: |
        # Check production before dev-dependencies can unify extra features.
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bitrouter
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --all-targets
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
        # Only the minimal gateway distributions promise an h2-free
        # production closure. Other features (such as otel-grpc) may need h2.
        case "$PROFILE_FEATURES" in
          ''|multi-instance)
            if grep -Eq '^h2 v' profile-tree.txt; then
              echo '::error::minimal HTTP/1 gateway profile pulled h2'; exit 1
            fi ;;
        esac
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build,dev --prefix none > service-tree.txt
        if grep -Eq '^(agent-client-protocol[^ ]*|bitrouter-bro) v' service-tree.txt; then
          echo '::error::service tests or binary linked a BRO implementation'; exit 1
        fi
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" \
          -e normal,build -i jsonschema --depth 1 --prefix none > profile-schema-owners.txt
        if grep -Ev '^(jsonschema|bitrouter-registry) v' profile-schema-owners.txt; then
          echo '::error::service schema validation must be owned by registry'; exit 1
        fi
        case ",$PROFILE_FEATURES," in
          *,mcp,*|*,server-tools,*) ;;
          *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
               echo '::error::profile without MCP pulled its transport runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-http,*|*,otel-grpc,*) ;;
          *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
               echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-grpc,*) ;;
          *) if grep -Eq '^tonic v' profile-tree.txt; then
               echo '::error::profile without gRPC pulled tonic'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-postgres,*|*,multi-instance,*) ;;
          *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
               echo '::error::profile without PostgreSQL pulled its driver'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-mysql,*) ;;
          *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
               echo '::error::profile without MySQL pulled its driver'; exit 1
             fi ;;
        esac
    - name: prebuild the selected gateway for CLI and lifecycle tests
      if: matrix.features == '' || matrix.features == 'eval-publication' || matrix.features == 'server-tools' || matrix.features == 'mcp' || matrix.features == 'db-postgres' || matrix.features == 'db-mysql'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo build --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bitrouter --jobs 2
    - name: verify gRPC-only telemetry delivery
      if: matrix.features == 'otel-grpc'
      uses: ./.github/actions/test-grpc
    - name: prebuild selected-profile protocol fixtures
      if: matrix.features == 'mcp'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo build --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --jobs 2 --example harness_mcp_fixture
    - name: verify HTTP/2 ingress in lean profiles
      if: matrix.features == 'http2' || matrix.features == 'multi-instance,http2'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::http2_ingress::" --jobs 2 -- --test-threads=2
    - uses: taiki-e/install-action@nextest
      if: matrix.features == '' || matrix.features == 'eval-publication' || matrix.features == 'multi-instance' || matrix.features == 'multi-instance,http2'
    - name: verify transport bounds and connection ownership
      if: matrix.features == 'multi-instance' || matrix.features == 'multi-instance,http2'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo nextest run --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --build-jobs 2 --test-threads 2 --no-tests fail -E 'test(gateway::transport::)'
    - name: verify minimal gateway routing and operator commands
      if: matrix.features == ''
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo nextest run --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --build-jobs 2 --test-threads 2 --no-tests fail
        -E 'test(/^tests::policy_eval_control_plane::/) | test(/^tests::policy_cli::/) | test(/^tests::feature_ingress::/)'
    - name: verify mature tenant Policy and Eval in reduced profiles
      if: matrix.features == '' || matrix.features == 'eval-publication'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo nextest run --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --build-jobs 2 --test-threads 2 --no-tests fail
        -E 'test(tenancy::tests::execution::model_policy::) | test(tenancy::tests::eval::)'
    - name: verify noninteractive setup and source boundaries
      if: matrix.features == ''
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: |
        cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::onboarding::"
        cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test source_boundaries
    - name: verify unavailable telemetry before startup side effects
      if: matrix.features == ''
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::telemetry_disabled::" --jobs 2 -- --test-threads=2
    - name: verify host shutdown draining
      if: matrix.features == '' || matrix.features == 'eval-publication'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::host_lifecycle::" --jobs 2 -- --test-threads=2
    - name: verify gateway operators
      if: matrix.features == ''
      run: cargo nextest run --locked -p bitrouter --no-default-features --lib --test tenancy_offline_cli --no-tests fail
        -E 'test(config::yaml::) | test(/^cli::/) | test(/^tests::daemon::/) | binary(=tenancy_offline_cli)'
    - name: verify database feature availability
      if: matrix.features == 'db-postgres' || matrix.features == 'db-mysql'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::feature_ingress::"
    - name: verify optional server tools
      if: matrix.features == 'server-tools' || matrix.features == 'mcp'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: |
        cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib "tests::feature_ingress::"
        cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib server_tool
    - name: verify gateway MCP discovery and process cleanup
      if: matrix.features == 'mcp'
      run: cargo test -p bitrouter --no-default-features --features mcp --lib "tests::harness_mcp_check::" --jobs 2 -- --test-threads=2
  artifact-profiles:
    name: artifact profiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - name: preserve three independently built product artifacts
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/profile-full" "$RUNNER_TEMP/profile-gateway" "$RUNNER_TEMP/profile-bro"
        cargo build --locked -p bitrouter --bin bitrouter
        cp target/debug/bitrouter "$RUNNER_TEMP/profile-full/bitrouter"
        cargo build --locked -p bitrouter --no-default-features --bin bitrouter
        cp target/debug/bitrouter "$RUNNER_TEMP/profile-gateway/bitrouter"
        cargo build --locked -p bitrouter-bro --bin bro
        cp target/debug/bro "$RUNNER_TEMP/profile-bro/bro"
    - name: Provision and probe the BRO process-test sandbox
      run: bash .github/scripts/ci-bro-sandbox.sh
    - name: verify resident transitions, storage, policy and the public product boundary
      shell: bash
      env:
        BITROUTER_TEST_FULL_BINARY: ${{ runner.temp }}/profile-full/bitrouter
        BITROUTER_TEST_GATEWAY_BINARY: ${{ runner.temp }}/profile-gateway/bitrouter
        BITROUTER_TEST_BRO: ${{ runner.temp }}/profile-bro/bro
      run: |
        cargo test --locked -p bitrouter --no-default-features --lib "tests::artifact_build_metadata::"
        for selector in \
          artifact_profiles_preserve_residents_and_gate_explicit_replacement \
          gateway_state::published_policy_and_accounting_survive_full_minimum_full \
          gateway_state::trajectory::explicit_trajectory_facts_and_outbox_survive_full_minimum_full; do
          cargo nextest run --locked -p bitrouter --no-default-features --lib \
            --test-threads 1 --retries 0 --run-ignored only --no-tests fail -E "test(=tests::artifact_profiles::$selector)"
        done
        cargo nextest run --locked -p bitrouter --no-default-features --test product_process \
          --retries 0 --run-ignored only --no-tests fail -E 'test(=gateway_routes_the_approved_bro_tool_continuation)'
  packaged-gateway:
    uses: ./.github/workflows/gateway-artifacts.yml
    with:
      plan: '{"releases":[{"app_name":"bitrouter"}]}'
      cargo-profile: dev
    if: github.event_name != 'push'
  registry-live-lifecycle:
    name: live registry sync and host consumption
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      BITROUTER_TEST_DIST_HELPER_BINARY: ${{ github.workspace }}/target/debug/dist-helper
      BITROUTER_TEST_GATEWAY_BINARY: ${{ github.workspace }}/target/debug/bitrouter
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: build the production registry producer
      run: |
        cargo build --locked -p dist-helper --jobs 2
        cargo build --locked -p bitrouter --no-default-features --bin bitrouter --jobs 2
    - name: sync the public provider and route through its exact artifact
      env:
        BITROUTER_TEST_REGISTRY_EVIDENCE_DIR: ${{ runner.temp }}/registry-closed-loop
      run: cargo test --locked -p bitrouter --no-default-features --jobs 2 --lib tests::registry_lifecycle::live_sync::provider_sync_artifact_is_consumed_by_official_host_and_routes_requests
        -- --ignored --exact --nocapture
    - name: preserve sync, byte identity and routing evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registry-provider-closed-loop
        path: ${{ runner.temp }}/registry-closed-loop
        if-no-files-found: warn
  cargo-install:
    name: standalone Cargo install (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - {package: bitrouter, binary: bitrouter, peer: bitrouter-bro}
        - {package: bitrouter-bro, binary: bro, peer: bitrouter}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: package and install from independent source archives
      shell: bash
      env:
        PRODUCT: ${{ matrix.package }}
        BINARY: ${{ matrix.binary }}
        PEER: ${{ matrix.peer }}
      run: |
        set -euo pipefail
        scratch="$(mktemp -d "$RUNNER_TEMP/source-install.XXXXXXXX")"
        cargo package --locked --no-verify --target-dir "$scratch/pkg" --workspace --exclude "$PEER" --exclude dist-helper
        version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er --arg p "$PRODUCT" '.packages[] | select(.name == $p).version')"
        test -f "$scratch/pkg/package/$PRODUCT-$version.crate"
        test ! -e "$scratch/pkg/package/$PEER-$version.crate"
        cd "$scratch"
        mkdir -p crates .cargo
        printf '[patch.crates-io]\n' > .cargo/config.toml
        for archive in pkg/package/*.crate; do
          tar -xzf "$archive" -C crates
          dir="$(basename "$archive" .crate)"
          name="${dir%-$version}"
          if [[ "$name" != "$PRODUCT" ]]; then
            printf '%s = { path = "%s" }\n' "$name" "$scratch/crates/$dir" >> .cargo/config.toml
          fi
        done
        unset BITROUTER_BUILD_REVISION
        cargo install --path "crates/$PRODUCT-$version" --debug --root "$scratch/install" --target-dir "$scratch/target"
        test "$(ls "$scratch/install/bin")" = "$BINARY"
        if [[ "$PRODUCT" == bitrouter ]]; then
          "$scratch/install/bin/bitrouter" --json build-info > identity.json
        else
          "$scratch/install/bin/bro" build-info > identity.json
        fi
        jq -e --arg sha "$GITHUB_SHA" --arg version "$version" '.source_revision == $sha and .version == $version' identity.json
  public-library-boundaries:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: verify SDK without HTTP/2
      run: |
        # Check production before test dependencies can enable HTTP/2.
        cargo check --locked -p bitrouter-sdk --no-default-features --lib
        cargo test --locked -p bitrouter-sdk --no-default-features --test transport_protocol
    - name: contracts, registry and client build independently
      run: |
        cargo test -p bitrouter-registry --all-features
        cargo test -p bitrouter-ai
        cargo test -p bitrouter-ai --all-features
        cargo test -p bitrouter-sdk
        cargo test -p bitrouter-sdk --all-features
        cargo test -p bitrouter-guardrails --all-features
    - name: inspect isolated production dependency closures
      shell: bash
      run: |
        # Successful checks above prove package membership. Inspect forward
        # trees: an unknown inverted dependency must not count as evidence.
        for flags in '' '--no-default-features' '--all-features'; do
          cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
          if grep -Eq '^(axum|axum-core|hyper|hyper-util) v' ai-tree.txt; then
            echo '::error::AI contracts pulled HTTP framework dependencies'; exit 1
          fi
          if grep -Eq '^(bitrouter(-sdk|-bro|-build|-update)?|reqwest|tokio(-[^ ]*)?|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
            echo '::error::AI public contracts pulled runtime dependencies'; exit 1
          fi
          cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
          if grep -Eq '^(bitrouter(-bro|-build|-update)?|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
            echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
        if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
          echo '::error::matcher depends on its host implementation'; exit 1
        fi
        cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
        if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
          echo '::error::default gateway links the optional matcher'; exit 1
        fi
    - name: check the independent public SDK consumer
      run: |
        cargo check --locked \
          --manifest-path apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml \
          --target-dir target/sdk-consumer --all-targets
