name: Distribution acceptance
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 20 2 * * 0
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: distribution-acceptance-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  application-features:
    name: application-features (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      BITROUTER_TEST_EXAMPLES_DIR: ${{ github.workspace }}/target/debug/examples
    strategy:
      fail-fast: false
      matrix:
        features:
        - ''
        - http2
        - core
        - harness
        - core,harness
        - mcp
        - server-tools
        - guardrails
        - otel-http
        - otel-grpc
        - otel-http,otel-grpc
        - harness,otel-http
        - db-postgres
        - multi-instance
        - multi-instance,http2
        - db-mysql
        - mcp,server-tools,otel-http,db-postgres,db-mysql
      max-parallel: 2
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: build selected profile without workspace feature unification
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: |
        # Check production before dev-dependencies can unify extra features.
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --bin bro
        cargo check --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --all-targets
        cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" -e normal,build --prefix none > profile-tree.txt
        # Only the minimal gateway distributions promise an h2-free
        # production closure. Other features (such as otel-grpc) may need h2.
        case "$PROFILE_FEATURES" in
          ''|multi-instance)
            if grep -Eq '^h2 v' profile-tree.txt; then
              echo '::error::minimal HTTP/1 gateway profile pulled h2'; exit 1
            fi ;;
        esac
        if grep -Eq '^(ratatui(-[^ ]*)?|crossterm) v' profile-tree.txt; then
               echo '::error::headless profile pulled terminal dependencies'; exit 1
        fi
        case ",$PROFILE_FEATURES," in
          *,harness,*) ;;
          *) if grep -Eq '^agent-client-protocol[^ ]* v' profile-tree.txt; then
               echo '::error::profile without harness pulled ACP runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,harness,*) ;;
          *)
             # Registry admission validates its wire schema in every profile.
             # The application must still keep harness result validation optional.
             cargo tree --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" \
               -e normal,build -i jsonschema --depth 1 --prefix none > profile-schema-owners.txt
             if grep -Ev '^(jsonschema|bitrouter-registry) v' profile-schema-owners.txt; then
               echo '::error::profile without harness pulled schema validation outside registry'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,mcp,*|*,server-tools,*|*,harness,*) ;;
          *) if grep -Eq '^(rmcp|process-wrap) v' profile-tree.txt; then
               echo '::error::profile without MCP pulled its transport runtime'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-http,*|*,otel-grpc,*) ;;
          *) if grep -Eq '^(opentelemetry[^ ]*|tracing-opentelemetry) v' profile-tree.txt; then
               echo '::error::profile without OTLP pulled exporter dependencies'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,otel-grpc,*) ;;
          *) if grep -Eq '^tonic v' profile-tree.txt; then
               echo '::error::profile without gRPC pulled tonic'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-postgres,*|*,multi-instance,*) ;;
          *) if grep -Eq '^sqlx-postgres v' profile-tree.txt; then
               echo '::error::profile without PostgreSQL pulled its driver'; exit 1
             fi ;;
        esac
        case ",$PROFILE_FEATURES," in
          *,db-mysql,*) ;;
          *) if grep -Eq '^sqlx-mysql v' profile-tree.txt; then
               echo '::error::profile without MySQL pulled its driver'; exit 1
             fi ;;
        esac
    - name: prebuild selected-profile protocol fixtures
      if: contains(matrix.features, 'harness') || matrix.features == 'mcp'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo build --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --jobs 2 --example onboarding_fixture --example pty_acp_fixture
        --example harness_mcp_fixture
    - name: verify HTTP/2 ingress in lean profiles
      if: matrix.features == 'http2' || matrix.features == 'multi-instance,http2'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test http2_ingress --jobs 2 -- --test-threads=2
    - name: verify shared transport bounds and connection ownership
      if: matrix.features == 'multi-instance' || matrix.features == 'multi-instance,http2'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: 'cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --jobs 2 gateway::shared::transport:: -- --test-threads=2'
    - name: verify gateway behavior without learning services
      if: matrix.features == '' || matrix.features == 'harness'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test core_disabled --test trajectory_progress_control --test gateway_workflow
        --test feature_ingress
    - name: verify noninteractive setup and source boundaries
      if: matrix.features == '' || matrix.features == 'harness' || matrix.features == 'core,harness'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test onboarding --test source_boundaries
    - name: verify unavailable telemetry before startup side effects
      if: matrix.features == '' || matrix.features == 'harness'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test telemetry_disabled --jobs 2 -- --test-threads=2
    - name: verify host handoff and shutdown draining
      if: matrix.features == '' || matrix.features == 'core' || matrix.features == 'core,harness'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test --locked -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test host_lifecycle --jobs 2 -- --test-threads=2
    - uses: taiki-e/install-action@nextest
      if: matrix.features == '' || matrix.features == 'core' || matrix.features == 'harness' || matrix.features == 'core,harness'
    - name: verify base contracts without harness
      if: matrix.features == ''
      run: cargo nextest run -p bitrouter --no-default-features --lib --bin bro --build-jobs 2 --test-threads 2 -E 'test(client::agent_local::) | test(providers::cli_install::)
        | test(skills::) | test(skills_init_tests) | test(config::yaml::) | test(daemon::tests::opaque_session) | binary(bro)'
    - name: verify stored history without live capture
      if: matrix.features == '' || matrix.features == 'core'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo nextest run -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --test acp_checkpoints --test daemon --build-jobs 2 --test-threads
        2 -E 'test(acp_trajectory::) | test(storage::acp_history::) | test(gateway::routing::blocks::) | test(core::evolution::) | binary(acp_checkpoints) | binary(daemon)'
    - name: verify headless ACP, capture and shared transcript behavior
      if: matrix.features == 'harness' || matrix.features == 'core,harness'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo nextest run -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib --test acp --test database_capture --build-jobs 2 --test-threads
        2 -E 'test(presentation::) | test(output::plain::) | test(text_presenter_tests) | test(agent_sessions::) | test(agent_api::) | test(commands::tests::) | test(onboarding::tests::)
        | test(acp_trajectory::live_tests::) | test(acp_trajectory::checkpoint::tests::live::) | test(harness::resources::mcp::) | test(harness::service::core_disabled_tests::)
        | test(harness::service::recovery::tests::baseline_) | test(harness::service::recovery::tests::historical::) | test(harness::agent::native::replay_tests::)
        | test(harness::acp::native::core_disabled_tests::) | test(harness::permission::) | test(harness::local::) | test(harness::result_contract::) | binary(acp)
        | binary(database_capture)'
    - name: verify scheduler acknowledgements and recovery without harness
      if: matrix.features == 'core'
      run: cargo nextest run --locked -p bitrouter --no-default-features --features core --test core_contract --test core_execution --build-jobs 2 --test-threads
        2
    - name: verify guarded drafts across core feature removal
      if: matrix.features == 'core'
      shell: bash
      run: |
        set -euo pipefail
        cargo test --locked -p bitrouter --no-default-features --features core \
          --lib --no-run --message-format=json > "$RUNNER_TEMP/tenancy-core.json"
        fixture_core_binary=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "bitrouter" and .profile.test and (.target.kind | index("lib")) and .executable != null) | .executable] | if length == 1 then .[0] else error("expected one core libtest") end' "$RUNNER_TEMP/tenancy-core.json")
        cp "$fixture_core_binary" "$RUNNER_TEMP/tenancy-core-test"
        cargo test --locked -p bitrouter --no-default-features \
          --lib --no-run --message-format=json > "$RUNNER_TEMP/tenancy-no-core.json"
        fixture_gateway_binary=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "bitrouter" and .profile.test and (.target.kind | index("lib")) and .executable != null) | .executable] | if length == 1 then .[0] else error("expected one gateway libtest") end' "$RUNNER_TEMP/tenancy-no-core.json")
        cp "$fixture_gateway_binary" "$RUNNER_TEMP/tenancy-no-core-test"
        BITROUTER_TEST_NO_CORE_LIBTEST="$RUNNER_TEMP/tenancy-no-core-test" \
          "$RUNNER_TEMP/tenancy-core-test" --exact \
          tenancy::tests::configuration::trajectory_features::producer::guarded_draft_cross_feature_transition \
          --ignored --nocapture
    - name: verify execution SDK against the headless service
      if: matrix.features == 'core,harness'
      run: cargo test -p bitrouter --no-default-features --features core,harness --test harness_sdk --jobs 2
    - name: verify database feature availability
      if: matrix.features == 'db-postgres' || matrix.features == 'db-mysql'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test feature_ingress
    - name: verify optional server tools
      if: matrix.features == 'server-tools' || matrix.features == 'mcp'
      env:
        PROFILE_FEATURES: ${{ matrix.features }}
      run: |
        cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --test feature_ingress
        cargo test -p bitrouter --no-default-features --features "$PROFILE_FEATURES" --lib server_tool
    - name: verify MCP discovery and process cleanup without harness
      if: matrix.features == 'mcp'
      run: cargo test -p bitrouter --no-default-features --features mcp --test harness_mcp_check --jobs 2 -- --test-threads=2
  test-paid-reduced-startup:
    name: paid reduced startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v6
    - name: add swap for the Linux lib test harness
      if: runner.os == 'Linux'
      run: |
        sudo fallocate --length 8G /swapfile-bitrouter
        sudo chmod 600 /swapfile-bitrouter
        sudo mkswap /swapfile-bitrouter
        sudo swapon /swapfile-bitrouter
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache-save-if: false
    - uses: taiki-e/install-action@nextest
    - name: compile and identify the three reduced consumers
      shell: bash
      run: |
        command -v jq
        artifacts="$RUNNER_TEMP/paid-reduced"
        mkdir -p "$artifacts"
        for profile in gateway core-only harness-only; do
          features=()
          case "$profile" in
            gateway) variable=BITROUTER_PAID_GATEWAY_LIBTEST ;;
            core-only) features=(--features core); variable=BITROUTER_PAID_CORE_LIBTEST ;;
            harness-only) features=(--features harness); variable=BITROUTER_PAID_HARNESS_LIBTEST ;;
          esac
          # Preserve artifact JSON while rendering compiler errors in the log.
          # https://doc.rust-lang.org/cargo/commands/cargo-build.html#display-options
          cargo test --locked -p bitrouter --lib --no-default-features \
            "${features[@]}" --no-run --message-format=json,json-render-diagnostics \
            > "$artifacts/$profile.jsonl"
          binary="$(jq -sr '
            [.[] | select(.reason == "compiler-artifact"
              and .target.name == "bitrouter" and .target.kind == ["lib"]
              and .profile.test == true and .executable != null)]
            | if length == 1 then .[0].executable else error("expected one reduced libtest") end
          ' "$artifacts/$profile.jsonl")"
          [[ "$binary" = /* && -x "$binary" ]]
          printf '%s=%s\n' "$variable" "$binary" >> "$GITHUB_ENV"
        done
    - name: compile the full producer and public parents
      run: cargo nextest run --locked -p bitrouter --all-features --lib --no-run -E 'test(tenancy::tests::learning_startup::driver::) | test(tenancy::tests::execution::native::session::experiment::paid::recovery::reduced::)'
    - name: verify both real sources with every reduced consumer
      timeout-minutes: 20
      shell: bash
      run: |
        for profile in gateway core_only harness_only; do
          for selector in \
            "tenancy::tests::learning_startup::driver::${profile}_refuses_pending_inactive_paid_draft" \
            "tenancy::tests::execution::native::session::experiment::paid::recovery::reduced::${profile}_refuses_stopped_native_paid_v4_with_clean_control"; do
            cargo nextest run --locked -p bitrouter --all-features --lib \
              --test-threads 1 --retries 0 --run-ignored only --no-tests fail \
              -E "test(=$selector)"
          done
        done
  artifact-profiles:
    name: artifact profiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 90 || 45 }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: preserve full, minimum and harness executables from the same revision
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/profile-full" "$RUNNER_TEMP/profile-gateway" "$RUNNER_TEMP/profile-harness"
        cargo build --locked -p bitrouter --bin bro --jobs 2
        cp target/debug/bro "$RUNNER_TEMP/profile-full/bro"
        cargo build --locked -p bitrouter --no-default-features --bin bro --jobs 2
        cp target/debug/bro "$RUNNER_TEMP/profile-gateway/bro"
        cargo build --locked -p bitrouter --no-default-features --features harness --bin bro --jobs 2
        cp target/debug/bro "$RUNNER_TEMP/profile-harness/bro"
    - name: verify real daemon profile transitions and artifact metadata
      shell: bash
      env:
        BITROUTER_TEST_FULL_BINARY: ${{ runner.temp }}/profile-full/bro
        BITROUTER_TEST_GATEWAY_BINARY: ${{ runner.temp }}/profile-gateway/bro
        BITROUTER_TEST_HARNESS_BINARY: ${{ runner.temp }}/profile-harness/bro
      run: |
        cargo test --locked -p bitrouter --no-default-features --jobs 2 --test artifact_build_metadata
        cargo test --locked -p bitrouter --no-default-features --jobs 2 --test artifact_profiles -- --ignored --test-threads=1
        # Core seeds published state and dispatches the original judge attempt.
        # Serving/replay requests use the preserved full/minimum binaries.
        cargo test --locked -p bitrouter --jobs 2 --test artifact_profiles gateway_state:: -- --ignored --test-threads=1
    - name: validate local measurement fixture and interruption cleanup
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/measurement-target
        BITROUTER_MEASUREMENT_TEST_BINARY: ${{ runner.temp }}/profile-gateway/bro
      run: |
        cargo fmt --manifest-path apps/bitrouter/tests/fixtures/gateway_measurements/Cargo.toml -- --check
        cargo test --locked --manifest-path apps/bitrouter/tests/fixtures/gateway_measurements/Cargo.toml --jobs 2
        cargo test --locked --manifest-path apps/bitrouter/tests/fixtures/gateway_measurements/Cargo.toml --jobs 2 --test cancellation -- --ignored --test-threads=1
        cargo clippy --locked --manifest-path apps/bitrouter/tests/fixtures/gateway_measurements/Cargo.toml --all-targets --jobs 2 -- -D warnings
  core-sdk:
    name: independent core SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: rustfmt, clippy
    - name: build and verify independent core consumer
      shell: bash
      run: |
        manifest=apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml
        cargo fmt --manifest-path "$manifest" -- --check
        cargo clippy --locked --manifest-path "$manifest" --features core --all-targets --target-dir target/sdk-consumer -- -D warnings
        cargo test --locked --manifest-path "$manifest" --features core --target-dir target/sdk-consumer
        cargo build --locked --manifest-path "$manifest" --features core --bin bitrouter-core-sdk-consumer --target-dir target/sdk-consumer
        cargo tree --locked --manifest-path "$manifest" --features core -e normal,build --prefix none > core-consumer-tree.txt
        if grep -Eq '^(bitrouter|axum|sea-orm|sea-orm-migration|sqlx[^ ]*|ratatui[^ ]*|crossterm|opentelemetry[^ ]*|agent-client-protocol[^ ]*|rmcp) v' core-consumer-tree.txt; then
          echo '::error::independent core consumer links a service implementation'; exit 1
        fi
    - name: run SDK harness against the official core-only process
      shell: bash
      run: |
        cargo build --locked -p bitrouter --no-default-features --features core --bin bro
        suffix=""
        if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix=".exe"; fi
        mkdir -p "$RUNNER_TEMP/core-sdk-artifact"
        cp "target/debug/bro$suffix" "$RUNNER_TEMP/core-sdk-artifact/bro$suffix"
        core_binary="$RUNNER_TEMP/core-sdk-artifact/bro$suffix"
        consumer_binary="$PWD/target/sdk-consumer/debug/bitrouter-core-sdk-consumer$suffix"
        if [[ "$RUNNER_OS" == 'Windows' ]]; then
          core_binary="$(cygpath -m "$core_binary")"
          consumer_binary="$(cygpath -m "$consumer_binary")"
        fi
        export BITROUTER_TEST_CORE_BINARY="$core_binary"
        export BITROUTER_TEST_CORE_SDK_CONSUMER_BINARY="$consumer_binary"
        export BITROUTER_TEST_EXPECTED_REVISION="$BITROUTER_BUILD_REVISION"
        cargo test --locked -p bitrouter --no-default-features --test core_sdk \
          independent_core_sdk_preserves_harness_authority -- --ignored --exact --nocapture
  packaged-gateway:
    uses: ./.github/workflows/gateway-artifacts.yml
    with:
      plan: '{"releases":[{"app_name":"bitrouter"}]}'
      cargo-profile: dev
    if: github.event_name != 'push'
  registry-live-lifecycle:
    name: live registry sync and host consumption
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      BITROUTER_TEST_DIST_HELPER_BINARY: ${{ github.workspace }}/target/debug/dist-helper
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: build the production registry producer
      run: cargo build --locked -p dist-helper --jobs 2
    - name: sync the public provider and route through its exact artifact
      env:
        BITROUTER_TEST_REGISTRY_EVIDENCE_DIR: ${{ runner.temp }}/registry-closed-loop
      run: cargo test --locked -p bitrouter --no-default-features --jobs 2 --test registry_lifecycle live_sync::provider_sync_artifact_is_consumed_by_official_host_and_routes_requests
        -- --ignored --exact --nocapture
    - name: preserve sync, byte identity and routing evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registry-provider-closed-loop
        path: ${{ runner.temp }}/registry-closed-loop
        if-no-files-found: warn
  public-library-boundaries:
    name: public-library-boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: verify final workspace membership
      run: |
        cargo metadata --no-deps --format-version 1 | jq -e '
          [.packages[].name] | sort ==
          ["bitrouter", "bitrouter-ai", "bitrouter-guardrails", "bitrouter-registry", "bitrouter-sdk", "dist-helper"]'
    - name: verify SDK without HTTP/2
      run: |
        # Check production before test dependencies can enable HTTP/2.
        cargo check --locked -p bitrouter-sdk --no-default-features --lib
        cargo check --locked -p bitrouter-sdk --no-default-features --features core --lib
        cargo test --locked -p bitrouter-sdk --no-default-features --test transport_protocol
    - name: contracts, registry and client build independently
      run: |
        cargo test -p bitrouter-registry --all-features
        cargo test -p bitrouter-ai
        cargo test -p bitrouter-ai --all-features
        cargo test -p bitrouter-sdk
        cargo test -p bitrouter-sdk --all-features
        cargo test -p bitrouter-guardrails --all-features
    - name: inspect isolated production dependency closures
      shell: bash
      run: |
        cargo check --locked -p bitrouter-ai --no-default-features --features axum --lib
        # Successful checks above prove package membership. Inspect forward
        # trees: an unknown inverted dependency must not count as evidence.
        for flags in '' '--no-default-features' '--all-features'; do
          cargo tree --locked -p bitrouter-ai $flags -e normal,build --prefix none > ai-tree.txt
          if [[ "$flags" != '--all-features' ]] && grep -Eq '^(axum|axum-core|hyper|hyper-util) v' ai-tree.txt; then
            echo '::error::default AI contracts pulled HTTP framework dependencies'; exit 1
          fi
          if grep -Eq '^(bitrouter(-sdk)?|reqwest|tokio(-[^ ]*)?|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' ai-tree.txt; then
            echo '::error::AI public contracts pulled runtime dependencies'; exit 1
          fi
          cargo tree --locked -p bitrouter-sdk $flags -e normal,build --prefix none > sdk-tree.txt
          if grep -Eq '^(bitrouter|axum|sea-orm(-[^ ]*)?|sqlx(-[^ ]*)?|ratatui(-[^ ]*)?|crossterm|opentelemetry[^ ]*|tracing-opentelemetry|agent-client-protocol[^ ]*|rmcp) v' sdk-tree.txt; then
            echo '::error::HTTP SDK pulled service, execution or UI dependencies'; exit 1
          fi
        done
        cargo tree --locked -p bitrouter-guardrails --all-features -e normal,build --prefix none > guardrails-tree.txt
        if grep -Eq '^(bitrouter(-sdk)?|axum|opentelemetry[^ ]*) v' guardrails-tree.txt; then
          echo '::error::matcher depends on its host implementation'; exit 1
        fi
        cargo tree --locked -p bitrouter -e normal,build --prefix none > host-tree.txt
        if grep -Eq '^bitrouter-guardrails v' host-tree.txt; then
          echo '::error::default bro links the optional matcher'; exit 1
        fi
    - name: preserve prehashed manifests in an independent SDK consumer
      run: |
        mkdir -p target/sdk-manifest-fidelity
        cargo run --locked -p bitrouter --no-default-features --features core \
          --example sdk_manifest_fixture > target/sdk-manifest-fidelity/manifest.json
        export BITROUTER_TEST_MANIFEST_FIXTURE="$PWD/target/sdk-manifest-fidelity/manifest.json"
        cargo test --locked \
