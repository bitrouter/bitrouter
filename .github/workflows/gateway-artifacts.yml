name: Gateway artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      cargo-profile:
        description: Use dev for pull-request acceptance, dist for release archives.
        default: dist
        type: string

permissions:
  contents: read

jobs:
  gateway:
    if: contains(fromJson(inputs.plan).releases.*.app_name, 'bitrouter')
    name: ${{ matrix.profile }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Include adds each native runner to both profile/target combinations.
        # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
        profile: [gateway, gateway-shared]
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-apple-darwin
            # Native Apple Silicon, matching cargo-dist's runner override.
            # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
      PACKAGE_DISTRIBUTION: ${{ matrix.profile }}
      PACKAGE_TARGET: ${{ matrix.target }}
      PACKAGE_PROFILE: ${{ inputs.cargo-profile }}
    steps:
      - name: Prepare native Linux arm builder
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential pkg-config jq
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select artifact directory
        shell: bash
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/gateway-artifacts
        run: printf 'PACKAGE_OUTPUT=%s\n' "$PACKAGE_OUTPUT" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package selected gateway distribution
        shell: bash
        run: |
          cargo run --locked -p dist-helper -- package --profile "$PACKAGE_DISTRIBUTION" \
            --target "$PACKAGE_TARGET" --cargo-profile "$PACKAGE_PROFILE" \
            --out "$PACKAGE_OUTPUT"
      - name: Verify archive and unpack candidate
        shell: bash
        run: |
          cd "$PACKAGE_OUTPUT"
          if command -v sha256sum >/dev/null; then
            sha256sum -c *.sha256
          else
            shasum -a 256 -c *.sha256
          fi
          mkdir unpacked
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath ("bitrouter-" + $env:PACKAGE_DISTRIBUTION + "-" + $env:PACKAGE_TARGET + ".zip") -DestinationPath unpacked'
          else
            tar -xzf "bitrouter-$PACKAGE_DISTRIBUTION-$PACKAGE_TARGET.tar.gz" -C unpacked
          fi
      - name: Verify packaged executable identity and binary digest
        shell: bash
        run: |
          suffix=""
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then suffix=".exe"; fi
          root="$PACKAGE_OUTPUT/unpacked/bitrouter-$PACKAGE_DISTRIBUTION-$PACKAGE_TARGET"
          candidate="$root/bro$suffix"
          "$candidate" --json build-info > "$PACKAGE_OUTPUT/build-info.json"
          features='[]'
          if [[ "$PACKAGE_DISTRIBUTION" == 'gateway-shared' ]]; then features='["db-postgres","multi-instance"]'; fi
          jq -e --arg profile "$PACKAGE_DISTRIBUTION" --arg target "$PACKAGE_TARGET" \
            --arg revision "$BITROUTER_BUILD_REVISION" --argjson features "$features" \
            '.profile == $profile and .target == $target and .source_revision == $revision and .features == $features' \
            "$PACKAGE_OUTPUT/build-info.json"
          jq -e --slurpfile actual "$PACKAGE_OUTPUT/build-info.json" \
            --arg binary "bro$suffix" '.identity == $actual[0] and .binary.path == $binary' "$root/manifest.json"
          # Hash binary stdin to avoid escaped Windows filenames. Compare in jq
          # so native Windows CRLF output cannot decorate the expected digest.
          # https://www.gnu.org/software/coreutils/manual/html_node/cksum-output-modes.html
          # https://jqlang.org/manual/#invoking-jq
          if command -v sha256sum >/dev/null; then
            digest="$(sha256sum -b < "$candidate" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 -b < "$candidate" | awk '{print $1}')"
          fi
          jq -e --arg digest "$digest" '.binary.sha256 == $digest' "$root/manifest.json"
      - name: Build independent SDK consumer and run packaged acceptance
        if: matrix.profile == 'gateway'
        shell: bash
        run: |
          consumer_manifest=apps/bitrouter/tests/fixtures/sdk_consumer/Cargo.toml
          cargo test --locked --manifest-path "$consumer_manifest" --target-dir target/sdk-consumer
          cargo build --locked --manifest-path "$consumer_manifest" --target-dir target/sdk-consumer
          suffix=""
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then suffix=".exe"; fi
          gateway_binary="$PACKAGE_OUTPUT/unpacked/bitrouter-gateway-$PACKAGE_TARGET/bro$suffix"
          consumer_binary="$PWD/target/sdk-consumer/debug/bitrouter-packaged-sdk-consumer$suffix"
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then
            gateway_binary="$(cygpath -m "$gateway_binary")"
            consumer_binary="$(cygpath -m "$consumer_binary")"
          fi
          export BITROUTER_TEST_GATEWAY_BINARY="$gateway_binary"
          export BITROUTER_TEST_SDK_CONSUMER_BINARY="$consumer_binary"
          cargo test --locked -p bitrouter --no-default-features --test packaged_gateway \
            packaged_gateway_independent_sdk_consumer -- --ignored --exact --nocapture
      - name: Upload verified gateway archives
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.profile }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/gateway-artifacts/*.tar.gz
            ${{ runner.temp }}/gateway-artifacts/*.zip
            ${{ runner.temp }}/gateway-artifacts/*.sha256

  shared-postgres-processes:
    name: packaged shared gateway (PostgreSQL processes)
    needs: gateway
    if: contains(fromJson(inputs.plan).releases.*.app_name, 'bitrouter')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      BITROUTER_BUILD_REVISION: ${{ github.sha }}
      BITROUTER_TEST_DATABASE_URL: postgres://fixture:fixture-password@127.0.0.1:5432/bitrouter_shared_test
    # The official image creates this disposable superuser with CREATEDB. The
    # blank-database campaigns create/drop only their UUID-owned databases.
    # https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services/creating-postgresql-service-containers
    # https://hub.docker.com/_/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: bitrouter_shared_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d bitrouter_shared_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select isolated shared test build directory
        # runner context is unavailable in job-level env; use a runner step.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
        shell: bash
        run: printf 'CARGO_TARGET_DIR=%s/shared-gateway-tests\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v7
        with:
          name: artifacts-gateway-shared-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/shared-gateway-package
      - name: Unpack the already verified shared artifact
        shell: bash
        run: |
          cd "$RUNNER_TEMP/shared-gateway-package"
          sha256sum -c *.sha256
          mkdir unpacked
          tar -xzf bitrouter-gateway-shared-x86_64-unknown-linux-gnu.tar.gz -C unpacked
          candidate="$PWD/unpacked/bitrouter-gateway-shared-x86_64-unknown-linux-gnu/bro"
          "$candidate" --json build-info > build-info.json
          jq -e --slurpfile actual build-info.json \
            --arg revision "$BITROUTER_BUILD_REVISION" \
            '.identity == $actual[0] and .identity.profile == "gateway-shared" and .identity.features == ["db-postgres", "multi-instance"] and .identity.source_revision == $revision' \
            unpacked/bitrouter-gateway-shared-x86_64-unknown-linux-gnu/manifest.json
          printf 'BITROUTER_TEST_GATEWAY_BINARY=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Validate shared distribution contracts and updater boundaries
        shell: bash
        run: |
          cargo test --locked -p dist-helper distribution::tests
          cargo test --locked -p bitrouter-ai --all-features --test artifact_contracts
          cargo test --locked -p bitrouter --no-default-features --features multi-instance --test artifact_build_metadata
          cargo nextest run --locked -p bitrouter --no-default-features --features multi-instance --lib --test-threads 2 \
            -E 'test(update::tests::) | test(upgrade::tests::) | test(output::reports::artifact::tests::)'
      - name: Run actual shared PostgreSQL process campaigns against the archive
        shell: bash
        run: |
          # The test executable may compile, but the child bro always comes from
          # the archive above; no workspace debug binary is substituted.
          cargo nextest run --locked -p bitrouter --no-default-features --features multi-instance \
            --lib --run-ignored only --test-threads 2 \
            -E 'test(gateway::shared::runtime::process_tests::)'
      - name: Run shared PostgreSQL authority and persistence regressions
        shell: bash
        run: |
          # Include the native-continuation and writer-isolation modules, while
          # keeping external-adapter acceptance and the process suite separate.
          cargo nextest run --locked -p bitrouter --all-features --lib \
            --run-ignored only --test-threads 2 --retries 0 \
            -E '(test(gateway::shared::) & not test(gateway::shared::runtime::process_tests::)) | test(continuation::shared::) | test(assemble::writers_tests::shared::)'
