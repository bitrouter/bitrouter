name: Registry Publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry/**
      - dist/registry/v1/**
      - apps/bitrouter/registry-dist/**
      - crates/bitrouter-registry/**
      - helpers/dist-helper/**
      - .github/workflows/registry-publish.yml

permissions:
  contents: write

concurrency:
  group: registry-v1-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare candidate with its publication targets
        id: plan
        run: |
          candidate=dist/registry/v1/registry.json
          revision="$(jq -er '.spec_revision | strings' "$candidate")"
          [[ "$revision" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          previous="$RUNNER_TEMP/registry-previous.json"
          previous_default="$RUNNER_TEMP/registry-previous-default.json"
          publish_default=true
          published=refs/remotes/origin/registry-v1
          if git show-ref --verify --quiet "$published"; then
            if git cat-file -e "$published:dist/registry/v1/$revision/registry.json" 2>/dev/null; then
              git show "$published:dist/registry/v1/$revision/registry.json" > "$previous"
            fi
            if git cat-file -e "$published:$candidate" 2>/dev/null; then
              git show "$published:$candidate" > "$previous_default"
              prior="$(jq -er '.spec_revision | strings' "$previous_default")"
              if [[ "${prior%%+*}" != *-* && "${revision%%+*}" == *-* ]]; then
                publish_default=false
              fi
            fi
          fi
          printf 'revision=%s\npublish_default=%s\n' "$revision" "$publish_default" >> "$GITHUB_OUTPUT"
          if cmp -s "$candidate" "$previous" &&
             { [[ "$publish_default" == false ]] || cmp -s "$candidate" "$previous_default"; }; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Registry artifact already matches every publication target."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.plan.outputs.changed == 'true'

      - name: Audit the exact final candidate afresh
        if: steps.plan.outputs.changed == 'true'
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/registry-previous.json" ]; then
            args+=(--previous "$RUNNER_TEMP/registry-previous.json")
          fi
          if [[ "${REVISION%%+*}" != *-* ]] && [ -f "$RUNNER_TEMP/registry-previous-default.json" ]; then
            args+=(--previous "$RUNNER_TEMP/registry-previous-default.json")
          fi
          cargo run -p dist-helper -- registry audit --report target/registry-publication.json "${args[@]}"
          expected="$(jq -er '.audit.output_sha256' target/registry-publication.json)"
          actual="$(sha256sum dist/registry/v1/registry.json | cut -d' ' -f1)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain -- registry dist/registry apps/bitrouter/registry-dist)"

      - name: Preserve exact public identity evidence
        if: always() && steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-final-publication-audit
          path: |
            target/registry-publication.json
            target/registry-identity-response.json
          if-no-files-found: warn

      - name: Promote admitted bytes while preserving older revisions
        if: steps.plan.outputs.changed == 'true'
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
          PUBLISH_DEFAULT: ${{ steps.plan.outputs.publish_default }}
        run: |
          tree="$RUNNER_TEMP/registry-promoted"
          if git show-ref --verify --quiet refs/remotes/origin/registry-v1; then
            git worktree add --detach "$tree" origin/registry-v1
          else
            git worktree add --detach "$tree" HEAD
            git -C "$tree" switch --orphan registry-v1
          fi
          mkdir -p "$tree/dist/registry/v1/$REVISION"
          cp dist/registry/v1/registry.json "$tree/dist/registry/v1/$REVISION/registry.json"
          if [ "$PUBLISH_DEFAULT" = true ]; then
            cp dist/registry/v1/registry.json "$tree/dist/registry/v1/registry.json"
          fi
          git -C "$tree" add dist/registry/v1
          if git -C "$tree" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tree" config user.name 'bitrouter-automation[bot]'
          git -C "$tree" config user.email '267229870+bitrouter-automation[bot]@users.noreply.github.com'
          git -C "$tree" commit -m "chore: publish registry $REVISION" -m "Source commit: $GITHUB_SHA"
          git -C "$tree" push origin HEAD:refs/heads/registry-v1
