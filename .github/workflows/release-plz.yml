name: Release-plz

on:
  push:
    branches:
      - main

jobs:

  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    needs: release-plz-release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      # Two edits release-plz cannot make itself, in one commit on its branch:
      #   1. Fold `.changes/*.md` into the section release-plz just generated,
      #      so the release reads as curated prose with the commit list below
      #      it, then delete the consumed change files.
      #   2. Bump the config schema `$id` to the version being released.
      - name: Fold change files and bump schema $id
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(echo "$RELEASE_PR" | jq -r '.head_branch // empty')
          [ -z "$branch" ] && exit 0
          git fetch origin "$branch"
          git checkout "$branch"
          cargo run -p dist-helper -- changelog fold
          cargo run -p dist-helper -- generate-schema
          git add -A CHANGELOG.md .changes dist/schema/bitrouter.config.schema.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): fold change files and update schema \$id"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$branch"
