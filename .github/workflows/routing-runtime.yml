name: Routing runtime
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  routing:
    name: routing runtime (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - name: gateway
          features: ''
        - name: semantic
          features: semantic-routing
        - name: inference
          features: inference-routing
        - name: combined
          features: semantic-routing,inference-routing
        - name: heterogeneous
          features: heterogeneous
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.99.1
        cache-on-failure: false
        cache-key: routing-runtime-${{ matrix.name }}
    - name: Verify routing processes with matching prebuilt fixtures
      shell: bash
      env:
        ROUTING_MODE: ${{ matrix.features }}
        XDG_DATA_HOME: ${{ runner.temp }}/routing-data
      run: |
        set -euo pipefail
        unset CLAUDE_CODE_OAUTH_TOKEN
        mkdir -p ci-evidence
        bash .github/scripts/test-routing-runtime.sh "$ROUTING_MODE" 2>&1 | tee ci-evidence/routing-runtime.log
    - name: Upload routing evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: routing-runtime-${{ matrix.name }}-attempt-${{ github.run_attempt }}
        path: ci-evidence/
        retention-days: 7
