name: Registry Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    name: sync and audit Registry v1
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Stage feeds and audit the complete candidate
        id: sync
        continue-on-error: true
        env:
          OPENAI_REGISTRY_API_KEY: ${{ secrets.OPENAI_REGISTRY_API_KEY }}
          ANTHROPIC_REGISTRY_API_KEY: ${{ secrets.ANTHROPIC_REGISTRY_API_KEY }}
          BITROUTER_REGISTRY_API_KEY: ${{ secrets.BITROUTER_REGISTRY_API_KEY }}
        run: cargo run -p dist-helper -- registry sync --write --report target/registry-sync.json

      - name: Preserve public evidence and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-publication-audit
          path: |
            target/registry-sync.json
            target/registry-identity-response.json
          if-no-files-found: warn

      - name: Check publication admission
        if: always()
        id: gate
        run: |
          if [ -f target/registry-sync.json ] && jq -e '.audit.outcome == "passed"' target/registry-sync.json > /dev/null; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate complete independent changes
        if: steps.gate.outputs.passed == 'true'
        id: build
        run: |
          cargo run -p dist-helper -- registry validate
          cargo run -p dist-helper -- registry build --check
          cargo run -p dist-helper -- check

      - name: Propose validated independent updates
        if: steps.gate.outputs.passed == 'true' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: automation/registry-sync
        run: |
          if git diff --quiet -- registry dist/registry apps/bitrouter/registry-dist; then
            echo "registry source and artifacts are unchanged"
            exit 0
          fi
          jq -r '"Refresh Registry v1 from explicitly configured provider feeds.\n\nIdentity audit: " + .audit.outcome + "\n\nRequired feed outcomes:\n" + ([.feeds[] | "- " + .provider + "/" + .feed + ": " + .outcome] | join("\n")) + "\n\nThe complete JSON report and public identity response are attached to the workflow run."' target/registry-sync.json > "$RUNNER_TEMP/registry-sync-pr.md"
          git config user.name "bitrouter-automation[bot]"
          git config user.email "267229870+bitrouter-automation[bot]@users.noreply.github.com"
          git add registry dist/registry apps/bitrouter/registry-dist
          git commit -m "chore: sync registry catalog"
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi
          pr_number="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: sync registry catalog" --body-file "$RUNNER_TEMP/registry-sync-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: sync registry catalog" --body-file "$RUNNER_TEMP/registry-sync-pr.md"
          fi

      - name: Report required feed or global admission failures
        if: always()
        run: |
          if [ '${{ steps.sync.outcome }}' != 'success' ] || [ '${{ steps.gate.outputs.passed }}' != 'true' ] || [ '${{ steps.build.outcome }}' != 'success' ]; then
            echo '::error::Registry sync failed; inspect its sanitized audit report. Valid independent updates were proposed only after global admission.'
            exit 1
          fi
