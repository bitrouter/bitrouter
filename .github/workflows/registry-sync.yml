name: Registry Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    name: sync and audit Registry v1
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Stage feeds and audit the complete candidate
        id: sync
        continue-on-error: true
        env:
          ALIBABA_REGISTRY_API_KEY: ${{ secrets.ALIBABA_REGISTRY_API_KEY }}
          CEREBRAS_REGISTRY_API_KEY: ${{ secrets.CEREBRAS_REGISTRY_API_KEY }}
          DEEPSEEK_REGISTRY_API_KEY: ${{ secrets.DEEPSEEK_REGISTRY_API_KEY }}
          GMICLOUD_REGISTRY_API_KEY: ${{ secrets.GMICLOUD_REGISTRY_API_KEY }}
          GEMINI_REGISTRY_API_KEY: ${{ secrets.GEMINI_REGISTRY_API_KEY }}
          MINIMAX_REGISTRY_API_KEY: ${{ secrets.MINIMAX_REGISTRY_API_KEY }}
          MOONSHOTAI_REGISTRY_API_KEY: ${{ secrets.MOONSHOTAI_REGISTRY_API_KEY }}
          TENCENT_REGISTRY_API_KEY: ${{ secrets.TENCENT_REGISTRY_API_KEY }}
          XAI_REGISTRY_API_KEY: ${{ secrets.XAI_REGISTRY_API_KEY }}
          XIAOMI_REGISTRY_API_KEY: ${{ secrets.XIAOMI_REGISTRY_API_KEY }}
          ZAI_REGISTRY_API_KEY: ${{ secrets.ZAI_REGISTRY_API_KEY }}
        run: cargo run -p dist-helper -- registry sync --write --propose-identity-repairs --report target/registry-sync.json

      - name: Preserve public evidence and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-publication-audit
          path: |
            target/registry-sync.json
            target/registry-identity-response.json
          if-no-files-found: warn

      - name: Check publication admission
        if: always()
        id: gate
        run: |
          if [ -f target/registry-sync.json ] && jq -e '.audit.outcome == "passed"' target/registry-sync.json > /dev/null; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize canonical identity repairs for review
        if: always()
        run: |
          if [ -f target/registry-sync.json ]; then
            jq -r '
              (.identity_repairs // []) as $repairs
              | [.audit.mismatches[]? | select(.code == "canonical_id_not_found")] as $missing
              | select(($repairs | length) + ($missing | length) > 0)
              | "### Canonical identity review\n",
                "Review the missing references below against the attached public catalog.",
                "Repair candidates require human review before merging. Verify any replacement identity separately.\n",
                ($repairs[] | "- Proposed \(.kind | @json) for \(.canonical_id | @json)"
                  + if has("provider") then " at provider \(.provider | @json), native ID \(.provider_model_id | @json)" else "" end),
                ($missing[] | if has("provider") then
                  "- Unresolved provider \(.provider | @json), native ID \(.provider_model_id | @json)"
                else
                  "- Unresolved curated ID \(.canonical_id | @json)"
                end)
            ' target/registry-sync.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate complete independent changes
        if: steps.gate.outputs.passed == 'true'
        id: build
        run: |
          cargo run -p dist-helper -- registry validate
          cargo run -p dist-helper -- registry build --check
          cargo run -p dist-helper -- check

      - name: Propose validated independent updates
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.passed == 'true' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: automation/registry-sync
        run: |
          if git diff --quiet -- registry dist/registry apps/bitrouter/registry-dist; then
            echo "registry source and artifacts are unchanged"
            exit 0
          fi
          jq -r '
            "Refresh Registry v1 from explicitly configured provider feeds.\n\nIdentity audit: " + .audit.outcome
            + "\n\nIdentity repair proposals requiring human review:\n"
            + ([.identity_repairs[] | "- " + (.kind | @json) + " for " + (.canonical_id | @json)
                + if has("provider") then " at provider " + (.provider | @json) + ", native ID " + (.provider_model_id | @json) else "" end] | join("\n"))
            + "\n\nRepairs retain native offers and ledger history. Verify any same-model replacement separately."
            + "\n\nRequired feed outcomes:\n"
            + ([.feeds[] | "- " + .provider + "/" + .feed + ": " + .outcome] | join("\n"))
            + "\n\nThe complete JSON report and public identity response are attached to the workflow run."
          ' target/registry-sync.json > "$RUNNER_TEMP/registry-sync-pr.md"
          title="chore: sync registry catalog"
          draft_args=()
          pr="$(gh pr list --head "$BRANCH" --json number,isDraft --jq '.[0] // {}')"
          pr_number="$(jq -r '.number // empty' <<< "$pr")"
          if jq -e '.identity_repairs | length > 0' target/registry-sync.json > /dev/null; then
            title="chore: review registry identity repairs"
            draft_args=(--draft)
            # Convert before pushing repairs onto a previously ready PR.
            # https://cli.github.com/manual/gh_pr_ready
            if [ -n "$pr_number" ] && [ "$(jq -r '.isDraft' <<< "$pr")" = false ]; then
              gh pr ready "$pr_number" --undo
            fi
          fi
          git config user.name "bitrouter-automation[bot]"
          git config user.email "267229870+bitrouter-automation[bot]@users.noreply.github.com"
          git add registry dist/registry apps/bitrouter/registry-dist
          git commit -m "chore: sync registry catalog"
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file "$RUNNER_TEMP/registry-sync-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/registry-sync-pr.md" "${draft_args[@]}"
          fi

      - name: Report required feed or global admission failures
        if: always()
        run: |
          if [ '${{ steps.sync.outcome }}' != 'success' ] || [ '${{ steps.gate.outputs.passed }}' != 'true' ] || [ '${{ steps.build.outcome }}' != 'success' ]; then
            echo '::error::Registry sync failed; inspect its sanitized audit report.'
            exit 1
          fi
