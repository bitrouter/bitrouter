name: Download test artifacts
description: Verify the artifacts for this revision and prevent test-time Cargo builds.
inputs:
  product:
    description: Suite owning the nextest archive (service or bro)
    required: true
  platform:
    description: Runner label used to build the artifacts
    required: true
  bro-companion:
    description: Download the Linux BRO executable for the gateway process test
    default: 'false'
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - uses: actions/download-artifact@v4
      with:
        name: tests-${{ inputs.product }}-${{ inputs.platform }}-${{ github.sha }}
        path: ci-artifacts
    - uses: actions/download-artifact@v4
      if: inputs.bro-companion == 'true'
      with:
        name: tests-bro-companion-${{ github.sha }}
        path: ci-companion
    - name: Verify the test artifacts
      env:
        BRO_COMPANION: ${{ inputs.bro-companion }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(cat ci-artifacts/tests.sha)" = "$GITHUB_SHA"
        test "$(cat ci-artifacts/tests.workspace)" = "$GITHUB_WORKSPACE"
        if [[ "$RUNNER_OS" == macOS ]]; then
          (cd ci-artifacts && shasum -a 256 -c checksums.sha256)
        else
          (cd ci-artifacts && sha256sum -c checksums.sha256)
        fi
        if [[ "$BRO_COMPANION" == true ]]; then
          (cd ci-companion && sha256sum -c checksums.sha256)
          chmod +x ci-companion/bro ci-artifacts/native-ap-sdk-consumer
          ci-companion/bro build-info | jq -e --arg sha "$GITHUB_SHA" '
            .product == "bitrouter-bro" and .source_revision == $sha'
          printf 'BITROUTER_TEST_BRO=%s\n' "$GITHUB_WORKSPACE/ci-companion/bro" >> "$GITHUB_ENV"
        fi
        # Keep rustc available for BRO's coding judge, which compiles temporary
        # programs as test behavior. Prevent consumers from rebuilding crates.
        blocker="$RUNNER_TEMP/ci-no-build"
        if [[ "$RUNNER_OS" == Windows ]]; then blocker="$(cygpath -u "$blocker")"; fi
        mkdir -p "$blocker"
        printf '#!/bin/sh\necho "CI test consumers must use prebuilt artifacts" >&2\nexit 97\n' > "$blocker/cargo"
        printf '@echo CI test consumers must use prebuilt artifacts >&2\r\n@exit /b 97\r\n' > "$blocker/cargo.cmd"
        chmod +x "$blocker/cargo"
        if [[ "$RUNNER_OS" == Windows ]]; then blocker="$(cygpath -w "$blocker")"; fi
        printf '%s\n' "$blocker" >> "$GITHUB_PATH"
