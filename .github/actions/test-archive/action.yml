name: Restore Linux test artifacts
description: Restore the exact build for this revision without running Cargo.
inputs:
  product:
    description: Product owning the nextest metadata (service, service-process or bro)
    default: service
  companion:
    description: Restore the BRO executable and ACP adapter alongside the service suite
    default: 'false'
runs:
  using: composite
  steps:
    - name: Reclaim unused Android SDK before restoring tests
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-evidence
        df -Pk "$GITHUB_WORKSPACE" | tee ci-evidence/disk-before-restore.txt
        # These consumers run prebuilt Rust tests, with no Android targets.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
        if [[ -d /usr/local/lib/android && ! -L /usr/local/lib/android ]]; then
          sudo du -sh -- /usr/local/lib/android | tee ci-evidence/preinstalled-cleanup.txt
          sudo rm -rf -- /usr/local/lib/android
        fi
        df -Pk "$GITHUB_WORKSPACE" | tee ci-evidence/disk-after-cleanup.txt
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.114
    - uses: actions/download-artifact@v4
      with:
        name: linux-tests-${{ inputs.product }}-${{ github.sha }}
        path: .ci-archive
    - uses: actions/download-artifact@v4
      if: inputs.companion == 'true'
      with:
        name: linux-tests-bro-${{ github.sha }}
        path: .ci-bro
    - name: Verify and extract the test build
      env:
        PRODUCT: ${{ inputs.product }}
        COMPANION: ${{ inputs.companion }}
      shell: bash
      run: |
        set -euo pipefail
        verify() {
          test "$(cat "$1/tests.sha")" = "$GITHUB_SHA"
          test "$(cat "$1/tests.workspace")" = "$GITHUB_WORKSPACE"
          (cd "$1" && sha256sum -c tests.tar.zst.sha256)
        }
        verify .ci-archive
        mkdir -p ci-evidence
        /usr/bin/time -v -o ci-evidence/extract.txt tar --zstd -xf .ci-archive/tests.tar.zst
        case "$PRODUCT" in
          service|service-process)
            target/debug/bitrouter build-info | jq -e --arg sha "$GITHUB_SHA" '
              .product == "bitrouter" and .source_revision == $sha'
            echo "BITROUTER_TEST_GATEWAY_BINARY=$PWD/target/debug/bitrouter" >> "$GITHUB_ENV"
            ;;
          bro) ;;
          *) exit 1 ;;
        esac
        if [[ "$COMPANION" == true ]]; then
          [[ "$PRODUCT" == service || "$PRODUCT" == service-process ]]
          verify .ci-bro
          # Retain the service nextest metadata when joining independent builds.
          tar --zstd -xf .ci-bro/tests.tar.zst target/debug/bro target/debug/examples/bro_acp_fixture
        fi
        if [[ "$PRODUCT" == bro || "$COMPANION" == true ]]; then
          target/debug/bro build-info | jq -e --arg sha "$GITHUB_SHA" '
            .product == "bitrouter-bro" and .source_revision == $sha'
          test -x target/debug/examples/bro_acp_fixture
          echo "BITROUTER_TEST_BRO=$PWD/target/debug/bro" >> "$GITHUB_ENV"
        fi
        printf '%s\n' "BITROUTER_TEST_PREBUILT_ONLY=1" \
          "BITROUTER_TEST_EXAMPLES_DIR=$PWD/target/debug/examples" >> "$GITHUB_ENV"
        # A consumer must never silently turn a missing artifact into a rebuild.
        # Keep rustc available: the coding judge verifies tiny temporary Rust
        # programs as its behavior, without building any workspace crate.
        mkdir -p "$RUNNER_TEMP/ci-no-build"
        printf '#!/bin/sh\necho "CI test consumers must use prebuilt artifacts" >&2\nexit 97\n' > "$RUNNER_TEMP/ci-no-build/cargo"
        chmod +x "$RUNNER_TEMP/ci-no-build/cargo"
        printf '%s\n' "$RUNNER_TEMP/ci-no-build" >> "$GITHUB_PATH"
