[package]
name = "bitrouter-orchestrator"
description = "BRO native coding runtime and external agent orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
http.workspace = true
process-wrap = { workspace = true, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
rmcp.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64.workspace = true
bitrouter-sdk.workspace = true
bitrouter-ai.workspace = true
futures.workspace = true
globset.workspace = true
hex.workspace = true
ignore.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
shell-words.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
url.workspace = true

# External-agent ACP controller, client and process transport. Native runtime
# consumers do not need the conductor's trace viewer and HTTP server.
agent-client-protocol = { workspace = true, optional = true }
agent-client-protocol-schema = { workspace = true, optional = true }
agent-client-protocol-conductor = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tokio-stream = { workspace = true, features = ["sync"], optional = true }

[features]
default = []
acp = [
    "dep:agent-client-protocol",
    "dep:agent-client-protocol-schema",
    "dep:agent-client-protocol-conductor",
    "dep:anyhow",
    "dep:tokio-stream",
    "tokio/rt-multi-thread",
    "tokio-util/compat",
]

[dev-dependencies]
bitrouter-sdk = { workspace = true, features = ["config_file"] }
reqwest.workspace = true
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
