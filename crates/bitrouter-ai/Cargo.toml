[package]
name = "bitrouter-ai"
description = "BitRouter model integration semantics independent of router and application state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
hosted = ["dep:chrono"]
pkce = ["dep:rand", "tokio/net", "tokio/io-util"]
hosted-login = ["hosted", "dep:rand"]
file-store = []

[dependencies]
chrono = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

futures.workspace = true
futures-core.workspace = true
async-stream.workspace = true
eventsource-stream.workspace = true
httpdate.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "rt", "time"] }
tokio-util = { workspace = true, features = ["rt"] }


[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time"] }
