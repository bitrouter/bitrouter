[package]
name = "bitrouter-ai"
description = "Lightweight public contracts shared by BitRouter products"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["public-api-deps.txt"]

[[example]]
name = "policy_schema"
required-features = ["schema"]

[[example]]
name = "eval_schema"
required-features = ["schema"]

[features]
default = []
# Public contract schemas without a service/runtime dependency.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
# Managed pricing evidence must retain its finite f64 bits in SDK-only builds,
# independently of the application's feature unification.
# https://github.com/serde-rs/json/blob/v1.0.150/tests/test.rs
# Prehashed manifests also require nested JSON object order to survive a public
# contract round trip without the application's preserve_order feature.
# Raw numeric tokens let tenancy integers accept exact 1.0/1e0 without rounding
# a fractional or out-of-range token into an authority revision.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order", "raw_value"] }
thiserror.workspace = true
sha2.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
jsonschema = { version = "0.47.0", default-features = false }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
toml.workspace = true
