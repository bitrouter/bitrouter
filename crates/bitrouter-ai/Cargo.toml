[package]
name = "bitrouter-ai"
description = "Lightweight public contracts for BitRouter clients and extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["public-api-deps.txt"]

[features]
default = []
# Pure observation-schema helpers for exporter conformance suites.
testing = []
# Public contract schemas without a service/runtime dependency.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
# Managed pricing evidence must retain its finite f64 bits in SDK-only builds,
# independently of the application's feature unification.
# https://github.com/serde-rs/json/blob/v1.0.150/tests/test.rs
# Prehashed manifests also require nested JSON object order to survive a public
# contract round trip without the application's preserve_order feature.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
thiserror.workspace = true
schemars = { workspace = true, optional = true }
