[package]
name = "bitrouter-sdk"
description = "HTTP client for the BitRouter service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# CI artifacts for the `sdk-public-api` job, not crate content: consumers who
# download the crate have no use for the public-dependency manifest or its
# toolchain pins.
exclude = ["public-api-deps.txt", "public-api.pins"]

[dependencies]
bitrouter-ai.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
