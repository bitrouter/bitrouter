[package]
name = "bitrouter-sdk"
description = "BitRouter SDK: per-protocol pipelines, hook traits, provider adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# CI artifacts for the `sdk-public-api` job, not crate content: consumers who
# download the crate have no use for the public-dependency manifest or its
# toolchain pins.
#
# `span-schema.json` is deliberately NOT on this list even though it is
# generated the same way. It is the interop surface itself — the declaration a
# deployment implements when it renders BitRouter's telemetry, whether through
# `bitrouter-telemetry`'s OTLP exporter or anything else — so it ships with the
# crate.
exclude = ["public-api-deps.txt", "public-api.pins"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
futures-core.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# `rt` feature: `tokio_util::task::TaskTracker`, used to run non-streaming
# requests to completion after a client disconnect (see `Pipeline::execute_detached`).
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
http.workspace = true
httpdate.workspace = true
pin-project-lite.workspace = true
async-stream.workspace = true
reqwest.workspace = true
url.workspace = true
eventsource-stream.workspace = true
uuid.workspace = true
schemars.workspace = true
base64.workspace = true

# `server` feature
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
# `config_file` feature
serde-saphyr = { workspace = true, optional = true }

# `acp` feature — typed ACP schema payloads (PromptRequest / PromptResponse / …)
agent-client-protocol-schema = { workspace = true, optional = true }
# `acp` feature — the ACP SDK proper: the `Agent`/`Client` roles, connection
# builders, and stdio transport the live thin proxy (`acp::up` / `acp::down`)
# drives. Only the runtime needs it; the pure-routing pipeline does not.
agent-client-protocol = { workspace = true, optional = true }
# `acp-controller` feature — the official connection-level conductor. It lazily
# builds the agent/proxy chain from the manager's initialize request and
# forwards unhandled ACP traffic bidirectionally, which is the controller
# kernel. NOT on `acp`: it depends on `agent-client-protocol-trace-viewer`,
# which depends on `axum` non-optionally, so putting it on `acp` made every
# consumer wanting ACP *routing* link an HTTP server. See the feature comment
# below.
agent-client-protocol-conductor = { workspace = true, optional = true }
# `acp` feature — the proxy's stream/compat glue: `BroadcastStream` for the
# fan-out planes and `tokio_util::compat` to hand the child's tokio pipes to
# the futures-io based ACP SDK.
tokio-stream = { workspace = true, features = ["sync"], optional = true }
# `acp` feature — the ACP runtime's error type. The routing pipeline uses
# `BitrouterError`; the session engine surfaces process/handshake failures,
# which are contextual chains rather than gateway status codes.
anyhow = { workspace = true, optional = true }

# `mcp` feature — official Rust MCP SDK.
# <https://github.com/modelcontextprotocol/rust-sdk>
rmcp = { workspace = true, optional = true }

[features]
default = []
# axum HTTP server + SSE handlers + admin endpoints.
server = ["dep:axum", "dep:tower", "tokio/signal"]
# yaml config loading (serde-saphyr + tokio::fs)
config_file = ["dep:serde-saphyr", "tokio/fs"]
# rmcp-backed `RmcpExecutor` + `ConfigMcpRoutingTable` for the `mcp`
# pure-routing pipeline. Without this feature the SDK still exposes
# `mcp::Pipeline`, hook traits, and the `McpTransport` enum, so a consumer
# can plug in a custom Executor without pulling rmcp.
mcp = ["dep:rmcp", "tokio/process"]
# The ACP thin proxy: `ConfigAcpRoutingTable` for the pure-routing pipeline
# plus the live runtime (`acp::up`/`engine`/`down`) that drives one agent
# child as one session. Without this feature the SDK still exposes the
# `AcpTransport` enum, `AcpTarget`, and the `RoutingTable` trait, so a
# consumer can wire ACP routing without pulling the ACP SDK in.
acp = [
    "dep:agent-client-protocol-schema",
    "dep:agent-client-protocol",
    "dep:tokio-stream",
    "dep:anyhow",
    "dep:rustix",
    "tokio/process",
    "tokio/io-util",
    "tokio/rt-multi-thread",
    "tokio-util/compat",
]

# The connection-level ACP controller (`acp::controller`) — one manager
# connection fronting many harness-owned sessions. Split out of `acp` rather
# than folded into it, because it is the only thing in the crate that needs
# `agent-client-protocol-conductor`, and that crate depends on
# `agent-client-protocol-trace-viewer`, which depends on `axum`
# **non-optionally** with no feature to turn it off.
#
# Folded in, it made `acp` — documented as "the ACP thin proxy … plus the live
# runtime" — drag a whole HTTP server behind it, so a consumer enabling ACP for
# pure routing linked axum. `helpers/dist-helper` was doing exactly that. The
# split restores what `acp` claims to be; `feature-isolation` guards it.
acp-controller = ["acp", "dep:agent-client-protocol-conductor"]

[target.'cfg(unix)'.dependencies]
# `acp` feature — safe `killpg(2)` for reaping an agent child's whole process
# group when the ACP SDK's own child guard is not enough. `rustix` rather than
# `libc` because this crate is `#![forbid(unsafe_code)]`.
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "time",
    "rt-multi-thread",
    "test-util",
] }
# `acp` runtime tests launch stub agents in throwaway working directories.
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
