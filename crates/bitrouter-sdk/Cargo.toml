[package]
name = "bitrouter-sdk"
description = "BitRouter SDK: per-protocol pipelines, hook traits, provider adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# CI artifacts for the `sdk-public-api` job, not crate content: consumers who
# download the crate have no use for the public-dependency manifest or its
# toolchain pins.
exclude = ["public-api-deps.txt", "public-api.pins"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
futures-core.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# `rt` feature: `tokio_util::task::TaskTracker`, used to run non-streaming
# requests to completion after a client disconnect (see `Pipeline::execute_detached`).
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
http.workspace = true
httpdate.workspace = true
pin-project-lite.workspace = true
async-stream.workspace = true
reqwest.workspace = true
url.workspace = true
eventsource-stream.workspace = true
uuid.workspace = true
schemars.workspace = true
base64.workspace = true

# `server` feature
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

# `config_file` feature
serde-saphyr = { workspace = true, optional = true }

# `acp` feature — typed ACP schema payloads (PromptRequest / PromptResponse / …)
agent-client-protocol-schema = { workspace = true, optional = true }
# `acp` feature — the ACP SDK proper: the `Agent`/`Client` roles, connection
# builders, and stdio transport the live thin proxy (`acp::up` / `acp::down`)
# drives. Only the runtime needs it; the pure-routing pipeline does not.
agent-client-protocol = { workspace = true, optional = true }
# `acp` feature — the proxy's stream/compat glue: `BroadcastStream` for the
# fan-out planes and `tokio_util::compat` to hand the child's tokio pipes to
# the futures-io based ACP SDK.
tokio-stream = { workspace = true, features = ["sync"], optional = true }
# `acp` feature — the ACP runtime's error type. The routing pipeline uses
# `BitrouterError`; the session engine surfaces process/handshake failures,
# which are contextual chains rather than gateway status codes.
anyhow = { workspace = true, optional = true }

# `mcp` feature — official Rust MCP SDK.
# <https://github.com/modelcontextprotocol/rust-sdk>
rmcp = { workspace = true, optional = true }

# ===== `otel` features =====
# OpenTelemetry stack for OTLP export (traces + metrics). Every version pin,
# feature set, and rationale lives in the root `[workspace.dependencies]` —
# the 0.32.x line has to move as one piece, so it is declared in one place.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
# The `otel-http` / `otel-grpc` features below layer the wire transport onto
# this bare `trace` + `metrics` base.
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
# Custom OTLP/HTTP client that injects a freshly-resolved bearer per export
# (`otel::auth_client`). Only compiled under `otel-http`. `reqwest` itself is
# already a non-optional SDK dependency.
opentelemetry-http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# OTLP/gRPC transport (tonic). Only compiled under `otel-grpc`.
tonic = { workspace = true, optional = true }

# NOT the workspace pin: that carries `env-filter`, which drags matchers /
# regex-automata / regex-syntax in. `otel::subscriber` needs only LookupSpan.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
# NOT the workspace pin: that carries `features = ["trace"]`, which the weak
# `tower-http?/trace` on `server` exists to gate. Already in the SDK's tree via
# reqwest, so this activation costs zero new crates.
tower-http = { version = "0.6", default-features = false, optional = true }

[features]
default = []
# axum HTTP server + SSE handlers + admin endpoints. The weak
# `tower-http?/trace` activates tower-http's `trace` feature *only if*
# `dep:tower-http` was already activated (by `__otel-core`) — it never pulls
# tower-http in on its own. That feature intersection is what lets
# `otel::http_layer` (the axum router wrapper) be gated on
# `all(__otel-core, server)` while `otel::subscriber` stays axum-free.
server = ["dep:axum", "dep:tower", "tokio/signal", "tower-http?/trace"]
# yaml config loading (serde-saphyr + tokio::fs)
config_file = ["dep:serde-saphyr", "tokio/fs"]
# rmcp-backed `RmcpExecutor` + `ConfigMcpRoutingTable` for the `mcp`
# pure-routing pipeline. Without this feature the SDK still exposes
# `mcp::Pipeline`, hook traits, and the `McpTransport` enum, so a consumer
# can plug in a custom Executor without pulling rmcp.
mcp = ["dep:rmcp", "tokio/process"]
# The ACP thin proxy: `ConfigAcpRoutingTable` for the pure-routing pipeline
# plus the live runtime (`acp::up`/`engine`/`down`) that drives one agent
# child as one session. Without this feature the SDK still exposes the
# `AcpTransport` enum, `AcpTarget`, and the `RoutingTable` trait, so a
# consumer can wire ACP routing without pulling the ACP SDK in.
acp = [
    "dep:agent-client-protocol-schema",
    "dep:agent-client-protocol",
    "dep:tokio-stream",
    "dep:anyhow",
    "dep:rustix",
    "tokio/process",
    "tokio/io-util",
    "tokio/rt-multi-thread",
    "tokio-util/compat",
]

# OTLP export of the SDK's own span/metric model: the public entry point.
# Always builds — it selects the default transport.
otel = ["otel-http"]

# OTLP/HTTP + protobuf transport over reqwest with rustls. Maps to upstream
# `opentelemetry-otlp/{http-proto,reqwest-client,reqwest-rustls}`. The
# `dep:opentelemetry-http` / `dep:bytes` entries pull in the custom
# `AuthRefreshClient` (`otel::auth_client`) that injects a live bearer per
# export — HTTP-only, since the cloud/default telemetry path is OTLP/HTTP.
otel-http = [
    "__otel-core",
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-client",
    "opentelemetry-otlp/reqwest-rustls",
    "dep:opentelemetry-http",
    "dep:bytes",
]

# OTLP/gRPC transport over tonic with rustls (native trust roots). Maps to
# upstream `opentelemetry-otlp/{grpc-tonic,tls-roots}`. May be enabled
# alongside `otel-http` (e.g. under `--all-features`); when both are present,
# HTTP takes runtime precedence (see `otel::transport`).
otel-grpc = [
    "__otel-core",
    "dep:tonic",
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/tls-roots",
]

# Private carrier: the transport-agnostic stack. Never enable directly — it is
# a compile error without a transport (see lib.rs).
__otel-core = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:dashmap",
    "dep:tower-http",
]

[target.'cfg(unix)'.dependencies]
# `acp` feature — safe `killpg(2)` for reaping an agent child's whole process
# group when the ACP SDK's own child guard is not enough. `rustix` rather than
# `libc` because this crate is `#![forbid(unsafe_code)]`.
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "time",
    "rt-multi-thread",
    "test-util",
] }
# `acp` runtime tests launch stub agents in throwaway working directories.
tempfile.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }

# Run with `--features otel-http,config_file`, not `otel-http` alone:
# `cargo bench` also builds the lib-test target, which has a pre-existing
# unguarded `use crate::config::PromptOverrides;` in a `#[cfg(test)]` block in
# `language_model/context.rs` and fails to compile without `config_file`.
# `required-features` cannot express this — it gates the bench target only.
[[bench]]
name = "observe_overhead"
harness = false
required-features = ["otel-http"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
