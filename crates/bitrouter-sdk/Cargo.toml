[package]
name = "bitrouter-sdk"
description = "HTTP client for the BitRouter service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# CI artifacts for the `sdk-public-api` job, not crate content: consumers who
# download the crate have no use for the public-dependency manifest or its
# toolchain pins.
exclude = ["public-api-deps.txt", "public-api.pins"]

[features]
default = ["http2"]
# HTTP transport only; cleartext HTTP/2 requires explicit prior knowledge.
http2 = ["reqwest/http2"]
# Client transport only; this does not enable the application's scheduler.
core = ["dep:tokio-tungstenite", "futures-util/sink"]

[dependencies]
bitrouter-ai.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid.workspace = true
url.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
bitrouter-ai = { workspace = true, features = ["axum"] }
flate2 = "1"
axum.workspace = true
bytes.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
