[package]
name = "bitrouter-sdk"
description = "BitRouter SDK: per-protocol pipelines, hook traits, provider adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
futures-core.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# `rt` feature: `tokio_util::task::TaskTracker`, used to run non-streaming
# requests to completion after a client disconnect (see `Pipeline::execute_detached`).
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
http.workspace = true
httpdate.workspace = true
pin-project-lite.workspace = true
async-stream.workspace = true
reqwest.workspace = true
url.workspace = true
eventsource-stream.workspace = true
uuid.workspace = true
schemars.workspace = true
base64.workspace = true

# `server` feature
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

# `config_file` feature
serde-saphyr = { workspace = true, optional = true }

# `acp` feature — typed ACP schema payloads (PromptRequest / PromptResponse / …)
agent-client-protocol-schema = { workspace = true, optional = true }
# `acp` feature — the ACP SDK proper: the `Agent`/`Client` roles, connection
# builders, and stdio transport the live thin proxy (`acp::up` / `acp::down`)
# drives. Only the runtime needs it; the pure-routing pipeline does not.
agent-client-protocol = { workspace = true, optional = true }
# `acp` feature — the proxy's stream/compat glue: `BroadcastStream` for the
# fan-out planes and `tokio_util::compat` to hand the child's tokio pipes to
# the futures-io based ACP SDK.
tokio-stream = { workspace = true, features = ["sync"], optional = true }
# `acp` feature — the ACP runtime's error type. The routing pipeline uses
# `BitrouterError`; the session engine surfaces process/handshake failures,
# which are contextual chains rather than gateway status codes.
anyhow = { workspace = true, optional = true }

# `mcp` feature — official Rust MCP SDK.
# <https://github.com/modelcontextprotocol/rust-sdk>
rmcp = { workspace = true, optional = true }

[features]
default = []
# axum HTTP server + SSE handlers + admin endpoints
server = ["dep:axum", "dep:tower", "tokio/signal"]
# yaml config loading (serde-saphyr + tokio::fs)
config_file = ["dep:serde-saphyr", "tokio/fs"]
# rmcp-backed `RmcpExecutor` + `ConfigMcpRoutingTable` for the `mcp`
# pure-routing pipeline. Without this feature the SDK still exposes
# `mcp::Pipeline`, hook traits, and the `McpTransport` enum, so a consumer
# can plug in a custom Executor without pulling rmcp.
mcp = ["dep:rmcp", "tokio/process"]
# The ACP thin proxy: `ConfigAcpRoutingTable` for the pure-routing pipeline
# plus the live runtime (`acp::up`/`engine`/`down`) that drives one agent
# child as one session. Without this feature the SDK still exposes the
# `AcpTransport` enum, `AcpTarget`, and the `RoutingTable` trait, so a
# consumer can wire ACP routing without pulling the ACP SDK in.
acp = [
    "dep:agent-client-protocol-schema",
    "dep:agent-client-protocol",
    "dep:tokio-stream",
    "dep:anyhow",
    "dep:rustix",
    "tokio/process",
    "tokio/io-util",
    "tokio/rt-multi-thread",
    "tokio-util/compat",
]

[target.'cfg(unix)'.dependencies]
# `acp` feature — safe `killpg(2)` for reaping an agent child's whole process
# group when the ACP SDK's own child guard is not enough. `rustix` rather than
# `libc` because this crate is `#![forbid(unsafe_code)]`.
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "time",
    "rt-multi-thread",
    "test-util",
] }
# `acp` runtime tests launch stub agents in throwaway working directories.
tempfile.workspace = true
