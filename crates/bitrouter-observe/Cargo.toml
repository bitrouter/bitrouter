[package]
name = "bitrouter-observe"
description = "BitRouter observability plugin: OTLP traces and metrics with multi-tenant attribution"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bitrouter-sdk.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# OpenTelemetry stack for OTLP export (traces + metrics). Every version pin,
# feature set, and rationale lives in the root `[workspace.dependencies]` —
# the 0.32.x line has to move as one piece, so it is declared in one place.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
# The `otel-http` / `otel-grpc` features below layer the wire transport onto
# this bare `trace` + `metrics` base.
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# Inbound HTTP TraceLayer for the SERVER span. Inherits the workspace
# pin (0.7) with the `trace` feature.
# https://docs.rs/tower-http/latest/tower_http/trace/index.html
tower-http = { workspace = true, optional = true }
# axum is the host's HTTP framework; we wrap its Router with the TraceLayer.
axum = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
futures-core = { version = "0.3", optional = true }
http = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
# OTLP/gRPC transport (tonic). Only compiled under `otel-grpc`.
tonic = { workspace = true, optional = true }
# Custom OTLP/HTTP client that injects a freshly-resolved bearer per export
# (`otel::auth_client`). Only compiled under `otel-http`.
opentelemetry-http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
default = []

# Shared, transport-agnostic observability stack: span exporter, metrics,
# inbound HTTP TraceLayer, and the tracing↔OTel bridge — everything except the
# OTLP wire transport. It carries no transport on its own, so enabling it
# WITHOUT `otel-http` or `otel-grpc` is a compile error (see `lib.rs`). Pick a
# transport feature below; each pulls this in automatically.
otel-base = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tower-http",
    "dep:axum",
    "dep:tracing-subscriber",
    "dep:tokio",
    "dep:futures-core",
    "dep:http",
    "dep:dashmap",
]

# OTLP/HTTP + protobuf transport over reqwest with rustls. Maps to upstream
# `opentelemetry-otlp/{http-proto,reqwest-client,reqwest-rustls}`. The
# `dep:opentelemetry-http` / `dep:reqwest` / `dep:bytes` entries pull in the
# custom `AuthRefreshClient` (`otel::auth_client`) that injects a live bearer
# per export — HTTP-only, since the cloud/default telemetry path is OTLP/HTTP.
otel-http = [
    "otel-base",
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-client",
    "opentelemetry-otlp/reqwest-rustls",
    "dep:opentelemetry-http",
    "dep:reqwest",
    "dep:bytes",
]

# OTLP/gRPC transport over tonic with rustls (native trust roots). Maps to
# upstream `opentelemetry-otlp/{grpc-tonic,tls-roots}`. May be enabled
# alongside `otel-http` (e.g. under `--all-features`); when both are present,
# HTTP takes runtime precedence (see `otel::transport`).
otel-grpc = [
    "otel-base",
    "dep:tonic",
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/tls-roots",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
futures.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "observe_overhead"
harness = false
required-features = ["otel-http"]
