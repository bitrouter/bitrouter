# OpenRouter model catalog API:
# https://openrouter.ai/docs/api/api-reference/models/get-models
source_url: https://openrouter.ai/api/v1/models
retain_versions: 2
deprecation_days: 30
# Explicit retirements override discovery while upstream catalogs still list a
# model. Keep the reason beside each tombstone so it can be revisited safely.
retired_models:
  # Retired after repeated provider-side health failures (bitrouter/bitrouter#873).
  - minimax/minimax-m2.5
families:
  - key: anthropic/claude/opus
    pattern: '^anthropic/claude-opus-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
    retain_versions: 4
  - key: anthropic/claude/{series}
    pattern: '^anthropic/claude-(?P<series>fable|haiku|sonnet)-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: deepseek/deepseek-v
    pattern: '^deepseek/deepseek-v(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
    retain_versions: 2
    exclude_variants:
      - '-exp$'
  - key: google/gemini
    pattern: '^google/gemini-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
    retain_versions: 4
    exclude_variants:
      - '(?:^|-)preview(?:-|$)'
  - key: minimax/minimax-m
    pattern: '^minimax/minimax-m(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: moonshotai/kimi-k
    pattern: '^moonshotai/kimi-k(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: openai/gpt
    pattern: '^openai/gpt-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: qwen/qwen
    pattern: '^qwen/qwen(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
    exclude_variants:
      - '(?:^|-)preview(?:-|$)'
  - key: x-ai/grok
    pattern: '^x-ai/grok-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
    retain_versions: 4
  - key: x-ai/grok-build
    pattern: '^x-ai/grok-build-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: xiaomi/mimo-v
    pattern: '^xiaomi/mimo-v(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
  - key: z-ai/glm
    pattern: '^z-ai/glm-(?P<version>[0-9]+(?:\.[0-9]+)*)(?P<variant>v?(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$'
