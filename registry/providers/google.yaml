name: google
display_name: Google Gemini
metadata:
  headquarters: US
  name: Google
  privacy_policy_url: https://policies.google.com/privacy
  slug: google
  status_page_url: https://status.cloud.google.com
  terms_of_service_url: https://ai.google.dev/gemini-api/terms
kind: first_party
api_protocol:
  - "*": openai
protocol_endpoints:
  openai: https://generativelanguage.googleapis.com/v1beta/openai
rate_limits:
  - "*":
      requests_per_minute: 60
models:
  - id: google/gemini-3.5-flash
    compatibility:
      chat_completions:
        google_extensions: true
        supports_store: false
    provider_model_id: gemini-3.5-flash
    reasoning_effort: &gemini_35_flash_effort
      levels: [minimal, low, medium, high]
      default: medium
    pricing:
      input_tokens:
        no_cache: 1.5
        cache_read: 0.15
      output_tokens:
        text: 9
    capabilities:
      - reasoning
      - tools
  # Official pricing: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.6-flash
  - id: google/gemini-3.6-flash
    compatibility:
      chat_completions:
        google_extensions: true
        supports_store: false
    provider_model_id: gemini-3.6-flash
    pricing:
      input_tokens:
        no_cache: 1.5
        cache_read: 0.15
      output_tokens:
        text: 7.5
    capabilities:
      - reasoning
      - tools
  - id: google/gemini-2.5-pro-preview
    compatibility:
      chat_completions:
        google_extensions: true
        supports_store: false
    provider_model_id: gemini-2.5-pro
    pricing:
      input_tokens:
        no_cache: 1.25
        cache_read: 0.125
      output_tokens:
        text: 10
    capabilities:
      - reasoning
      - tools
    deprecation_date: 2026-08-03
  - id: google/gemini-3.7-flash
    compatibility:
      chat_completions:
        google_extensions: true
        supports_store: false
    provider_model_id: gemini-3.7-flash
    pricing:
      input_tokens:
        no_cache: 0.75
        cache_read: 0.075
      output_tokens:
        text: 3.75
  # Initial complete Chat workflow uses the model in Google's compatibility guide.
  # Runtime/provider execution evidence is tracked in the retirement progress.
  - id: google/gemini-3.8-flash
    capabilities: [reasoning, tools, image_input, structured_outputs]
    reasoning_effort: *gemini_35_flash_effort
    compatibility:
      chat_completions:
        google_extensions: true
        supports_store: false
    provider_model_id: gemini-3.8-flash
    pricing:
      input_tokens:
        no_cache: 0.75
        cache_read: 0.075
      output_tokens:
        text: 3.75
status: active
weight: 1
submitted_at: 2026-05-25
api_base: https://generativelanguage.googleapis.com/v1beta/openai
