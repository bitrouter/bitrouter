  terms_of_service_url: https://ai.google.dev/gemini-api/terms
kind: first_party
api_protocol:
  - "*": [google, openai]
protocol_endpoints:
  openai: https://generativelanguage.googleapis.com/v1beta/openai
rate_limits:
  - "*":
      requests_per_minute: 60
models:
  - id: google/gemini-3.1-pro-preview
    provider_model_id: gemini-3.1-pro-preview
    reasoning_effort: &gemini_31_pro_effort
      levels: [low, medium, high]
      default: high
    pricing:
      input_tokens:
        no_cache: 2
        cache_read: 0.2
      output_tokens:
        text: 12
    capabilities:
      - reasoning
      - tools
  - id: google/gemini-3.5-flash
    provider_model_id: gemini-3.5-flash
    reasoning_effort: &gemini_35_flash_effort
      levels: [minimal, low, medium, high]
      default: medium
