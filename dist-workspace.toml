[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# The release workflow validates packaged identities and guards installer replacements.
allow-dirty = ["ci"]
# Build each product using only its own Cargo features.
precise-builds = true
# CI backends to support
ci = "github"
# The release workflow applies packaging/guard-installers.mjs to the global
# build manifest before uploading shell and PowerShell installers.
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "bitrouter/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Publish Homebrew and npm for prerelease tags on the `1.0.0-beta.*` line.
publish-prereleases = true
# Whether to install an updater program
install-updater = false
# Whether dist should create a Github Release or use an existing draft
create-release = false
# cargo-dist owns the bitrouter and bitrouter-bro installers and receipts.
# Reduced service variants are manual archives with matching-profile upgrades.
# https://axodotdev.github.io/cargo-dist/book/ci/customizing.html#custom-jobs
local-artifacts-jobs = ["./gateway-artifacts"]

# Use the same native Apple Silicon runner for every macOS distribution.
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# https://axodotdev.github.io/cargo-dist/book/reference/config.html#github-custom-runners
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
