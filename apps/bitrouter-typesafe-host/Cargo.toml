[package]
name = "bitrouter-typesafe-host"
description = "Opt-in native TypeSafe evaluation host for BitRouter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bro-typesafe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bitrouter = { path = "../bitrouter", version = "=1.0.0-alpha.32" }
bitrouter-sdk = { workspace = true, features = ["server", "config_file"] }
bitrouter-typesafe-extension = { path = "../../crates/bitrouter-typesafe-extension", version = "=1.0.0-alpha.32" }
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
