[package]
name = "bitrouter"
description = "BitRouter: an LLM API router. CLI + assembly library."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "bitrouter"
path = "src/lib.rs"

[[bin]]
name = "bitrouter"
path = "src/main.rs"

[dependencies]
bitrouter-sdk = { workspace = true, features = ["server", "config_file", "mcp", "acp"] }
bitrouter-cloud-sdk.workspace = true
bitrouter-providers = { workspace = true, features = ["pkce"] }
bitrouter-guardrails.workspace = true
bitrouter-observe = { workspace = true, features = ["otel-http"] }
bitrouter-mcp = { path = "../../crates/bitrouter-mcp", version = "1.0.0-alpha.27" }
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true
ring.workspace = true
base64.workspace = true
rand.workspace = true
hex.workspace = true
uuid = { workspace = true }
serde-saphyr.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
erased-serde = "0.4"
async-trait.workspace = true
reqwest.workspace = true
anyhow = "1"
tempfile.workspace = true
thiserror.workspace = true
http.workspace = true
axum.workspace = true
futures.workspace = true
agent-client-protocol.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
semver = "1"
# The live view (`bitrouter status --watch`). Not behind a cargo feature: a
# flag on a documented command that sometimes isn't compiled in costs more
# confusion than the build time it saves (OBSERVABILITY_TUI_SPEC §6).
bitrouter-tui = { path = "../../crates/bitrouter-tui", version = "=1.0.0-alpha.27" }
ratatui.workspace = true
crossterm.workspace = true
jsonschema = { version = "0.47.0", default-features = false }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true

[target.'cfg(windows)'.dependencies]
atomicwrites.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
axum-test = "21"
http.workspace = true
serde-saphyr.workspace = true
# OTLP/HTTP+protobuf decoding for full-stack tests that inspect the trace
# bodies the observe plugin pushes to the configured collector.
# https://docs.rs/opentelemetry-proto/0.32/
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
