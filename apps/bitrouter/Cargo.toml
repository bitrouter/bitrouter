[package]
name = "bitrouter"
description = "BitRouter model gateway, routing service and operator CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["registry-dist/agents.json", "registry-dist/runtimes.json"]

[lib]
name = "bitrouter"
path = "src/lib.rs"

[[bin]]
name = "bitrouter"
path = "src/main.rs"

[features]
default = ["eval-publication", "mcp", "server-tools", "otel-http", "db-postgres", "db-mysql", "http2"]
# The same JSON/SSE API over HTTP/2, including cleartext private-network ingress.
http2 = ["axum/http2", "reqwest/http2", "bitrouter-sdk/http2", "dep:h2"]
# Publish gateway trajectory evidence to the Eval ledger.
eval-publication = []
mcp = ["dep:rmcp", "dep:process-wrap"]
server-tools = ["mcp"]
guardrails = ["dep:bitrouter-guardrails"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
multi-instance = ["db-postgres", "dep:bytes"]

otel = ["otel-http"]
otel-http = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:dashmap",
    "dep:opentelemetry-http",
    "dep:bytes",
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-client",
    "opentelemetry-otlp/reqwest-rustls",
]
otel-grpc = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:dashmap",
    "dep:tonic",
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/tls-roots",
]

[dependencies]
bitrouter-skills.workspace = true
bitrouter-update.workspace = true
registry-json.workspace = true
bitrouter-registry.workspace = true
num-rational = "0.4"
num-traits = "0.2"
bitrouter-sdk.workspace = true
async-stream.workspace = true
eventsource-stream.workspace = true
httpdate.workspace = true
tower.workspace = true
bytes = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures-core.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
pin-project-lite.workspace = true
tonic = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Optional MCP client and request-local server transports.
process-wrap = { workspace = true, optional = true, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
rmcp = { workspace = true, optional = true }
regex.workspace = true
bitrouter-guardrails = { workspace = true, optional = true }
bitrouter-ai = { workspace = true, features = ["schema", "axum"] }
# Product-only OS keyring discovery for explicitly adopted external CLI sessions.
keyring.workspace = true
chrono.workspace = true
sha2.workspace = true
shell-words.workspace = true
hmac.workspace = true
ring.workspace = true
subtle.workspace = true
base64.workspace = true
zstd = { version = "0.13", default-features = false }
rand.workspace = true
hex.workspace = true
uuid = { workspace = true }
serde-saphyr.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
# Reviewed policies and persisted experiment digests require exact f64 round trips.
# https://github.com/serde-rs/json/blob/master/src/de.rs
# Persisted JSON fingerprints also retain the full product's insertion order.
# Keep it explicit: optional ACP dependencies must not select storage semantics.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
toml.workspace = true
erased-serde = "0.4"
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true
fluent-uri.workspace = true
anyhow = "1"
tempfile.workspace = true
thiserror.workspace = true
http.workspace = true
axum = { workspace = true, features = ["ws"] }
http-body.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
h2 = { version = "0.4.15", optional = true }
hyper-util = { workspace = true, features = ["tokio"] }
futures.workspace = true
tokio-util = { workspace = true, features = ["compat", "rt"] }
semver = "1"
schemars.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
atomicwrites.workspace = true
winapi-util = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "event", "termios", "fs"] }

[build-dependencies]
bitrouter-build.workspace = true
# Reads committed registry artifacts and generates service build metadata.
serde_json.workspace = true
sha2.workspace = true
# Derives artifact capabilities from this package's manifest, including archives.
toml.workspace = true

[dev-dependencies]
bitrouter-build.workspace = true
bitrouter-ai = { workspace = true, features = ["testing"] }
criterion = { version = "0.8", features = ["async_tokio"] }
tonic = { workspace = true, features = ["server", "router"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.29"
rmcp.workspace = true
bitrouter-guardrails = { path = "../../extensions/regex-checker/matcher" }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
axum-test = "21"
http.workspace = true
serde-saphyr.workspace = true
# OTLP/HTTP+protobuf decoding for full-stack tests that inspect the trace
# bodies the observe plugin pushes to the configured collector. Pins live in
# the root `[workspace.dependencies]` alongside the rest of the 0.32.x stack.
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "metrics"] }
prost.workspace = true
# Real-terminal acceptance coverage: the process under test must see a PTY,
# while the test controls its size, input bytes, output, and child lifetime.
portable-pty = "0.9"

[[test]]
name = "observe_hierarchy"
required-features = ["otel-http"]

[[test]]
name = "telemetry_ingress_log_target"
required-features = ["otel-http"]

[[test]]
name = "telemetry_grpc_transport"
required-features = ["otel-grpc"]

[[bench]]
name = "observe_overhead"
harness = false
required-features = ["otel-http"]

[[test]]
name = "policy_eval_control_plane"

[[example]]
name = "legacy_guardrails"
required-features = ["guardrails"]

[[test]]
name = "harness_mcp_check"
required-features = ["mcp"]
