[package]
name = "bitrouter"
description = "BitRouter: an LLM API router. CLI + assembly library."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "bitrouter"
path = "src/lib.rs"

[[bin]]
name = "bitrouter"
path = "src/main.rs"

[dependencies]
bitrouter-sdk = { workspace = true, features = ["server", "config_file", "mcp", "acp"] }
# `server`: the inbound ingress SERVER span, which wraps the SDK router this
# binary serves. A deployment that builds its own ingress span takes
# `otel-http` alone.
bitrouter-telemetry = { workspace = true, features = ["otel-http", "server"] }
bitrouter-providers = { workspace = true, features = ["hosted", "pkce"] }
bitrouter-guardrails.workspace = true
bitrouter-mcp = { path = "../../crates/bitrouter-mcp", version = "1.0.0-alpha.27" }
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true
ring.workspace = true
base64.workspace = true
rand.workspace = true
hex.workspace = true
uuid = { workspace = true }
serde-saphyr.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
erased-serde = "0.4"
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true
anyhow = "1"
tempfile.workspace = true
thiserror.workspace = true
http.workspace = true
axum.workspace = true
futures.workspace = true
agent-client-protocol.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
semver = "1"
# Everything drawn by this binary. There is deliberately no `ratatui` here:
# the app may touch the terminal but may not draw on it, and the absence of the
# dependency is what makes that a compile error rather than a convention.
bitrouter-tui = { path = "../../crates/bitrouter-tui", version = "=1.0.0-alpha.27" }
# Terminal *I/O*, which is this process's: owning stdin, bracketed paste, and
# reading key events for `bitrouter chat`. Not drawing — see above.
crossterm.workspace = true
jsonschema = { version = "0.47.0", default-features = false }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true

[target.'cfg(windows)'.dependencies]
atomicwrites.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
axum-test = "21"
http.workspace = true
serde-saphyr.workspace = true
# OTLP/HTTP+protobuf decoding for full-stack tests that inspect the trace
# bodies the observe plugin pushes to the configured collector. Pins live in
# the root `[workspace.dependencies]` alongside the rest of the 0.32.x stack.
opentelemetry-proto.workspace = true
prost.workspace = true
