[package]
name = "bitrouter-packaged-sdk-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Deliberately resolve independently of application dev-dependency features.
[workspace]
resolver = "3"

[features]
default = []
core = ["bitrouter-sdk/core", "dep:base64", "dep:sha2"]

[[bin]]
name = "bitrouter-core-sdk-consumer"
path = "src/bin/core.rs"
required-features = ["core"]

[dependencies]
bitrouter-sdk = { path = "../../../../../crates/bitrouter-sdk", default-features = false }
bitrouter-ai = { path = "../../../../../crates/bitrouter-ai", default-features = false }
anyhow = "1"
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "net", "sync"] }
