[package]
name = "bitrouter-p0-transcript-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bitrouter-tui = { path = "../../../../../../../bitrouter-baseline/crates/bitrouter-tui" }
agent-client-protocol-schema = { version = "=1.10.2", features = ["unstable_llm_providers", "unstable_session_fork", "unstable_protocol_v2"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
ratatui = { version = "=0.29.0", default-features = false }

[profile.dev]
debug = 0
incremental = false
