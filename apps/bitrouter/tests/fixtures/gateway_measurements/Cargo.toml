[package]
name = "bitrouter-gateway-measurements"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process", "signal"] }
wiremock = "0.6"
