[package]
name = "bitrouter-evaluation-host"
description = "Opt-in native evaluation host for BitRouter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bro-evaluate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bitrouter = { path = "../bitrouter", version = "=1.0.0-alpha.33" }
bitrouter-sdk = { workspace = true, features = ["server", "config_file"] }
bitrouter-system-one-format = { path = "../../extensions/system-one/format", version = "=1.0.0-alpha.33" }
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
