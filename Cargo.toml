[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "helpers/*"]

[workspace.package]
version = "1.0.0-alpha.27"
edition = "2024"
license = "Apache-2.0"
authors = ["Archer <archer@bitrouter.ai>"]
repository = "https://github.com/bitrouter/bitrouter"
# MSRV — a recent compiler floor verified against the full workspace.
# The `msrv` CI job pins this exact version; current stable is tested by the
# rest of CI. The resolved dependency graph itself requires Rust 1.89.
rust-version = "1.93"

[workspace.dependencies]
# Cross-platform OS keyring reader (macOS Keychain / Linux Secret Service /
# Windows Credential Manager). Used to import the Antigravity `agy` CLI session,
# which stores its Google OAuth token in the OS keyring. The Linux backend is
# `async-secret-service` (pure-Rust zbus — avoids the C `libdbus-1-dev` system
# dependency `sync-secret-service` would pull) driven by `async-io`'s block-on
# (independent of tokio, so the sync `Entry` API is safe to call from bitrouter's
# async CLI); `crypto-rust` keeps the session crypto dependency-light.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

# internal crates
bitrouter-sdk = { path = "crates/bitrouter-sdk", version = "1.0.0-alpha.27", default-features = false }
bitrouter-providers = { path = "crates/bitrouter-providers", version = "1.0.0-alpha.27" }
bitrouter-guardrails = { path = "crates/bitrouter-guardrails", version = "1.0.0-alpha.27" }

# Safe syscall wrappers. Used by the SDK's `acp` runtime for `killpg(2)`;
# `libc` would need an `unsafe` block, and `bitrouter-sdk` forbids unsafe code.
rustix = { version = "1", default-features = false }

# ACP SDK crates
agent-client-protocol = "1.2"
# Shared by `bitrouter status --watch` (in the app) and `bitrouter-tui` (the
# ACP session renderer), so the version lives here rather than in either.
ratatui = { version = "0.29", features = [
    # Paragraph::line_count — wrap-aware tail-follow needs the rendered
    # height, not the logical line count.
    "unstable-rendered-line-info",
] }
crossterm = { version = "0.28", features = ["event-stream"] }
# The line diff behind `bitrouter-tui`'s hunked diff rendering. A dependency
# rather than a hand-rolled diff because subtly wrong diff output is worse than
# a dependency, and hunk grouping with context is exactly where the subtle
# wrongness would live — see TUI_RENDERER_PLAN §C.1 (§19.2).
similar = "3.1"
# The display width of a grapheme cluster, for `bitrouter-tui`'s own wrap.
# Ratatui's `reflow` is private, so the wrap is ours — but the widths must be
# the same ones ratatui measures with, which is why this tracks the version
# ratatui itself depends on. Adds no crate to the build graph.
unicode-width = "0.2"
# `unstable_llm_providers` gives the `providers/*` schema types. The runtime
# crate (1.2) does not forward that feature, so the two methods are dispatched
# as raw JSON-RPC over these types — see ACP_TUI_SPEC §10. NOT
# `unstable_protocol_v2`: v2 inverts the turn lifecycle this engine implements.
agent-client-protocol-schema = { version = "1.4", features = ["unstable_llm_providers"] }

# shared third-party
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
futures-core = "0.3"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
# Response-body wrapper for `otel::http_layer`, which holds the ingress SERVER
# span open until the body is drained or dropped. Already in the tree via axum,
# so this activation costs zero new crates.
http-body = "1"
httpdate = "1"
pin-project-lite = "0.2"
async-stream = "0.3"

# http server (sdk `server` feature)
axum = { version = "0.8", features = ["json"] }
tower = "0.5"

# http client
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "query",
    "stream",
    "rustls",
] }
eventsource-stream = "0.2"
url = "2"

# OpenTelemetry stack for OTLP export (traces + metrics).
#
# Pinned to 0.32.x — the API churns minor-to-minor in this stack, and the
# crates are not independently versionable in practice: a partial bump would
# resolve two semver-incompatible `opentelemetry` crates into one graph, so
# spans built against one would not reach an exporter built against the other.
# Declared here, in one place, so the whole line moves together and no consumer
# can pin a different minor on its own.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = [
    "rt-tokio-current-thread",
    "trace",
    "metrics",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
] }
# Transport features (`http-proto`, `grpc-tonic`, the reqwest/tonic TLS
# variants) are NOT enabled here — they are layered on by the consuming crate's
# own `otel-http` / `otel-grpc` features. `default-features = false` drops the
# upstream defaults (`grpc-tonic`, `logs`, `internal-logs`) so a build only ever
# pulls in the transport stack it actually selected. `trace` + `metrics` are the
# signal kinds bitrouter emits and are transport-independent.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry-semantic-conventions = "0.32"
# tracing ↔ OpenTelemetry bridge. Pinned to the 0.33.x line, which targets
# opentelemetry 0.32. https://crates.io/crates/tracing-opentelemetry
tracing-opentelemetry = "0.33"
# Custom OTLP/HTTP client that injects a freshly-resolved bearer per export
# (`otel::auth_client`). Only compiled under `otel-http`. We implement
# `opentelemetry_http::HttpClient` over a `reqwest::Client`, so we depend on
# `opentelemetry-http` (with its `reqwest` impl), `reqwest` itself (matching the
# rustls TLS the `otel-http` otlp stack pins, NOT default-tls), and `bytes` for
# the trait's `Response<Bytes>` body type.
# https://docs.rs/opentelemetry-http/0.32/opentelemetry_http/trait.HttpClient.html
opentelemetry-http = { version = "0.32", features = ["reqwest"] }
bytes = "1"
# OTLP/gRPC transport (tonic). Only compiled under `otel-grpc`; the bulk of the
# gRPC stack arrives through `opentelemetry-otlp/grpc-tonic`. We depend on tonic
# directly solely for `tonic::metadata::MetadataMap`, used to forward the
# configured headers as gRPC request metadata.
tonic = { version = "0.14", default-features = false }
# OTLP/HTTP+protobuf decoding for full-stack tests that inspect the trace
# bodies the observe plugin pushes to the configured collector.
# https://docs.rs/opentelemetry-proto/0.32/
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
# Concurrent map for the exporter's in-flight span table.
dashmap = "6"

# config (sdk `config_file` feature)
serde-saphyr = "0.0.29"
toml = "1.1"

# JsonSchema derives for the wire-shape types in `bitrouter-sdk`. Used by
# downstream crates (notably `bitrouter-cloud`) to publish an OpenAPI spec via
# `aide` without duplicating the wire definitions.
schemars = "1"

# MCP (sdk `mcp` feature) — official Rust MCP SDK.
# Source: <https://github.com/modelcontextprotocol/rust-sdk>
rmcp = { version = "3.0", default-features = false, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
] }

# ACP (sdk `acp` feature): v1 implements ACP as a pure JSON-RPC router over
# newline-delimited stdio per the spec — the official Rust SDK
# (<https://github.com/agentclientprotocol/rust-sdk>) is shaped around
# typed `connect_with(|cx| …)` session callbacks that don't fit a
# request-response `Executor` trait, so we don't pull it in. The spec is the
# source of truth: <https://agentclientprotocol.com/protocol/schema> +
# <https://agentclientprotocol.com/protocol/transports>.

# database — sea-orm is the only database dependency in the workspace.
# bitrouter depends on this high-level ORM abstraction, never on a concrete
# driver: enabling `sqlx-sqlite` / `sqlx-postgres` / `sqlx-mysql` here lets
# the `bitrouter` binary talk to every backend sea-orm supports from one
# build. The schema is defined as `sea-orm-migration` Rust code, not SQL.
sea-orm = { version = "1", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "runtime-tokio-rustls",
] }

# crypto / encoding
sha2 = "0.11"
hmac = "0.13"
ring = "0.17"
base64 = "0.22"
rand = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
tempfile = "3"
atomicwrites = "0.4.4"

# cli / tui
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"

# The profile that `dist` builds release artifacts under (see dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
